name: Temporary Atlas accessibility closure

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]
    paths:
      - 'scripts/.tmp-close-atlas-a11y-20260803.py'
      - '.github/workflows/.tmp-close-atlas-a11y-20260803.yml'

permissions:
  contents: read

concurrency:
  group: temp-atlas-a11y-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verifier/close-atlas-a11y-20260803' &&
      contains(github.event.pull_request.labels.*.name, 'autofix')
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize governed closure
        shell: bash
        run: |
          set -euo pipefail
          python scripts/.tmp-close-atlas-a11y-20260803.py --write
          python - <<'PY'
          from pathlib import Path
          path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          lines = path.read_text(encoding='utf-8').splitlines()
          rules = {
              '| Закрыто (fixed) |': ('187', '189'),
              '| P1 открыто |': ('83', '81'),
              '| Всего открыто (матрица) |': ('171', '169'),
          }
          for prefix, (old, new) in rules.items():
              indexes = [index for index, line in enumerate(lines) if line.startswith(prefix)]
              if len(indexes) != 1:
                  raise SystemExit(f'guard failed: {prefix} count={len(indexes)}')
              index = indexes[0]
              if lines[index].count(old) != 1:
                  raise SystemExit(f'guard failed: {prefix} old value count={lines[index].count(old)}: {lines[index]}')
              lines[index] = lines[index].replace(old, new, 1)
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Validate generated audit state
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python scripts/matrix_coverage_regression_test.py
          python scripts/check_matrix_coverage.py --verbose --json-out /tmp/atlas-a11y-matrix-coverage.json
          python scripts/check_auditrepo_structure.py
          python scripts/validate_audit_repo.py
          python scripts/validate_audit_repo_regression_test.py
          python - <<'PY'
          import subprocess
          expected = {
              'projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md',
              'projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md',
              'projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-03_d69268b2_atlas-a11y-closure.md',
          }
          rows = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          changed = {row[3:] for row in rows if row and not row.endswith('.tmp-close-atlas-a11y-20260803.py') and not row.endswith('.tmp-close-atlas-a11y-20260803.yml')}
          if changed != expected:
              raise SystemExit(f'unexpected generated paths: {sorted(changed)}')
          PY

      - name: Remove transaction transport and validate final diff
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/.tmp-close-atlas-a11y-20260803.py .github/workflows/.tmp-close-atlas-a11y-20260803.yml
          git add \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-03_d69268b2_atlas-a11y-closure.md
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/.tmp-close-atlas-a11y-20260803.yml',
              'scripts/.tmp-close-atlas-a11y-20260803.py',
              'projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md',
              'projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md',
              'projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-03_d69268b2_atlas-a11y-closure.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected staged paths: {sorted(changed)}')
          PY

      - name: Commit and push exact PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'audit-closure-materializer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(gb): close Atlas accessibility findings'
          git push origin "HEAD:${HEAD_REF}"
