name: One-time matrix reconciliation

on:
  push:
    branches: [verifier/matrix-reconcile-20260802]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: verifier/matrix-reconcile-20260802
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic reconciliation
        run: python3 scripts/_matrix_reconcile_once.py
      - name: Remove one-time materializer
        run: rm scripts/_matrix_reconcile_once.py .github/workflows/_matrix-reconcile-once.yml
      - name: Validate final tree
        run: |
          set -o pipefail
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          python3 scripts/check_matrix_coverage.py --verbose --json-out /tmp/matrix-report.json | tee /tmp/matrix-report.log
          test "$(python3 -c 'import json; print(json.load(open("/tmp/matrix-report.json"))["problems"])')" = "0"
          python3 scripts/check_auditrepo_structure.py
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          git diff --name-only HEAD > "${changed_file}"
          AUDITREPO_CHANGED_PATHS_FILE="${changed_file}" python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          git diff --check
      - name: Commit reconciled verifier transaction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(audit): reconcile matrix identity and make coverage truly blocking"
          git push origin HEAD:verifier/matrix-reconcile-20260802
