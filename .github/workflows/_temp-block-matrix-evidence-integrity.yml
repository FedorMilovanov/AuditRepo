name: TEMP Block Matrix Evidence Integrity

on:
  pull_request:
    types: [synchronize, reopened]
    branches: [main]
    paths:
      - scripts/_temp_block_matrix_evidence_integrity.py
      - .github/workflows/_temp-block-matrix-evidence-integrity.yml

permissions:
  contents: write

concurrency:
  group: temp-block-matrix-evidence-integrity
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event.pull_request.head.ref == 'audit/block-matrix-evidence-integrity-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audit lane
        uses: actions/checkout@v4
        with:
          ref: audit/block-matrix-evidence-integrity-20260725
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Keep workflow mutation outside the GITHUB_TOKEN writer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_temp_block_matrix_evidence_integrity.py')
          text = path.read_text(encoding='utf-8')
          start = text.index("workflow = VALIDATE_WORKFLOW.read_text")
          end = text.index("VALIDATE_WORKFLOW.write_text(workflow, encoding='utf-8')", start)
          end += len("VALIDATE_WORKFLOW.write_text(workflow, encoding='utf-8')")
          text = text[:start] + text[end:]
          text = text.replace('for temp in (SELF, TEMP_WORKFLOW):', 'for temp in (SELF,):')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Materialize blocking evidence integrity
        run: python3 scripts/_temp_block_matrix_evidence_integrity.py
      - name: Validate matrix and repository
        run: |
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 scripts/check_matrix_coverage.py --verbose
          test ! -e scripts/_temp_block_matrix_evidence_integrity.py
          git diff --check
      - name: Publish tested matrix transaction
        run: |
          git config user.name "audit-reconciliation-bot"
          git config user.email "audit-reconciliation-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(audit): repair matrix evidence integrity"
          git push origin HEAD:audit/block-matrix-evidence-integrity-20260725
