name: TEMP Fix Matrix Statistics dab31616

on:
  push:
    branches:
      - audit/fix-matrix-statistics-dab31616
    paths:
      - scripts/_temp_fix_matrix_statistics_dab31616.py
      - .github/workflows/_temp-fix-matrix-statistics-dab31616.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - scripts/_temp_fix_matrix_statistics_dab31616.py
      - .github/workflows/_temp-fix-matrix-statistics-dab31616.yml

permissions:
  contents: write

concurrency:
  group: temp-fix-matrix-statistics-dab31616
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'audit/fix-matrix-statistics-dab31616'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact lane
        uses: actions/checkout@v4
        with:
          ref: audit/fix-matrix-statistics-dab31616
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile statistics from section counters
        run: python3 scripts/_temp_fix_matrix_statistics_dab31616.py
      - name: Validate final tree
        run: |
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          test ! -e scripts/_temp_fix_matrix_statistics_dab31616.py
          test ! -e .github/workflows/_temp-fix-matrix-statistics-dab31616.yml
          git diff --check
      - name: Publish tested statistics fix
        run: |
          git config user.name "audit-reconciliation-bot"
          git config user.email "audit-reconciliation-bot@users.noreply.github.com"
          git add -A
          git commit -m "audit: align matrix statistics with canonical section counters"
          git push origin HEAD:audit/fix-matrix-statistics-dab31616
