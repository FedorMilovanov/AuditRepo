name: Temporary SSOT Materializer — 7b462b96

on:
  push:
    branches: ["audit/reconcile-7b462b96-concurrency-20260725"]
    paths:
      - ".github/workflows/_temp-materialize-7b462b96.yml"
      - "scripts/_temp-materialize-7b462b96.py"

permissions:
  contents: write

concurrency:
  group: temp-materialize-7b462b96
  cancel-in-progress: false

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[materialized]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact materializer branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: audit/reconcile-7b462b96-concurrency-20260725
          fetch-depth: 0

      - name: Materialize canonical SSOT files
        run: python3 scripts/_temp-materialize-7b462b96.py

      - name: Remove temporary materializer ownership
        run: |
          rm -f scripts/_temp-materialize-7b462b96.py
          rm -f .github/workflows/_temp-materialize-7b462b96.yml
          test ! -e scripts/_temp-materialize-7b462b96.py
          test ! -e .github/workflows/_temp-materialize-7b462b96.yml

      - name: Validate AuditRepo structure and evidence
        run: |
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 scripts/check_matrix_coverage.py --verbose

      - name: Commit final canonical tree
        run: |
          test -n "$(git status --porcelain)"
          git config user.name "audit-ssot-materializer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "audit: reconcile source 7b462b96 [materialized]"
          git push origin HEAD:audit/reconcile-7b462b96-concurrency-20260725
