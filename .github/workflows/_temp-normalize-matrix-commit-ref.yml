name: TEMP Normalize Matrix Commit Ref

on:
  push:
    branches:
      - audit/fix-matrix-statistics-dab31616
    paths:
      - scripts/_temp_normalize_matrix_commit_ref.py
      - .github/workflows/_temp-normalize-matrix-commit-ref.yml

permissions:
  contents: write

concurrency:
  group: temp-normalize-matrix-commit-ref
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact lane
        uses: actions/checkout@v4
        with:
          ref: audit/fix-matrix-statistics-dab31616
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize commit cell
        run: python3 scripts/_temp_normalize_matrix_commit_ref.py
      - name: Validate final tree
        run: |
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          test ! -e scripts/_temp_normalize_matrix_commit_ref.py
          test ! -e .github/workflows/_temp-normalize-matrix-commit-ref.yml
          git diff --check
      - name: Publish final matrix-only tree
        run: |
          git config user.name "audit-reconciliation-bot"
          git config user.email "audit-reconciliation-bot@users.noreply.github.com"
          git add -A
          git commit -m "audit: normalize final matrix commit reference"
          git push origin HEAD:audit/fix-matrix-statistics-dab31616
