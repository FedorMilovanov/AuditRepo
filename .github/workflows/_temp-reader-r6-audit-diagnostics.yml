name: Temporary Reader R6 Audit Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_temp-reader-r6-audit-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merge ref
        uses: actions/checkout@v4

      - name: Build compact diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY' > reports/reader-r6-audit-diagnostics.txt
          from pathlib import Path
          import re

          path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          lines = path.read_text().splitlines()
          heading_re = re.compile(r'^## (.+?) \((\d+)\)')
          sections = []
          for i, line in enumerate(lines):
              match = heading_re.match(line)
              if match:
                  sections.append((i, match.group(1), int(match.group(2))))

          print('COUNTS')
          for index, (start, name, declared) in enumerate(sections):
              end = sections[index + 1][0] if index + 1 < len(sections) else len(lines)
              rows = [line for line in lines[start + 1:end]
                      if line.startswith('| ') and not line.startswith('|---')
                      and not line.startswith('| ID ') and not line.startswith('| Поле ')]
              print(f'{name}\tdeclared={declared}\tactual={len(rows)}')

          print('\nREADER_REFERENCES')
          for line_no, line in enumerate(lines, 1):
              low = line.lower()
              if 'reader' in low or 'bookmark' in low or 'issue #59' in low or '#59' in low:
                  print(f'{line_no}: {line}')

          print('\nVALIDATORS')
          for script in sorted(Path('scripts').glob('*')):
              if script.is_file():
                  print(script)
          PY
          cat reports/reader-r6-audit-diagnostics.txt

      - name: Run repository validators
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          if test -f scripts/check_matrix_coverage.py; then python3 scripts/check_matrix_coverage.py; fi

      - name: Upload compact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-r6-audit-diagnostics-${{ github.run_id }}
          path: reports/reader-r6-audit-diagnostics.txt
          if-no-files-found: error
          retention-days: 7
