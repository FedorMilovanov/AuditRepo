name: Temporary Reader R6 Audit Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/_temp-reader-r6-audit-diagnostics.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merge ref
        uses: actions/checkout@v4

      - name: Build compact canonical diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          python3 - <<'PY' > reports/reader-r6-audit-diagnostics.txt
          from pathlib import Path
          import re
          import sys

          sys.path.insert(0, str(Path('scripts').resolve()))
          from matrix_coverage_lib import parse_matrix

          path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          text = path.read_text()
          rows, open_ids, closed_rows = parse_matrix(text)

          print('CANONICAL_COUNTS')
          print(f'matrix_ids={len(rows)}')
          print(f'closed_rows={len(closed_rows)}')
          print(f'open_rows={len(open_ids)}')
          for line in text.splitlines():
              if re.match(r'^## .*\(\d+\)', line):
                  print(line)

          print('\nREADER_REFERENCES')
          for line_no, line in enumerate(text.splitlines(), 1):
              low = line.lower()
              if 'reader' in low or 'bookmark' in low or 'issue #59' in low or '#59' in low:
                  print(f'{line_no}: {line}')

          print('\nCANONICAL_READER_IDS')
          for finding_id, row in sorted(rows.items()):
              if 'READER' in finding_id or 'BOOKMARK' in finding_id or 'reader' in row.line.lower() or 'bookmark' in row.line.lower():
                  print(f'{finding_id}\t{row.section}\tline={row.line_no}')
          PY
          cat reports/reader-r6-audit-diagnostics.txt

      - name: Run repository validators
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/check_matrix_coverage.py --warn-only

      - name: Upload compact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-r6-audit-diagnostics-${{ github.run_id }}
          path: reports/reader-r6-audit-diagnostics.txt
          if-no-files-found: error
          retention-days: 7
