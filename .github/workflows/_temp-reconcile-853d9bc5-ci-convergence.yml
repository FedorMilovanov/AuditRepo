name: TEMP Reconcile 853d9bc5 CI Convergence

on:
  push:
    branches:
      - audit/reconcile-853d9bc5-ci-convergence
    paths:
      - scripts/_temp_reconcile_853d9bc5_ci_convergence.py
      - .github/workflows/_temp-reconcile-853d9bc5-ci-convergence.yml

permissions:
  contents: write

concurrency:
  group: temp-reconcile-853d9bc5-ci-convergence
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audit lane
        uses: actions/checkout@v4
        with:
          ref: audit/reconcile-853d9bc5-ci-convergence
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize 853d9bc5 SSOT transaction
        run: python3 scripts/_temp_reconcile_853d9bc5_ci_convergence.py
      - name: Validate final tree
        run: |
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 scripts/check_matrix_coverage.py --verbose
          test ! -e scripts/_temp_reconcile_853d9bc5_ci_convergence.py
          git diff --check
      - name: Publish tested documentation transaction
        run: |
          git config user.name "audit-reconciliation-bot"
          git config user.email "audit-reconciliation-bot@users.noreply.github.com"
          git rm .github/workflows/_temp-reconcile-853d9bc5-ci-convergence.yml
          git add -A
          git diff --cached --check
          git commit -m "audit: reconcile source 853d9bc5 CI convergence"
          git push origin HEAD:audit/reconcile-853d9bc5-ci-convergence
