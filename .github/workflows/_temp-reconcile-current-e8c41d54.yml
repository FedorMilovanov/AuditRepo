name: TEMP Reconcile Current e8c41d54

on:
  push:
    branches:
      - audit/reconcile-current-e8c41d54-20260725
    paths:
      - scripts/_temp_reconcile_current_e8c41d54.py
      - .github/workflows/_temp-reconcile-current-e8c41d54.yml
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - scripts/_temp_reconcile_current_e8c41d54.py
      - .github/workflows/_temp-reconcile-current-e8c41d54.yml

permissions:
  contents: write

concurrency:
  group: temp-reconcile-current-e8c41d54
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'audit/reconcile-current-e8c41d54-20260725'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact audit lane
        uses: actions/checkout@v4
        with:
          ref: audit/reconcile-current-e8c41d54-20260725
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize e8c41d54 SSOT transaction
        run: python3 scripts/_temp_reconcile_current_e8c41d54.py
      - name: Validate final tree before publication
        run: |
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          test ! -e scripts/_temp_reconcile_current_e8c41d54.py
          test ! -e .github/workflows/_temp-reconcile-current-e8c41d54.yml
          git diff --check
      - name: Publish tested documentation transaction
        run: |
          git config user.name "audit-reconciliation-bot"
          git config user.email "audit-reconciliation-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "audit: reconcile current head e8c41d54 after auditor R2"
          git push origin HEAD:audit/reconcile-current-e8c41d54-20260725
