name: TEMP Reconcile source f5e29998

on:
  push:
    branches:
      - audit/_temp-reconcile-f5e29998-20260725
    paths:
      - scripts/_temp_reconcile_f5e29998.py
      - .github/workflows/_temp-reconcile-f5e29998.yml

permissions:
  contents: write

concurrency:
  group: temp-reconcile-f5e29998
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact reconciliation lane
        uses: actions/checkout@v4
        with:
          ref: audit/_temp-reconcile-f5e29998-20260725
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize f5e29998 SSOT transaction
        run: python3 scripts/_temp_reconcile_f5e29998.py
      - name: Validate final tree
        run: |
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 scripts/check_matrix_coverage.py --verbose
          test ! -e scripts/_temp_reconcile_f5e29998.py
          test ! -e .github/workflows/_temp-reconcile-f5e29998.yml
          git diff --check
      - name: Publish prevalidated final tree
        run: |
          git config user.name "audit-reconciliation-bot"
          git config user.email "audit-reconciliation-bot@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "audit: reconcile current head f5e29998 after print closure"
          git push origin HEAD:audit/_temp-reconcile-f5e29998-20260725
