name: Temporary Cache-Bust Policy Reconciler

on:
  pull_request:
    paths:
      - ".github/workflows/_tmp-close-cache-bust-no-writer.yml"
      - "scripts/_tmp_close_cache_bust_no_writer.py"

permissions:
  contents: write

concurrency:
  group: tmp-close-cache-bust-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: agent/close-cache-bust-no-writer-20ded750
          fetch-depth: 0

      - name: Detect reconciliation payload
        id: payload
        shell: bash
        run: |
          if test -f scripts/_tmp_close_cache_bust_no_writer.py; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Cache-bust reconciliation is already materialized."
          fi

      - name: Set up Python 3.12
        if: steps.payload.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Align canonical open-row anchor
        if: steps.payload.outputs.present == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('scripts/_tmp_close_cache_bust_no_writer.py')
          text = path.read_text(encoding='utf-8')
          lines = [
              '    open_row = (',
              '        "| CACHE-BUST-NO-WRITER | 🆕🟠 **Рецидив находки 2026-07-11.** `audit-pro.js` = 114 ошибок, доминирует `Cache-bust mismatch` по `nagornaya/**`, `rodosloviye/`, `pastor-series/`, `karty/` (`?v=` хэши устарели). "',
              '        "`node scripts/cache-bust.js --write` регенерирует **82 файла** → mismatch 0. Ни один workflow не делает `cache-bust --write`+commit (indexnow/editorial-metadata только *проверяют*; шаг cache-bust в deploy — no-op «skip if IndexNow did it») → каждый concurrent asset-пуш оставляет main красным. "',
              '        "Ровно то, что предсказано в session-log 07-11 (`9fce2bc`) как follow-up — **повторилось**. Fix (owner-decision, пайплайн): `cache-bust --write`+auto-commit в metadata-workflow. | verified-source + verified-build; session-log 2026-07-11 |\\n"',
              '    )',
              '    closed_row = (',
          ]
          replacement = '\n'.join(lines) + '\n'
          patched, count = re.subn(
              r'    open_row = \(\n.*?\n    \)\n    closed_row = \(\n',
              lambda _match: replacement,
              text,
              count=1,
              flags=re.DOTALL,
          )
          if count != 1:
              raise SystemExit(f'canonical anchor structural patch expected one block, found {count}')
          path.write_text(patched, encoding='utf-8')
          PY

      - name: Apply guarded SSOT reconciliation
        id: apply
        if: steps.payload.outputs.present == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/_tmp_close_cache_bust_no_writer.py 2>&1 | tee /tmp/cache-bust-reconciler.log

      - name: Upload reconciler diagnostic
        if: steps.payload.outputs.present == 'true' && steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cache-bust-reconciler-diagnostic-${{ github.run_id }}
          path: /tmp/cache-bust-reconciler.log
          if-no-files-found: error

      - name: Stop after reconciler failure
        if: steps.payload.outputs.present == 'true' && steps.apply.outcome == 'failure'
        run: exit 1

      - name: Remove exact transient root artifact
        id: cleanup
        if: steps.payload.outputs.present == 'true' && steps.apply.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            set -u
            if test -d verified; then
              echo 'Transient root verified/ detected.'
              echo '--- tracked entries ---'
              git ls-files --stage -- verified || true
              echo '--- ignore source ---'
              git check-ignore -v verified/GILL_PRIMARY_SOURCE_AND_PRODUCTION_CLOSURE_2026-07-24.md || true
              echo '--- all entries ---'
              find verified -maxdepth 4 -printf '%y|%P|%l\n' | sort
              tracked="$(git ls-files -- verified)"
              printf 'tracked=%q\n' "$tracked"
              test -z "$tracked"
              mapfile -t files < <(find verified -type f -printf '%P\n' | sort)
              printf 'file_count=%s\n' "${#files[@]}"
              printf 'files=%s\n' "${files[*]-}"
              test "${#files[@]}" -eq 1
              test "${files[0]}" = "GILL_PRIMARY_SOURCE_AND_PRODUCTION_CLOSURE_2026-07-24.md"
              rm -rf verified
              echo 'Removed exact untracked transient Gill evidence copy.'
            else
              echo 'No transient root verified/ directory.'
            fi
          } 2>&1 | tee /tmp/cache-bust-cleanup.log

      - name: Upload cleanup diagnostic
        if: steps.payload.outputs.present == 'true' && steps.apply.outcome == 'success' && steps.cleanup.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cache-bust-cleanup-diagnostic-${{ github.run_id }}
          path: /tmp/cache-bust-cleanup.log
          if-no-files-found: error

      - name: Stop after cleanup failure
        if: steps.payload.outputs.present == 'true' && steps.apply.outcome == 'success' && steps.cleanup.outcome == 'failure'
        run: exit 1

      - name: Validate AuditRepo structure and rules
        id: validate
        if: steps.payload.outputs.present == 'true' && steps.apply.outcome == 'success' && steps.cleanup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python3 scripts/check_auditrepo_structure.py
            python3 scripts/validate_audit_repo.py
          } 2>&1 | tee /tmp/cache-bust-validation.log

      - name: Upload validation diagnostic
        if: steps.payload.outputs.present == 'true' && steps.apply.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.validate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cache-bust-validation-diagnostic-${{ github.run_id }}
          path: /tmp/cache-bust-validation.log
          if-no-files-found: error

      - name: Stop after validation failure
        if: steps.payload.outputs.present == 'true' && steps.apply.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.validate.outcome == 'failure'
        run: exit 1

      - name: Validate matrix coverage and contexts
        if: steps.payload.outputs.present == 'true' && steps.apply.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/matrix-coverage
          python3 scripts/check_matrix_coverage.py \
            --warn-only \
            --verbose \
            --json-out /tmp/matrix-coverage/report.json \
            | tee /tmp/matrix-coverage/report.log
          python3 scripts/matrix_coverage_contexts.py \
            --json-out /tmp/matrix-coverage/contexts.json \
            --markdown-out /tmp/matrix-coverage/contexts.md
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/matrix-coverage/report.json').read_text(encoding='utf-8'))
          problems = report.get('problems') or report.get('coverage_problems') or []
          if problems:
              raise SystemExit(f"matrix coverage problems: {problems}")
          contexts = json.loads(Path('/tmp/matrix-coverage/contexts.json').read_text(encoding='utf-8'))
          unresolved = contexts.get('unresolved') or contexts.get('problems') or []
          if unresolved:
              raise SystemExit(f"unresolved evidence contexts: {unresolved}")
          print('Matrix coverage and evidence contexts contain zero problems.')
          PY

      - name: Verify exact permanent scope
        if: steps.payload.outputs.present == 'true' && steps.apply.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          test ! -e scripts/_tmp_close_cache_bust_no_writer.py
          test -f projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-07-24_20ded750_cache-bust-fail-closed.md
          test ! -e verified
          git diff --check
          git status --short

      - name: Commit permanent reconciliation
        if: steps.payload.outputs.present == 'true' && steps.apply.outcome == 'success' && steps.cleanup.outcome == 'success' && steps.validate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(audit): close cache-bust writer P1"
          git push origin HEAD:agent/close-cache-bust-no-writer-20ded750
