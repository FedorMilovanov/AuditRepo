name: AuditRepo Deep Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'

permissions:
  contents: read
  pull-requests: read

jobs:
  matrix-evidence-coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Validate structure and repository rules
        run: |
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py

      - name: Run full matrix/evidence coverage for every governed project
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py

          mapfile -t project_matrices < <(
            find projects \
              -mindepth 3 \
              -maxdepth 3 \
              -type f \
              -path 'projects/*/verified/MASTER_BUG_MATRIX.md' \
              ! -path 'projects/_templates/*' \
              -print \
              | LC_ALL=C sort
          )
          if [[ "${#project_matrices[@]}" -eq 0 ]]; then
            echo 'No governed project matrices found; refusing zero-work deep audit' >&2
            exit 1
          fi

          mkdir -p reports/matrix-coverage
          printf '%s\n' "${project_matrices[@]}" > reports/matrix-coverage/projects.txt

          for matrix in "${project_matrices[@]}"; do
            project="${matrix%/verified/MASTER_BUG_MATRIX.md}"
            slug="${project#projects/}"
            case "${slug}" in
              ''|_*|*/*)
                echo "Unsafe or template project slug discovered: ${slug}" >&2
                exit 1
                ;;
            esac

            out="reports/matrix-coverage/${slug}"
            mkdir -p "${out}"
            echo "=== matrix/evidence coverage: ${project} ==="
            python3 scripts/check_matrix_coverage.py \
              --project "${project}" \
              --verbose \
              --json-out "${out}/report.json" \
              | tee "${out}/report.log"
            python3 scripts/matrix_coverage_contexts.py \
              --project "${project}" \
              --json-out "${out}/contexts.json" \
              --markdown-out "${out}/contexts.md"
          done

      - name: Upload matrix diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deep-matrix-coverage-${{ github.run_id }}
          path: reports/matrix-coverage/**
          if-no-files-found: error
          retention-days: 30

  repository-history-forensic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'

      - name: Validate forensic owners
        run: |
          node --check scripts/repository_history_forensic_audit.mjs
          node --check scripts/repository_history_forensic_audit_regression_test.mjs
          node scripts/repository_history_forensic_audit_regression_test.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('projects/gb-is-my-strength/verified/closed-unmerged-pr-dispositions.json', 'utf8'))"

      - name: Inventory branches and closed unmerged PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/repository_history_forensic_audit.mjs --strict

      - name: Verify tracked tree is unchanged
        run: git diff --exit-code

      - name: Upload forensic inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auditrepo-history-forensic-${{ github.run_id }}
          path: |
            reports/repository-history-forensic-audit.json
            reports/repository-history-forensic-audit.md
          if-no-files-found: error
          retention-days: 30

# Deep checks remain available and regular, but they no longer block every
# ordinary documentation, intake or classification PR.
