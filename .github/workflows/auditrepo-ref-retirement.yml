name: AuditRepo Ref Retirement

on:
  push:
    branches: [main]
    paths:
      - 'references/ref-retirement/requests/*.json'
  pull_request:
    branches: [main]
    types: [labeled]
    paths:
      - '.github/workflows/auditrepo-ref-retirement.yml'
      - 'scripts/retire_reviewed_refs.py'
      - 'scripts/retire_reviewed_refs_regression_test.py'
      - 'references/ref-retirement/README.md'
      - 'references/ref-retirement/requests/*.json'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: auditrepo-ref-retirement
  cancel-in-progress: false

jobs:
  retire-reviewed-refs:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'labeled' &&
       github.event.label.name == 'execute-ref-retirement' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select exactly one reviewed request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABEL_NAME: ${{ github.event.label.name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            push)
              if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
                echo "Push execution is restricted to main" >&2
                exit 1
              fi
              current_main="${GITHUB_SHA}"
              mapfile -t requests < <(
                git diff --name-only --diff-filter=AM "${BEFORE_SHA}" "${GITHUB_SHA}" -- \
                  'references/ref-retirement/requests/*.json'
              )
              ;;
            pull_request)
              if [[ "${LABEL_NAME}" != "execute-ref-retirement" ]]; then
                echo "Wrong execution label: ${LABEL_NAME}" >&2
                exit 1
              fi
              if [[ "${HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ]]; then
                echo "Ref retirement is restricted to same-repository pull requests" >&2
                exit 1
              fi
              current_main="${BASE_SHA}"
              mapfile -t requests < <(
                git diff --name-only --diff-filter=AM "${BASE_SHA}" "${HEAD_SHA}" -- \
                  'references/ref-retirement/requests/*.json'
              )
              ;;
            *)
              echo "Unsupported event: ${EVENT_NAME}" >&2
              exit 1
              ;;
          esac

          if [[ "${#requests[@]}" -ne 1 ]]; then
            printf 'Expected exactly one added/modified retirement request, found %s\n' "${#requests[@]}" >&2
            printf '%s\n' "${requests[@]}" >&2
            exit 1
          fi

          request_path="${requests[0]}"
          test -f "${request_path}"
          evidence_path="reports/ref-retirement/$(basename "${request_path}" .json)-evidence.json"
          echo "request_path=${request_path}" >> "${GITHUB_OUTPUT}"
          echo "current_main_sha=${current_main}" >> "${GITHUB_OUTPUT}"
          echo "evidence_path=${evidence_path}" >> "${GITHUB_OUTPUT}"
          echo "Selected ${request_path} against main ${current_main}"

      - name: Compile and validate repository before mutation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check_auditrepo_structure.py \
            scripts/validate_audit_repo.py \
            scripts/validate_audit_repo_regression_test.py \
            scripts/scaffold_intake.py \
            scripts/scaffold_project.py \
            scripts/scaffold_regression_test.py \
            scripts/retire_reviewed_refs.py \
            scripts/retire_reviewed_refs_regression_test.py
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 scripts/scaffold_regression_test.py
          python3 scripts/retire_reviewed_refs_regression_test.py
          # Reviewed retirement targets may intentionally remain unreconciled
          # until the engine verifies and deletes them. Preserve the report,
          # but reserve strict zero-debt enforcement for the post-delete pass.
          node scripts/repository_history_forensic_audit.mjs

      - name: Preflight, retire and live-verify reviewed refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/retire_reviewed_refs.py \
            --request '${{ steps.request.outputs.request_path }}' \
            --current-main '${{ steps.request.outputs.current_main_sha }}' \
            --evidence-out '${{ steps.request.outputs.evidence_path }}' \
            --execute

      - name: Refresh remote refs after retirement
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'

      - name: Run post-retirement deep audit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVIDENCE_PATH: ${{ steps.request.outputs.evidence_path }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py \
            --verbose \
            --json-out reports/matrix-coverage/report.json \
            | tee reports/matrix-coverage/report.log
          python3 scripts/matrix_coverage_contexts.py \
            --json-out reports/matrix-coverage/contexts.json \
            --markdown-out reports/matrix-coverage/contexts.md
          node scripts/repository_history_forensic_audit.mjs --strict

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path(os.environ['EVIDENCE_PATH']).read_text(encoding='utf-8'))
          report = json.loads(
              Path('reports/repository-history-forensic-audit.json').read_text(encoding='utf-8')
          )
          summary = report['summary']
          if summary['inaccessibleClosedHeads'] != 0:
              raise SystemExit(f'inaccessible closed PR heads remain: {summary["inaccessibleClosedHeads"]}')
          if summary['manualReviewCandidates'] != 0:
              raise SystemExit(f'manual closed-PR candidates remain: {summary["manualReviewCandidates"]}')

          allowed_unexplained = set(evidence.get('openPullRequestHeads', []))
          unexplained = {
              branch['name'].removeprefix('origin/')
              for branch in report['branches']
              if branch['reconciliation'] in {
                  'orphan-branch', 'closed-parked-pr-head', 'closed-unclassified-pr-head'
              }
          }
          unexpected = sorted(unexplained - allowed_unexplained)
          if unexpected:
              raise SystemExit(f'unexpected unexplained refs remain: {unexpected}')
          print(json.dumps(summary, indent=2))
          PY

      - name: Verify clean tracked tree
        run: git diff --exit-code

      - name: Upload retirement and deep-audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditrepo-ref-retirement-${{ github.run_id }}
          path: |
            reports/ref-retirement/**
            reports/matrix-coverage/**
            reports/repository-history-forensic-audit.json
            reports/repository-history-forensic-audit.md
          if-no-files-found: warn
          retention-days: 90
