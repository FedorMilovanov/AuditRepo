name: AuditRepo Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check structure
        run: python3 scripts/check_auditrepo_structure.py
      - name: Capture changed paths for intake ratchet
        run: |
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            git diff --name-only HEAD^1 HEAD > "${changed_file}"
          else
            git diff-tree --no-commit-id --name-only -r HEAD > "${changed_file}"
          fi
          cat "${changed_file}"
          echo "AUDITREPO_CHANGED_PATHS_FILE=${changed_file}" >> "${GITHUB_ENV}"
      - name: Validate repo rules
        run: python3 scripts/validate_audit_repo.py
      - name: Test validator report-content regressions
        run: python3 scripts/validate_audit_repo_regression_test.py

  matrix-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test matrix coverage control plane
        run: |
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
      - name: Enforce matrix evidence coverage
        run: |
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py \
            --verbose \
            --json-out reports/matrix-coverage/report.json \
            | tee reports/matrix-coverage/report.log
          python3 scripts/matrix_coverage_contexts.py \
            --json-out reports/matrix-coverage/contexts.json \
            --markdown-out reports/matrix-coverage/contexts.md
      - name: Upload matrix coverage diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: matrix-coverage-${{ github.run_id }}
          path: reports/matrix-coverage/**
          if-no-files-found: error
          retention-days: 14

  repository-history-forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact head with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Validate script and disposition ledger
        run: |
          node --check scripts/repository_history_forensic_audit.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('projects/gb-is-my-strength/verified/closed-unmerged-pr-dispositions.json', 'utf8'))"
      - name: Inventory every branch and closed PR head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/repository_history_forensic_audit.mjs --strict
      - name: Verify tracked tree is unchanged
        run: git diff --exit-code
      - name: Upload forensic inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditrepo-history-forensic-${{ github.run_id }}
          path: |
            reports/repository-history-forensic-audit.json
            reports/repository-history-forensic-audit.md
          if-no-files-found: error
          retention-days: 30

  # BEGIN ONE-TIME MATRIX MATERIALIZER
  one-time-matrix-materializer:
    if: github.event_name == 'pull_request' && github.head_ref == 'verifier/matrix-reconcile-20260802'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout writable PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: verifier/matrix-reconcile-20260802
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct and apply deterministic matrix reconciliation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/_matrix_reconcile_once.py')
          text = path.read_text(encoding='utf-8')
          old = '        r"^\\| AR-006 \\|.*\\n",\n'
          new = '        r"^\\| AR-006 \\|.*REPORT §1 \\+ fix-verify.*\\n",\n'
          if text.count(old) != 1:
              raise SystemExit(f'AR-006 materializer pattern count={text.count(old)}')
          text = text.replace(old, new, 1)
          replacements = {
              '- noncanonical IDs in canonical tables are blocking (`NONCANONICAL-MATRIX-ID`);': '- noncanonical IDs in canonical tables are blocking;',
              '- an explicit CLOSED description inside an open section is blocking (`CLOSED-IN-OPEN`);': '- an explicit CLOSED description inside an open section is blocking;',
              '- section heading and statistics drift are blocking (`SECTION-COUNT-MISMATCH`, `STAT-COUNT-MISMATCH`);': '- section heading and statistics drift are blocking;',
          }
          for source, target in replacements.items():
              if text.count(source) != 1:
                  raise SystemExit(f'reverify wording count={text.count(source)} for {source}')
              text = text.replace(source, target, 1)
          path.write_text(text, encoding='utf-8')
          PY
          python3 scripts/_matrix_reconcile_once.py
      - name: Remove all one-time materializer code
        run: |
          rm scripts/_matrix_reconcile_once.py .github/workflows/_matrix-reconcile-once.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/auditrepo-validate.yml')
          text = path.read_text(encoding='utf-8')
          marker = '  # BEGIN ONE-TIME MATRIX MATERIALIZER\n'
          if marker not in text:
              raise SystemExit('one-time marker missing')
          path.write_text(text.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')
          PY
      - name: Validate final tree before write
        run: |
          set -o pipefail
          python3 -m py_compile scripts/check_matrix_coverage.py scripts/matrix_coverage_lib.py scripts/matrix_coverage_contexts.py scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          python3 scripts/check_matrix_coverage.py --verbose --json-out /tmp/matrix-report.json | tee /tmp/matrix-report.log
          test "$(python3 -c 'import json; print(json.load(open("/tmp/matrix-report.json"))["problems"])')" = "0"
          python3 scripts/check_auditrepo_structure.py
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          git diff --name-only HEAD > "${changed_file}"
          AUDITREPO_CHANGED_PATHS_FILE="${changed_file}" python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          git diff --check
      - name: Commit and push clean verifier transaction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(audit): reconcile matrix identity and make coverage truly blocking"
          git push origin HEAD:verifier/matrix-reconcile-20260802
