name: AuditRepo Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: auditrepo-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture changed paths
        shell: bash
        run: |
          set -euo pipefail
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            git diff --name-only HEAD^1 HEAD > "${changed_file}"
          else
            git diff-tree --no-commit-id --name-only -r HEAD > "${changed_file}"
          fi
          cat "${changed_file}"
          echo "AUDITREPO_CHANGED_PATHS_FILE=${changed_file}" >> "${GITHUB_ENV}"

          if grep -Eq '(^|/)MASTER_BUG_MATRIX\.md$|(^|/)finding-aliases\.json$|^scripts/(check_matrix_coverage|matrix_coverage_)|^\.github/workflows/auditrepo-deep-audit\.yml$' "${changed_file}"; then
            echo "RUN_MATRIX_COVERAGE=1" >> "${GITHUB_ENV}"
          else
            echo "RUN_MATRIX_COVERAGE=0" >> "${GITHUB_ENV}"
          fi

      - name: Compile core Python tools
        run: |
          python3 -m py_compile \
            scripts/validate_audit_repo.py \
            scripts/validate_audit_repo_regression_test.py \
            scripts/scaffold_intake.py \
            scripts/scaffold_project.py \
            scripts/scaffold_regression_test.py

      - name: Check structure
        run: python3 scripts/check_auditrepo_structure.py

      - name: Validate repository rules
        run: python3 scripts/validate_audit_repo.py

      - name: Test validator regressions
        run: python3 scripts/validate_audit_repo_regression_test.py

      - name: Test scaffold regressions
        run: python3 scripts/scaffold_regression_test.py

      - name: Validate matrix/evidence owners when changed
        if: env.RUN_MATRIX_COVERAGE == '1'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py \
            --verbose \
            --json-out reports/matrix-coverage/report.json \
            | tee reports/matrix-coverage/report.log
          python3 scripts/matrix_coverage_contexts.py \
            --json-out reports/matrix-coverage/contexts.json \
            --markdown-out reports/matrix-coverage/contexts.md

      - name: Upload matrix diagnostics when produced
        if: always() && env.RUN_MATRIX_COVERAGE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: matrix-coverage-${{ github.run_id }}
          path: reports/matrix-coverage/**
          if-no-files-found: error
          retention-days: 14

      - name: Verify clean tracked tree
        run: git diff --exit-code

# Full matrix/evidence coverage and repository-history forensic are intentionally
# periodic/manual in auditrepo-deep-audit.yml. Ordinary documentation and intake
# PRs should not pay for a complete live branch/closed-PR inventory.
