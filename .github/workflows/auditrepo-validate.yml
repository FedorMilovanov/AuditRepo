name: AuditRepo Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check structure
        run: python3 scripts/check_auditrepo_structure.py
      - name: Capture changed paths for intake ratchet
        run: |
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            git diff --name-only HEAD^1 HEAD > "${changed_file}"
          else
            git diff-tree --no-commit-id --name-only -r HEAD > "${changed_file}"
          fi
          cat "${changed_file}"
          echo "AUDITREPO_CHANGED_PATHS_FILE=${changed_file}" >> "${GITHUB_ENV}"
      - name: Validate repo rules
        run: python3 scripts/validate_audit_repo.py
      - name: Test validator report-content regressions
        run: python3 scripts/validate_audit_repo_regression_test.py

  matrix-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test matrix coverage control plane
        run: |
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
      - name: Enforce matrix evidence coverage
        run: |
          set -o pipefail
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py \
            --verbose \
            --json-out reports/matrix-coverage/report.json \
            | tee reports/matrix-coverage/report.log
          python3 scripts/matrix_coverage_contexts.py \
            --json-out reports/matrix-coverage/contexts.json \
            --markdown-out reports/matrix-coverage/contexts.md
      - name: Upload matrix coverage diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: matrix-coverage-${{ github.run_id }}
          path: reports/matrix-coverage/**
          if-no-files-found: error
          retention-days: 14

  repository-history-forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact head with complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Validate script and disposition ledger
        run: |
          node --check scripts/repository_history_forensic_audit.mjs
          node -e "JSON.parse(require('node:fs').readFileSync('projects/gb-is-my-strength/verified/closed-unmerged-pr-dispositions.json', 'utf8'))"
      - name: Inventory every branch and closed PR head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/repository_history_forensic_audit.mjs --strict
      - name: Verify tracked tree is unchanged
        run: git diff --exit-code
      - name: Upload forensic inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditrepo-history-forensic-${{ github.run_id }}
          path: |
            reports/repository-history-forensic-audit.json
            reports/repository-history-forensic-audit.md
          if-no-files-found: error
          retention-days: 30

  reconcile-pr156-readonly:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/run-reconcile-pr156-readonly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout trusted helper from current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Copy helper outside the mutable worktree
        run: cp scripts/reconcile_pr156_artifact.py "${RUNNER_TEMP}/reconcile_pr156_artifact.py"
      - name: Configure disposable merge identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build and validate exact reconciled tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 "${RUNNER_TEMP}/reconcile_pr156_artifact.py"
      - name: Guard and push the exact two-parent merge
        run: |
          set -euo pipefail
          expected_tree=8c829dfa7522fbb37c87ac3d93c66b22ee9f1c46
          expected_search=aba0b1f43201875654d9f39b3cae0fe87e281acc
          actual_tree=$(git write-tree)
          test "${actual_tree}" = "${expected_tree}"
          test "$(git rev-parse HEAD)" = "${expected_search}"
          main_sha=$(git rev-parse origin/main)
          git diff --cached --check
          git commit -m "audit(search): reconcile promotion with canonical main"
          test "$(git rev-parse HEAD^1)" = "${expected_search}"
          test "$(git rev-parse HEAD^2)" = "${main_sha}"
          test "$(git rev-parse HEAD^{tree})" = "${expected_tree}"
          git push origin HEAD:arena/019fccbd-auditrepo
      - name: Upload exact reconciliation artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr156-reconciliation-${{ github.run_id }}
          path: /tmp/reconcile-output/**
          if-no-files-found: error
          retention-days: 3
