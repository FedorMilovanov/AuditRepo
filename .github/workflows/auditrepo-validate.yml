name: AuditRepo Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tts-production-closure:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 167 && github.head_ref == 'lane/tts-production-closure-20260805'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@v4
        with:
          ref: lane/tts-production-closure-20260805
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact lane and transport files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_HEAD_REF" = "lane/tts-production-closure-20260805"
          test "$(git status --porcelain)" = ""
          test -f scripts/tts_production_closure_executor.py
          test -f .github/workflows/auditrepo-validate.yml
      - name: Align executor with release-manifest TTS schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/tts_production_closure_executor.py')
          text = path.read_text(encoding='utf-8')
          old = '''    required_tts_keys = {"controller", "engine", "worker", "noticeCss"}\n    if not required_tts_keys.issubset(tts):\n        fail(f"live manifest TTS extension missing keys: {sorted(required_tts_keys - set(tts))}")\n'''
          new = '''    assets = tts.get("assets")\n    if not isinstance(assets, dict):\n        fail("live manifest TTS assets are missing")\n    required_tts_keys = {"controller", "engine", "worker", "noticeCss", "serviceWorker"}\n    if not required_tts_keys.issubset(assets):\n        fail(f"live manifest TTS extension missing asset keys: {sorted(required_tts_keys - set(assets))}")\n    if tts.get("lazyNoPrecache") != ["css/tts-download-notice.css", "js/vosk-tts-engine.js", "js/vosk-tts-worker.js"]:\n        fail("live manifest TTS lazy-no-precache contract drifted")\n'''
          if text.count(old) != 1:
              raise SystemExit('executor schema patch did not match exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python3 -m py_compile scripts/tts_production_closure_executor.py
      - name: Verify production evidence and write canonical closure
        env:
          GH_TOKEN: ${{ github.token }}
        run: GITHUB_REF_NAME='' python3 scripts/tts_production_closure_executor.py
      - name: Validate exact closure transaction
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          git diff --check
          test "$(grep -c '^| TTS-DL-UNZIP-SYNC |' projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md)" = "1"
          test "$(grep -c '^| TTS-DL-NO-TABLOCK |' projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md)" = "1"
          grep -F '## ✅ ЗАКРЫТО (225)' projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md
          grep -F '## 🟡 P2 — ОТКРЫТО (30)' projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md
          grep -F '| **Всего открыто (матрица)** | **146** |' projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md
      - name: Restore trusted workflow and commit permanent result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin '+main:refs/remotes/origin/main'
          git show origin/main:.github/workflows/auditrepo-validate.yml > .github/workflows/auditrepo-validate.yml
          git rm -f scripts/tts_production_closure_executor.py
          test ! -e scripts/tts_production_closure_executor.py
          git add .github/workflows/auditrepo-validate.yml
          git add projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md
          git add projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md
          git add projects/gb-is-my-strength/incoming/tts-deep-current-head-audit-2026-08-04/CLOSURE.md
          git add projects/gb-is-my-strength/incoming/tts-deep-current-head-audit-2026-08-04/FINAL-VALIDATION.md
          git add projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-05_38b25703_tts-production-closure.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No permanent closure diff produced' >&2; exit 1; }
          git commit -m 'audit(tts): close delivery runtime on production'
          git push origin HEAD:lane/tts-production-closure-20260805
