name: AuditRepo Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: auditrepo-validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Strict history validation proves ancestry for old landed commits and
          # classifies every remote branch. A shallow clone produces false
          # non-ancestor/orphan findings.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Capture changed paths
        shell: bash
        run: |
          set -euo pipefail
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          if git rev-parse HEAD^1 >/dev/null 2>&1; then
            git diff --name-only HEAD^1 HEAD > "${changed_file}"
          else
            git diff-tree --no-commit-id --name-only -r HEAD > "${changed_file}"
          fi
          cat "${changed_file}"
          echo "AUDITREPO_CHANGED_PATHS_FILE=${changed_file}" >> "${GITHUB_ENV}"

          if grep -Eq '(^|/)MASTER_BUG_MATRIX\.md$|(^|/)finding-aliases\.json$|^scripts/(check_matrix_coverage|matrix_coverage_)|^\.github/workflows/auditrepo-deep-audit\.yml$' "${changed_file}"; then
            echo "RUN_MATRIX_COVERAGE=1" >> "${GITHUB_ENV}"
          else
            echo "RUN_MATRIX_COVERAGE=0" >> "${GITHUB_ENV}"
          fi

          if grep -Eq '^references/ref-retirement/results/|^scripts/repository_history_forensic_audit(_regression_test)?\.mjs$|^projects/gb-is-my-strength/verified/closed-unmerged-pr-dispositions\.json$' "${changed_file}"; then
            echo "RUN_REF_FORENSIC=1" >> "${GITHUB_ENV}"
          else
            echo "RUN_REF_FORENSIC=0" >> "${GITHUB_ENV}"
          fi

      - name: Compile core Python tools
        run: |
          python3 -m py_compile \
            scripts/check_workflow_syntax.py \
            scripts/check_workflow_syntax_regression_test.py \
            scripts/validate_audit_repo.py \
            scripts/validate_audit_repo_regression_test.py \
            scripts/scaffold_intake.py \
            scripts/scaffold_project.py \
            scripts/scaffold_regression_test.py \
            scripts/retire_reviewed_refs.py \
            scripts/retire_reviewed_refs_regression_test.py

      - name: Check structure
        run: python3 scripts/check_auditrepo_structure.py

      - name: Validate workflow syntax and immutable action pins
        run: |
          python3 scripts/check_workflow_syntax_regression_test.py
          python3 scripts/check_workflow_syntax.py

      - name: Validate repository rules
        run: python3 scripts/validate_audit_repo.py

      - name: Test validator regressions
        run: python3 scripts/validate_audit_repo_regression_test.py

      - name: Test scaffold regressions
        run: python3 scripts/scaffold_regression_test.py

      - name: Test ref-retirement regressions
        run: python3 scripts/retire_reviewed_refs_regression_test.py

      - name: Validate retirement result history
        if: env.RUN_REF_FORENSIC == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/repository_history_forensic_audit_regression_test.mjs
          node scripts/repository_history_forensic_audit.mjs --strict
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path('reports/repository-history-forensic-audit.json').read_text(encoding='utf-8')
          )
          summary = report['summary']
          required_zero = (
              'inaccessibleClosedHeads',
              'manualReviewCandidates',
              'unexplainedRemoteBranches',
          )
          failures = {key: summary[key] for key in required_zero if summary[key] != 0}
          if failures:
              raise SystemExit(f'ref-retirement forensic debt remains: {failures}')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload ref-retirement forensic diagnostics
        if: always() && env.RUN_REF_FORENSIC == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ref-retirement-forensic-${{ github.run_id }}
          path: |
            reports/repository-history-forensic-audit.json
            reports/repository-history-forensic-audit.md
          # The semantic validation step owns failure. Artifact absence must not
          # add a second, misleading failure when setup ended early.
          if-no-files-found: warn
          retention-days: 30

      - name: Validate matrix/evidence owners when changed
        id: matrix_coverage
        if: always() && !cancelled() && env.RUN_MATRIX_COVERAGE == '1'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/matrix-coverage
          printf 'matrix coverage started\n' > reports/matrix-coverage/status.txt
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          python3 scripts/check_matrix_coverage.py \
            --verbose \
            --json-out reports/matrix-coverage/report.json \
            | tee reports/matrix-coverage/report.log
          python3 scripts/matrix_coverage_contexts.py \
            --json-out reports/matrix-coverage/contexts.json \
            --markdown-out reports/matrix-coverage/contexts.md
          printf 'matrix coverage completed\n' > reports/matrix-coverage/status.txt

      - name: Upload matrix diagnostics when produced
        if: always() && env.RUN_MATRIX_COVERAGE == '1' && steps.matrix_coverage.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: matrix-coverage-${{ github.run_id }}
          path: reports/matrix-coverage/**
          if-no-files-found: warn
          retention-days: 14

      - name: Verify clean tracked tree
        run: git diff --exit-code

# Full matrix/evidence coverage and repository-history forensic are intentionally
# periodic/manual in auditrepo-deep-audit.yml. Ordinary documentation and intake
# PRs should not pay for a complete live branch/closed-PR inventory. A retirement
# result is the exception: it must prove the final remote Git graph immediately.
