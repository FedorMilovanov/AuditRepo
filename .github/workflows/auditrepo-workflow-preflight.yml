name: AuditRepo Workflow Preflight

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 4 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auditrepo-workflow-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full Git history for exposed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"

      - name: Check workflow syntax, shape and action pins
        run: |
          python3 -m py_compile \
            scripts/check_workflow_syntax.py \
            scripts/check_workflow_syntax_regression_test.py
          python3 scripts/check_workflow_syntax_regression_test.py
          python3 scripts/check_workflow_syntax.py

      - name: Verify clean tracked tree
        run: git diff --exit-code
