name: One-shot workflow policy verifier PR

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/close-workflow-policy-shadow-era.yml
      - .github/workflows/close-workflow-policy-shadow-era-pr.yml

permissions:
  contents: write

concurrency:
  group: workflow-policy-shadow-era-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-and-close:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/close-workflow-policy-shadow-era-20260801'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verifier branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute reviewed verifier projection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/close-workflow-policy-shadow-era.yml').read_text(encoding='utf-8')
          opener = "          python3 - <<'PY'\n"
          closer = "\n          PY\n"
          start = workflow.index(opener) + len(opener)
          end = workflow.index(closer, start)
          block = workflow[start:end]
          code = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          ) + '\n'
          Path('/tmp/close-workflow-policy-shadow-era.py').write_text(code, encoding='utf-8')
          compile(code, '/tmp/close-workflow-policy-shadow-era.py', 'exec')
          PY
          python3 /tmp/close-workflow-policy-shadow-era.py
          rm .github/workflows/close-workflow-policy-shadow-era-pr.yml

      - name: Validate exact verifier surface
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            ".github/workflows/close-workflow-policy-shadow-era-pr.yml"
            ".github/workflows/close-workflow-policy-shadow-era.yml"
            "projects/gb-is-my-strength/reverify/WORKFLOW_POLICY_SHADOW_ERA_CLOSURE_2026-08-01_0ff04232.md"
            "projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

          final_paths="${RUNNER_TEMP}/auditrepo-final-paths.txt"
          printf '%s\n' "${changed[@]}" \
            | grep -v '^\.github/workflows/close-workflow-policy-shadow-era' \
            > "${final_paths}"
          diff -u <(printf '%s\n' \
            "projects/gb-is-my-strength/reverify/WORKFLOW_POLICY_SHADOW_ERA_CLOSURE_2026-08-01_0ff04232.md" \
            "projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md") \
            <(sort "${final_paths}")

          python3 scripts/check_auditrepo_structure.py
          AUDITREPO_CHANGED_PATHS_FILE="${final_paths}" python3 scripts/validate_audit_repo.py
          AUDITREPO_CHANGED_PATHS_FILE="${final_paths}" python3 scripts/validate_audit_repo_regression_test.py
          git diff --check

      - name: Commit verified closure and remove generators
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "audit(gb): close workflow policy shadow era"
          git push origin "HEAD:${HEAD_REF}"
