name: One-shot workflow policy verifier

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/close-workflow-policy-shadow-era.yml

permissions:
  contents: write

concurrency:
  group: workflow-policy-shadow-era-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-and-close:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/close-workflow-policy-shadow-era-20260801'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verifier branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply one-row verified disposition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          project = Path('projects/gb-is-my-strength')
          matrix_path = project / 'verified/MASTER_BUG_MATRIX.md'
          evidence_rel = 'reverify/WORKFLOW_POLICY_SHADOW_ERA_CLOSURE_2026-08-01_0ff04232.md'
          evidence_path = project / evidence_rel
          matrix = matrix_path.read_text(encoding='utf-8')

          open_row = '| WORKFLOW-POLICY-SHADOW-ERA | Workflow policy still protects historical shadow/route names and hardcoded dist paths instead of effective-route-registry coverage, capability gates, read-only validation and permission contracts. | existing source issue #64 |\n'
          closed_row = '| WORKFLOW-POLICY-SHADOW-ERA | ✅ **FIXED/SOURCE+CI VERIFIED 2026-08-01.** Source PR #688 replaces hardcoded route-path policy with registry-owned production-route coverage, capability-based gates, source-read-only validation and explicit permission/write-capability contracts. It also keeps build-once candidate promotion and live witnesses separated, makes actionlint blocking and expands stateful SYSTEM-gate failure coverage. Exact head `fff6155b651620b5e497585948d3b2a9fae5cd67` passed Metadata `30681815950`, Shared/Workflow Policy/actionlint `30681815958`, Node/read-only `30681815957` and TTS/Chromium `30681815981`; zero review threads. Squash merge `0ff04232ee08a8f81711db640395901124aca787`; source issue #64 closed. Production is not claimed. | `0ff04232` PR#688; issue #64; runs `30681815950`/`30681815958`/`30681815957`/`30681815981` |\n'

          if matrix.count(open_row) != 1:
              raise SystemExit(f'expected exactly one open row, found {matrix.count(open_row)}')
          if 'WORKFLOW-POLICY-SHADOW-ERA | ✅ **FIXED/' in matrix:
              raise SystemExit('closed row already exists')
          matrix = matrix.replace(open_row, '', 1)

          closed_marker = '| ID | Описание | Коммит |\n|---|---|---|\n'
          if matrix.count(closed_marker) != 1:
              raise SystemExit('closed table marker must occur exactly once')
          matrix = matrix.replace(closed_marker, closed_marker + closed_row, 1)

          replacements = {
              '## ✅ ЗАКРЫТО (164)': '## ✅ ЗАКРЫТО (165)',
              '## 🟠 P1 — ОТКРЫТО (97)': '## 🟠 P1 — ОТКРЫТО (96)',
              '## Статистика (обновлено 2026-08-01: source `0ff04232`; last exact production `abf1edba`; counters unchanged)': '## Статистика (обновлено 2026-08-01: source `0ff04232`; last exact production `abf1edba`; workflow policy closure verified)',
              '| Закрыто (fixed) | 164 |': '| Закрыто (fixed) | 165 |',
              '| P1 открыто | 97 |': '| P1 открыто | 96 |',
              '| **Всего открыто (матрица)** | **192** |': '| **Всего открыто (матрица)** | **191** |',
          }
          for old, new in replacements.items():
              if matrix.count(old) != 1:
                  raise SystemExit(f'counter invariant mismatch for {old!r}: {matrix.count(old)}')
              matrix = matrix.replace(old, new, 1)

          session_marker = '## Session log (append-only)\n\n'
          if matrix.count(session_marker) != 1:
              raise SystemExit('session log marker must occur exactly once')
          session_entry = '- **2026-08-01 — `WORKFLOW-POLICY-SHADOW-ERA` closed at source `0ff04232`.** Verifier matched the open claim to source PR #688: route coverage is registry-derived, ordinary validation is source-read-only, explicit autofix/transactional write capabilities are isolated, actionlint is blocking and SYSTEM failure lifecycle coverage is current. Exact head `fff6155b` passed runs `30681815950`, `30681815958`, `30681815957` and `30681815981`; review threads 0; issue #64 closed. One P1 row moved to fixed: closed 164 → 165, P1 97 → 96, total open 192 → 191. Production remains `abf1edba`; no production claim for `0ff04232`. Evidence: `reverify/WORKFLOW_POLICY_SHADOW_ERA_CLOSURE_2026-08-01_0ff04232.md`.\n\n'
          if session_entry in matrix:
              raise SystemExit('session entry already exists')
          matrix = matrix.replace(session_marker, session_marker + session_entry, 1)

          invariants = [
              '## ✅ ЗАКРЫТО (165)',
              '## 🟠 P1 — ОТКРЫТО (96)',
              '| Закрыто (fixed) | 165 |',
              '| **P0 открыто** | **0** |',
              '| P1 открыто | 96 |',
              '| P2 открыто | 36 |',
              '| P3 открыто | 51 |',
              '| **Всего открыто (матрица)** | **191** |',
          ]
          for invariant in invariants:
              if invariant not in matrix:
                  raise SystemExit(f'missing post-disposition invariant: {invariant}')
          if matrix.count('WORKFLOW-POLICY-SHADOW-ERA') != 3:
              raise SystemExit('finding must appear in closed row, authority history and new session evidence exactly three times')

          if evidence_path.exists():
              raise SystemExit(f'refusing to overwrite {evidence_path}')
          evidence = '''# WORKFLOW-POLICY-SHADOW-ERA — closure reverify

**Date:** 2026-08-01
**Finding:** `WORKFLOW-POLICY-SHADOW-ERA`
**Disposition:** `FIXED / SOURCE+CI VERIFIED`
**Source merge:** `0ff04232ee08a8f81711db640395901124aca787` (PR #688)
**Exact PR head:** `fff6155b651620b5e497585948d3b2a9fae5cd67`
**Production claim:** `no`

## 1. Original claim

The matrix row stated that workflow policy still protected historical shadow/route names and hardcoded `dist` paths instead of effective route-registry coverage, capability gates, read-only validation and permission contracts.

## 2. Source evidence

PR #688 closes that exact claim without route, UI, content, NoteRegistry, Karty or metadata-registry changes:

- `dist-dry-run.yml` no longer hardcodes article/series/map route files; it invokes `check-page-ownership.js --dist --production-like`, whose authority is `migration/page-ownership.json`;
- `git diff --exit-code` proves full validation leaves tracked source unchanged;
- ordinary workflows reject undeclared writers, job-local write permission and publication commands;
- write-capability jobs are structurally constrained to same-repository, label-gated PR branches with explicit write → validate → commit ordering and branch-bound push;
- transactional Editorial Metadata observation remains credential-free, trap-restored and exact-file clean;
- candidate build, immutable promotion, generic live and TTS witnesses remain separated;
- Shared Files Guard keeps actionlint blocking;
- stateful failure notification covers the current SYSTEM gates.

Source issue #64 was closed by the squash merge.

## 3. Exact-head CI evidence

Exact head `fff6155b651620b5e497585948d3b2a9fae5cd67` passed every triggered workflow:

- Metadata & IndexNow Readiness — run `30681815950`;
- Shared Files Guard — run `30681815958`, including Workflow Policy v2 and actionlint;
- Node Toolchain Contract — run `30681815957`, including the source-read-only proof;
- TTS Download Consent — run `30681815981`, including source/mutation contract and real-route Chromium matrix.

Review threads: `0`.

## 4. Decision

The implementation now satisfies every operative clause of the finding. The row is moved from P1-open to fixed.

Counter transition:

```text
closed:     164 -> 165
P1 open:     97 -> 96
total open: 192 -> 191
```

Other severity counts and all unrelated rows remain unchanged.

## 5. Production boundary

Current source remains `0ff04232ee08a8f81711db640395901124aca787` while the last exact production authority remains `abf1edba190280e554dfda085bef9fb6594c896d`.

```text
source != production
```

This closure is source+CI evidence only and does not promote `0ff04232` to production authority.
'''
          evidence_path.write_text(evidence, encoding='utf-8')
          matrix_path.write_text(matrix, encoding='utf-8')
          Path('.github/workflows/close-workflow-policy-shadow-era.yml').unlink()
          PY

      - name: Validate exact verifier surface
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | sed -E 's/^.. //' | sort)
          expected=(
            ".github/workflows/close-workflow-policy-shadow-era.yml"
            "projects/gb-is-my-strength/reverify/WORKFLOW_POLICY_SHADOW_ERA_CLOSURE_2026-08-01_0ff04232.md"
            "projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${changed[@]}")

          final_paths="${RUNNER_TEMP}/auditrepo-final-paths.txt"
          printf '%s\n' "${changed[@]}" \
            | grep -v '^\.github/workflows/close-workflow-policy-shadow-era.yml$' \
            > "${final_paths}"
          diff -u <(printf '%s\n' \
            "projects/gb-is-my-strength/reverify/WORKFLOW_POLICY_SHADOW_ERA_CLOSURE_2026-08-01_0ff04232.md" \
            "projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md") \
            <(sort "${final_paths}")

          python3 scripts/check_auditrepo_structure.py
          AUDITREPO_CHANGED_PATHS_FILE="${final_paths}" python3 scripts/validate_audit_repo.py
          AUDITREPO_CHANGED_PATHS_FILE="${final_paths}" python3 scripts/validate_audit_repo_regression_test.py
          git diff --check

      - name: Commit verified closure and remove generator
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "audit(gb): close workflow policy shadow era"
          git push origin "HEAD:${HEAD_REF}"
