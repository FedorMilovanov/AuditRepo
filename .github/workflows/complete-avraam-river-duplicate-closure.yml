name: Complete Avraam river duplicate closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: complete-avraam-river-pr-139
  cancel-in-progress: false

jobs:
  complete:
    if: github.event.pull_request.number == 139
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/avraam-river-duplicate-closure-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize current AuditRepo main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          git merge --no-edit origin/main

      - name: Apply bounded canonical transaction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          matrix_path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          next_path = Path('projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md')
          reverify_path = Path('projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_avraam-river-duplicate.md')

          matrix = matrix_path.read_text(encoding='utf-8')
          closed_marker = """## ✅ ЗАКРЫТО (195)

          | ID | Описание | Коммит |
          |---|---|---|
          """
          closed_rows = """## ✅ ЗАКРЫТО (197)

          | ID | Описание | Коммит |
          |---|---|---|
          | RIVER-P1-05 | ✅ **FIXED-CURRENT / SOURCE VERIFIED 2026-08-04.** Product commit `39df9ed0e650cc08f93c14145cb592868f0c80e4` removed the complete second Nile group under `waterRipple`—parallel stem, five arms and glow—while retaining one canonical river system and adding grouped-stroke protection plus a browser water-intersection gate. The historical commit has no attached Actions run, so no CI claim is made. Current Product `0fbe7d1ead9ebd1bea867418e254da438ec63329` retains the explicit single-system invariant, one Nile stem with five delta arms and the permanent Chromium visual harness. No current production claim. | `39df9ed0`; current `0fbe7d1e` |
          | DRAW-P1-02 | ✅ **DUPLICATE / MERGED INTO `RIVER-P1-05` 2026-08-04.** This row described the same obsolete duplicate river channels and the same visible doubled-line root cause as `RIVER-P1-05`; there is no second independently repairable defect. The shared source repair is commit `39df9ed0e650cc08f93c14145cb592868f0c80e4`, retained on current Product `0fbe7d1ead9ebd1bea867418e254da438ec63329`. Separate river/filter/shoreline findings remain open. No current production claim. | duplicate of `RIVER-P1-05`; `39df9ed0` |
          """
          if matrix.count(closed_marker) != 1:
              raise SystemExit('closed section marker drifted')
          matrix = matrix.replace(closed_marker, closed_rows, 1)

          open_rows = (
              '| RIVER-P1-05 | 🆕 **Karty P1:** Дублирование линий русел рек в `base-geo.svg` под `waterRipple` создаёт эффект «сдвоенной линии» у берегов | verified-source (32ae0d7d) |\n',
              '| DRAW-P1-02 | 🆕 **Karty P1:** Дублирующие наложения устаревших русел рек в `base-geo.svg` поверх морских штрихов создают видимый эффект сдвоенной линии | verified-source (32ae0d7d) |\n',
          )
          for row in open_rows:
              if matrix.count(row) != 1:
                  raise SystemExit(f'open row drifted: {row[:30]}')
              matrix = matrix.replace(row, '', 1)

          replacements = {
              '## 🟠 P1 — ОТКРЫТО (75)': '## 🟠 P1 — ОТКРЫТО (73)',
              '| Закрыто (fixed) | 195 |': '| Закрыто (fixed) | 197 |',
              '| P1 открыто | 75 |': '| P1 открыто | 73 |',
              '| **Всего открыто (матрица)** | **163** |': '| **Всего открыто (матрица)** | **161** |',
              '| Source verification anchor | `0fbe7d1ead9ebd1bea867418e254da438ec63329` (current source reverify; story-schema implementation merge `424b09b25fc9d4bace3938f4d44f430be8cc7e4b`; exact green PR head `12aa744e10c05c134adc951f01cb5e78ef25de65`; no current production claim). |': '| Source verification anchor | `0fbe7d1ead9ebd1bea867418e254da438ec63329` (current source reverify; duplicate-river implementation commit `39df9ed0e650cc08f93c14145cb592868f0c80e4`; source-only disposition, no current production claim). |',
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_karty-story-id-schema.md` |': '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_avraam-river-duplicate.md` |',
          }
          for old, new in replacements.items():
              if matrix.count(old) != 1:
                  raise SystemExit(f'matrix marker drifted: {old}')
              matrix = matrix.replace(old, new, 1)

          stats_pattern = r'## Статистика \(обновлено 2026-08-04: disposition anchor `0fbe7d1e`; last exact production `abf1edba`; 358 canonical = 195 closed \+ 163 open\)'
          stats_replacement = '## Статистика (обновлено 2026-08-04: disposition anchor `0fbe7d1e`; last exact production `abf1edba`; 358 canonical = 197 closed + 161 open)'
          matrix, count = re.subn(stats_pattern, stats_replacement, matrix, count=1)
          if count != 1:
              raise SystemExit('matrix statistics heading drifted')

          session_marker = '## Session log (append-only)\n\n'
          session_entry = """## Session log (append-only)

          ### 2026-08-04 — Avraam duplicate-river closure @ current source `0fbe7d1e`
          - Closed `RIVER-P1-05` as FIXED-CURRENT and `DRAW-P1-02` as DUPLICATE/MERGED into the same root cause.
          - Product commit `39df9ed0e650cc08f93c14145cb592868f0c80e4` removed the complete second Nile group under `waterRipple` rather than masking it; current source retains one canonical Nile system and the permanent Chromium visual harness.
          - The historical implementation commit has no attached Actions run, so this is a direct source disposition with no CI or production claim.
          - Canonical arithmetic moved from **195 closed / 163 open** to **197 closed / 161 open**; P1 moved from **75** to **73**.

          """
          if matrix.count(session_marker) != 1:
              raise SystemExit('session log marker drifted')
          matrix = matrix.replace(session_marker, session_entry, 1)
          for finding in ('RIVER-P1-05', 'DRAW-P1-02'):
              if matrix.count(f'| {finding} |') != 1:
                  raise SystemExit(f'canonical ID multiplicity drift: {finding}')
          matrix_path.write_text(matrix, encoding='utf-8')

          nxt = next_path.read_text(encoding='utf-8')
          next_replacements = {
              '**AuditRepo base before this handoff:** `8f5ebdd7e2ee1f56887110e74373c74761ccc01b`': '**AuditRepo base before this handoff:** `d7daa52214ac6995bb4789a33634ff9cb86a6ccc`',
              '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_karty-story-id-schema.md`': '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_avraam-river-duplicate.md`',
              '**Canonical matrix:** **358 IDs = 195 closed + 163 open**.': '**Canonical matrix:** **358 IDs = 197 closed + 161 open**.',
              '- P1: 75': '- P1: 73',
              '- Total open: 163': '- Total open: 161',
              '- Closed: 195': '- Closed: 197',
          }
          for old, new in next_replacements.items():
              if nxt.count(old) != 1:
                  raise SystemExit(f'NEXT marker drifted: {old}')
              nxt = nxt.replace(old, new, 1)

          current_source_line = '- `0fbe7d1ead9ebd1bea867418e254da438ec63329` — current Product main after subsequent independently merged lanes; this handoff uses it only as exact source-state authority and does not infer additional matrix dispositions.\n'
          river_line = '- `39df9ed0e650cc08f93c14145cb592868f0c80e4` — Avraam duplicate-river root-cause repair: removed the second `waterRipple` Nile and retained one canonical river system;\n'
          if nxt.count(current_source_line) != 1:
              raise SystemExit('NEXT current source line drifted')
          nxt = nxt.replace(current_source_line, river_line + current_source_line, 1)

          old_boundary = 'Source movement does **not** change canonical AuditRepo counts by itself. PR #132, PR #136 and PR #137 are merged and their dispositions remain bounded. AuditRepo PR #138 applies one additional current-head closure: `QUAL-P1-07` is fixed by Product PR #666 and retained by the canonical story-ID schema plus all-route guard at `0fbe7d1e`. No current production claim is made.'
          new_boundary = 'Source movement does **not** change canonical AuditRepo counts by itself. PR #132, PR #136, PR #137 and PR #138 are merged and their dispositions remain bounded. AuditRepo PR #139 applies the duplicate-river transaction: `RIVER-P1-05` is fixed on current source and `DRAW-P1-02` is merged as the same root cause. The implementation commit has no attached CI run, and no current production claim is made.'
          if nxt.count(old_boundary) != 1:
              raise SystemExit('NEXT source-boundary marker drifted')
          nxt = nxt.replace(old_boundary, new_boundary, 1)

          old_audit = """### AuditRepo

          - PR #138 (`verify/karty-story-id-schema-closure-20260804`) is the active canonical closure lane for `QUAL-P1-07`.
          - Its final diff is bounded to the matrix, this handoff and the paired reverify document; it must pass exact-head validation before merge.
          """
          new_audit = """### AuditRepo

          - PR #139 (`verify/avraam-river-duplicate-closure-20260804`) is the active canonical closure lane for `RIVER-P1-05` and duplicate `DRAW-P1-02`.
          - Its final diff is bounded to the matrix, this handoff and the paired reverify document; it must pass exact-head validation before merge.
          """
          if nxt.count(old_audit) != 1:
              raise SystemExit('NEXT AuditRepo block drifted')
          nxt = nxt.replace(old_audit, new_audit, 1)

          next_section = """## Next meaningful work

          1. Merge AuditRepo PR #139 only after validator, matrix coverage and repository-history forensic checks pass on its exact final head.
          2. Re-fetch both repositories and continue current-head harvest; narrow `MAP-P1-20` rather than closing its still-current unversioned static-resource residual.
          3. Obtain a separate same-SHA deployment/live witness when making a production claim; source evidence at `0fbe7d1e` is not production authority.
          4. Preserve Single-Writer-Per-Fact: counts/statuses only in `verified/MASTER_BUG_MATRIX.md`; current source/deploy/next-step truth only here.
          5. Do not turn noncanonical visual polish or historical reports into new repair-ready matrix rows without current-head verification.
          """
          section_marker = '## Next meaningful work\n'
          if nxt.count(section_marker) != 1:
              raise SystemExit('NEXT next-work section drifted')
          nxt = nxt[:nxt.index(section_marker)] + next_section
          next_path.write_text(nxt, encoding='utf-8')

          reverify = reverify_path.read_text(encoding='utf-8')
          if reverify.count('### `RIVER-P1-05` — fixed-current') != 1:
              raise SystemExit('RIVER disposition marker drifted')
          if reverify.count('### `DRAW-P1-02` — duplicate / merged into `RIVER-P1-05`') != 1:
              raise SystemExit('DRAW disposition marker drifted')
          if reverify.count('## Proposed canonical arithmetic') != 1:
              raise SystemExit('reverify arithmetic marker drifted')
          reverify = reverify.replace('## Proposed canonical arithmetic', '## Canonical arithmetic applied by this transaction', 1)
          reverify_path.write_text(reverify, encoding='utf-8')
          PY

          rm .github/workflows/complete-avraam-river-duplicate-closure.yml

      - name: Validate bounded transaction
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p "${RUNNER_TEMP}/matrix-coverage"
          python3 scripts/check_matrix_coverage.py --verbose --json-out "${RUNNER_TEMP}/matrix-coverage/report.json"

      - name: Commit canonical closure and remove bootstrap
        run: |
          set -euo pipefail
          git status --short
          git add \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_avraam-river-duplicate.md \
            .github/workflows/complete-avraam-river-duplicate-closure.yml
          git diff --cached --check
          git commit -m "audit(gb): close duplicate river rendering findings"
          git push origin HEAD:verify/avraam-river-duplicate-closure-20260804
