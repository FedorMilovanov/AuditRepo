name: Complete Avraam verifier transaction

on:
  push:
    branches:
      - verify/avraam-a11y-02-03-clean-20260803

permissions:
  contents: write

concurrency:
  group: complete-avraam-verifier-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete:
    if: github.event.head_commit.message == 'chore(audit): bootstrap Avraam disposition transaction'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/avraam-a11y-02-03-clean-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize current AuditRepo main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          git merge --no-edit origin/main

      - name: Apply bounded canonical transaction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          matrix_path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          next_path = Path('projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md')
          reverify_path = Path('projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-03_778a218d_avraam-skip-contrast.md')

          matrix = matrix_path.read_text(encoding='utf-8')

          closed_marker = """## ✅ ЗАКРЫТО (189)

          | ID | Описание | Коммит |
          |---|---|---|
          """
          closed_rows = """## ✅ ЗАКРЫТО (191)

          | ID | Описание | Коммит |
          |---|---|---|
          | A11Y-P1-02 | ✅ **FIXED-CURRENT / SOURCE+CHROMIUM VERIFIED 2026-08-03.** Source PR #812 added one route-owned focus-reveal skip link before the full sr-only projection and targets the programmatically focusable `#stage` owner. Exact Chromium Dossier run `30807589787` on verified head `3bd7f8a47bab65f08de45d81707cff2f6233cc55` proved first-Tab focus, visible `295.125 × 44` geometry, native activation to `#stage` with hash synchronization, `tabindex=\"-1\"`, and `304/304` expected states; artifact `8853648893`, digest `sha256:54653a134572f2c6885168dacb938c9213c687d0425f7c5ec497876bdd9d7522`. Squash merge `778a218d9e6dc4c051721fc0f0fe56ee9125c797`. No production claim. | `778a218d` PR#812; run `30807589787`; artifact `8853648893` |
          | A11Y-P1-03 | ✅ **STALE-ON-CURRENT-HEAD / SOURCE+CHROMIUM VERIFIED 2026-08-03.** The historical `2.15:1` archaeology-metadata contrast claim is not reproducible on the exact verified source head. The browser-composited Dossier witness sampled `1208` instances through ancestor backgrounds: minimum `5.084:1`, maximum `7.351:1`, invalid samples `0`, against the WCAG AA `4.5:1` threshold. Exact run `30807589787`, artifact `8853648893`, digest `sha256:54653a134572f2c6885168dacb938c9213c687d0425f7c5ec497876bdd9d7522`; source merge `778a218d9e6dc4c051721fc0f0fe56ee9125c797`. This closes only the canonical `2.15:1` claim; no all-route or production claim. | `778a218d` PR#812; run `30807589787`; artifact `8853648893` |
          """
          if matrix.count(closed_marker) != 1:
              raise SystemExit('closed section marker drifted')
          matrix = matrix.replace(closed_marker, closed_rows, 1)

          open_row_02 = '| A11Y-P1-02 | 🆕 **Karty P1:** Текстовая sr-only версия Авраама расположена до интерактивной карты в порядке чтения без skip link | verified-source (32ae0d7d) |\n'
          open_row_03 = '| A11Y-P1-03 | 🆕 **Karty P1:** Мелкий текст метаданных археологии (`rgba(154,162,174,.4)`) имеет контраст 2.15:1, не проходя WCAG AA (минимум 4.5:1) | verified-browser (c2c339708252) |\n'
          for row in (open_row_02, open_row_03):
              if matrix.count(row) != 1:
                  raise SystemExit(f'open row drifted: {row[:32]}')
              matrix = matrix.replace(row, '', 1)

          replacements = {
              '## 🟠 P1 — ОТКРЫТО (81)': '## 🟠 P1 — ОТКРЫТО (79)',
              '| Закрыто (fixed) | 189 |': '| Закрыто (fixed) | 191 |',
              '| P1 открыто | 81 |': '| P1 открыто | 79 |',
              '| **Всего открыто (матрица)** | **169** |': '| **Всего открыто (матрица)** | **167** |',
              '## Статистика (обновлено 2026-08-03: source `1944eb1b`; last exact production `abf1edba`; 358 canonical = 187 closed + 171 open)': '## Статистика (обновлено 2026-08-04: disposition anchor `778a218d`; last exact production `abf1edba`; 358 canonical = 191 closed + 167 open)',
              '| Source verification anchor | `d69268b27bb83fe8741159da59f9c1b038d7d9b9` (source/main merge of PR #759; exact verified PR head `33a2380d6748da26d64eb33d84ff7e588fd6e508`; no production claim). |': '| Source verification anchor | `778a218d9e6dc4c051721fc0f0fe56ee9125c797` (source/main merge of PR #812; exact verified PR head `3bd7f8a47bab65f08de45d81707cff2f6233cc55`; no production claim). |',
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-03_d69268b2_atlas-a11y-closure.md` |': '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-03_778a218d_avraam-skip-contrast.md` |',
          }
          for old, new in replacements.items():
              if matrix.count(old) != 1:
                  raise SystemExit(f'matrix replacement marker drifted: {old}')
              matrix = matrix.replace(old, new, 1)

          session_marker = '## Session log (append-only)\n\n'
          session_entry = """## Session log (append-only)

          ### 2026-08-04 — Avraam skip navigation and contrast disposition @ source merge `778a218d`
          - Source PR #812 merged exact verified head `3bd7f8a47bab65f08de45d81707cff2f6233cc55` as `778a218d9e6dc4c051721fc0f0fe56ee9125c797`.
          - Closed `A11Y-P1-02` as FIXED-CURRENT: exact Chromium Dossier run `30807589787` proved one focus-reveal skip link, first-Tab focus, visible `295.125 × 44` geometry, native activation to programmatically focusable `#stage`, and `304/304` expected states.
          - Closed `A11Y-P1-03` as STALE-ON-CURRENT-HEAD: `1208` browser-composited contrast samples had minimum `5.084:1`, maximum `7.351:1`, and zero invalid samples against the `4.5:1` threshold.
          - Exact evidence artifact `8853648893`, digest `sha256:54653a134572f2c6885168dacb938c9213c687d0425f7c5ec497876bdd9d7522`; Reference Baseline artifact `8853899070`, digest `sha256:6a407a7c5e142d1939ec57b20ae2bfa69be0243c6c00c4667343a75cbf70d2a4`.
          - Canonical arithmetic moved from **189 closed / 169 open** to **191 closed / 167 open**; P1 moved from **81** to **79**. No production claim.

          """
          if matrix.count(session_marker) != 1:
              raise SystemExit('session log marker drifted')
          matrix = matrix.replace(session_marker, session_entry, 1)

          if open_row_02 in matrix or open_row_03 in matrix:
              raise SystemExit('closed IDs remain in open P1')
          if matrix.count('| A11Y-P1-02 |') != 1 or matrix.count('| A11Y-P1-03 |') != 1:
              raise SystemExit('canonical ID multiplicity drift')
          matrix_path.write_text(matrix, encoding='utf-8')

          nxt = next_path.read_text(encoding='utf-8')
          next_replacements = {
              '**AuditRepo base before this handoff:** `d0d74a8abd708af4f43fc363877e4c8682cc7395`  ': '**AuditRepo base before this handoff:** `af4311d76b617d61eb5061fc4663df28d8f69add`  ',
              '**Exact finding-disposition anchor:** `d69268b27bb83fe8741159da59f9c1b038d7d9b9`  ': '**Exact finding-disposition anchor:** `778a218d9e6dc4c051721fc0f0fe56ee9125c797`  ',
              '**Current Product main:** `eb95261159c436a3dd9e0fb0c96b96f6d587cfe3`  ': '**Current Product main:** `0fbe7d1ead9ebd1bea867418e254da438ec63329`  ',
              '**Deployment status:** ⚠️ source/browser verification `!=` production; no same-SHA production claim for `eb952611`.  ': '**Deployment status:** ⚠️ source/browser verification `!=` production; no same-SHA production claim for `0fbe7d1e`.  ',
              '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-03_d69268b2_atlas-a11y-closure.md`  ': '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-03_778a218d_avraam-skip-contrast.md`  ',
              '**Canonical matrix:** **358 IDs = 189 closed + 169 open**.': '**Canonical matrix:** **358 IDs = 191 closed + 167 open**.',
              '- P1: 81': '- P1: 79',
              '- Total open: 169': '- Total open: 167',
          }
          for old, new in next_replacements.items():
              if nxt.count(old) != 1:
                  raise SystemExit(f'NEXT marker drifted: {old}')
              nxt = nxt.replace(old, new, 1)

          merged_marker = '- `eb95261159c436a3dd9e0fb0c96b96f6d587cfe3` — Home sacred-name flip closure from PR #845. Exact PR head `eea184202b52e4e7401b65c1fb26931ab29a3193` passed 11/11 workflows. The Habakkuk words now perform a complete Hebrew→translation swap on click/tap, focus and fine-pointer hover; revealed translations including “Яхве” use theme ink rather than cyan; the sacred-name label is lowered; reduced-motion keeps the same semantic swap without animation. Home browser artifact `8869841024` (`home-browser-contract-30848499857`), digest `sha256:da165a0b6e9bb772d4010b66adba1cadc1e90654785cf6189658fb2937d0cdec`.\n'
          merged_extension = merged_marker + '- `0fbe7d1ead9ebd1bea867418e254da438ec63329` — current Product main after subsequent independently merged lanes; this handoff uses it only as exact source-state authority and does not infer additional matrix dispositions.\n'
          if nxt.count(merged_marker) != 1:
              raise SystemExit('merged-wave marker drifted')
          nxt = nxt.replace(merged_marker, merged_extension, 1)

          old_boundary = 'These source merges do **not** change canonical AuditRepo counts by themselves. `A11Y-P1-02` and `A11Y-P1-03` have a separate active verifier transaction in AuditRepo PR #132. The Home closures were owner-directed Product residuals, not silent matrix dispositions.'
          new_boundary = 'Source movement does **not** change canonical AuditRepo counts by itself. AuditRepo PR #132 now applies the bounded two-row disposition supported by source PR #812: `A11Y-P1-02` is FIXED-CURRENT and `A11Y-P1-03` is STALE-ON-CURRENT-HEAD. Later Product movement through `0fbe7d1e` does not silently broaden either closure, and no production claim is made.'
          if nxt.count(old_boundary) != 1:
              raise SystemExit('source-boundary marker drifted')
          nxt = nxt.replace(old_boundary, new_boundary, 1)

          old_product = """### Product repository

          - PR #848 (`dependabot/playwright-1.62.1-exact-20260803`) is the only open Product lane observed at this handoff. It is a draft dependency-only two-file projection and is not authority for product or AuditRepo dispositions until synchronized with current Product main and its own exact-head fan-out passes.
          - No open Product owner lane overlaps the merged Home sacred-flip surface.
          """
          new_product = """### Product repository

          - No open Product PR was observed at exact state capture for this transaction.
          - Product `main@0fbe7d1ead9ebd1bea867418e254da438ec63329` is source authority only; the last exact production authority remains separate.
          """
          if nxt.count(old_product) != 1:
              raise SystemExit('Product active-lane block drifted')
          nxt = nxt.replace(old_product, new_product, 1)

          old_audit = """### AuditRepo

          - PR #132 (`verify/avraam-a11y-02-03-clean-20260803`) remains the active verifier lane for `A11Y-P1-02` and `A11Y-P1-03`.
          - It is non-overlapping with this handoff-only update and must finish its own exact-head validator transaction before matrix arithmetic changes.
          """
          new_audit = """### AuditRepo

          - PR #132 (`verify/avraam-a11y-02-03-clean-20260803`) is the active canonical closure lane for `A11Y-P1-02` and `A11Y-P1-03`.
          - Its final diff is bounded to the matrix, this handoff and the paired reverify document; it must pass exact-head validation before merge.
          """
          if nxt.count(old_audit) != 1:
              raise SystemExit('Audit active-lane block drifted')
          nxt = nxt.replace(old_audit, new_audit, 1)

          old_next = """## Next meaningful work

          1. Monitor exact heads before every mutation; do not reconstruct merged PR #810, #819, #833, #841, #842, #843, #845 or #850.
          2. Finish AuditRepo PR #132 only after its two-row disposition and canonical arithmetic pass the final exact-head validators.
          3. Treat Product PR #848 as dependency-only and stale-base until it is synchronized to Product `main@eb95261159c436a3dd9e0fb0c96b96f6d587cfe3` or later and passes its own exact-head barrier.
          4. Obtain a separate same-SHA deployment/live witness for Product `main@eb95261159c436a3dd9e0fb0c96b96f6d587cfe3`; source and PR green are not production authority.
          5. Then reverify independent current P1 clusters against one exact source anchor. Close only fixed/stale/false/duplicate findings or narrow confirmed residuals with evidence.
          6. Preserve Single-Writer-Per-Fact: counts/statuses only in `verified/MASTER_BUG_MATRIX.md`; live source/deploy/next-step truth only here.
          7. Do not turn noncanonical visual polish or historical reports into new repair-ready matrix rows without current-head verification.
          """
          new_next = """## Next meaningful work

          1. Merge AuditRepo PR #132 only after validator, matrix coverage and repository-history forensic checks pass on its exact final head.
          2. Re-fetch both repositories and choose the next independent current P1 cluster against one exact Product anchor; close only fixed/stale/false/duplicate findings or narrow a factual residual.
          3. Obtain a separate same-SHA deployment/live witness when making a production claim; source/PR green at `0fbe7d1e` is not production authority.
          4. Preserve Single-Writer-Per-Fact: counts/statuses only in `verified/MASTER_BUG_MATRIX.md`; current source/deploy/next-step truth only here.
          5. Do not turn noncanonical visual polish or historical reports into repair-ready rows without current-head verification.
          """
          if nxt.count(old_next) != 1:
              raise SystemExit('Next-work block drifted')
          nxt = nxt.replace(old_next, new_next, 1)
          next_path.write_text(nxt, encoding='utf-8')

          reverify = reverify_path.read_text(encoding='utf-8')
          old_heading = '## Canonical arithmetic for the pending matrix transaction'
          new_heading = '## Canonical arithmetic applied by this transaction'
          if reverify.count(old_heading) != 1:
              raise SystemExit('reverify arithmetic heading drifted')
          reverify = reverify.replace(old_heading, new_heading, 1)
          reverify_path.write_text(reverify, encoding='utf-8')
          PY

          rm .github/workflows/complete-avraam-transaction.yml

      - name: Validate bounded transaction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p "${RUNNER_TEMP}/matrix-coverage"
          python3 scripts/check_matrix_coverage.py \
            --verbose \
            --json-out "${RUNNER_TEMP}/matrix-coverage/report.json"

      - name: Commit canonical closure and remove bootstrap
        run: |
          set -euo pipefail
          git status --short
          git add \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-03_778a218d_avraam-skip-contrast.md \
            .github/workflows/complete-avraam-transaction.yml
          git diff --cached --check
          git commit -m "audit(gb): close Avraam skip navigation and contrast"
          git push origin HEAD:verify/avraam-a11y-02-03-clean-20260803
