name: Complete Home discovery metadata closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: complete-home-discovery-pr-137
  cancel-in-progress: false

jobs:
  complete:
    if: github.event.pull_request.number == 137
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/home-discovery-metadata-closure-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize current AuditRepo main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          git merge --no-edit origin/main

      - name: Apply bounded canonical transaction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          matrix_path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          next_path = Path('projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md')
          reverify_path = Path('projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_home-discovery-metadata.md')

          matrix = matrix_path.read_text(encoding='utf-8')
          closed_marker = """## ✅ ЗАКРЫТО (192)

          | ID | Описание | Коммит |
          |---|---|---|
          """
          closed_rows = """## ✅ ЗАКРЫТО (194)

          | ID | Описание | Коммит |
          |---|---|---|
          | AR-IDX-01 | ✅ **FIXED-CURRENT / SOURCE+CI VERIFIED 2026-08-04.** Product PR #675 restored canonical Home alternates for `hreflang=\"ru\"` and `hreflang=\"x-default\"`, both targeting `https://gospod-bog.ru/`, and added parsed production-like assertions. Exact PR head `404db8d14087d29522e56f190717d6224e8e3bfb` merged as `0131f8b9d6c717f85a8990700b72b09b575219a4` after nine green workflows. Current Product `0fbe7d1ead9ebd1bea867418e254da438ec63329` retains both links and the fail-closed assertions. No current production claim. | `0131f8b9` PR#675; current `0fbe7d1e` |
          | AR-IDX-02 | ✅ **FIXED-CURRENT / SOURCE+CI VERIFIED 2026-08-04.** Product PR #675 restored WebSite `SearchAction`, the canonical `https://gospod-bog.ru/?q={search_term_string}` EntryPoint and `required name=search_term_string`, with permanent production-like assertions. Exact PR head `404db8d14087d29522e56f190717d6224e8e3bfb` merged as `0131f8b9d6c717f85a8990700b72b09b575219a4` after nine green workflows. Current Product `0fbe7d1ead9ebd1bea867418e254da438ec63329` retains the complete contract. No current production claim. | `0131f8b9` PR#675; current `0fbe7d1e` |
          """
          if matrix.count(closed_marker) != 1:
              raise SystemExit('closed section marker drifted')
          matrix = matrix.replace(closed_marker, closed_rows, 1)

          open_rows = (
              '| AR-IDX-01 | **hreflang alternate теги отсутствуют в Astro HomePageHead** — legacy содержит `<link rel="alternate" hreflang="ru">` и `x-default`, Astro потерял. SEO-регрессия. | `incoming/arena-auditor-index/2026-07-14/REPORT.md` §1 (AR-IDX-01) |\n',
              '| AR-IDX-02 | **SearchAction отсутствует в JSON-LD WebSite** — legacy содержит `potentialAction`, Astro потерял. Google Site Search Box в выдаче не появится. | `incoming/arena-auditor-index/2026-07-14/REPORT.md` §1 (AR-IDX-02) |\n',
          )
          for row in open_rows:
              if matrix.count(row) != 1:
                  raise SystemExit(f'open row drifted: {row[:28]}')
              matrix = matrix.replace(row, '', 1)

          replacements = {
              '## 🟠 P1 — ОТКРЫТО (78)': '## 🟠 P1 — ОТКРЫТО (76)',
              '| Закрыто (fixed) | 192 |': '| Закрыто (fixed) | 194 |',
              '| P1 открыто | 78 |': '| P1 открыто | 76 |',
              '| **Всего открыто (матрица)** | **166** |': '| **Всего открыто (матрица)** | **164** |',
              '## Статистика (обновлено 2026-08-04: disposition anchor `0fbe7d1e`; last exact production `abf1edba`; 358 canonical = 192 closed + 166 open)': '## Статистика (обновлено 2026-08-04: disposition anchor `0fbe7d1e`; last exact production `abf1edba`; 358 canonical = 194 closed + 164 open)',
              '| Source verification anchor | `0fbe7d1ead9ebd1bea867418e254da438ec63329` (current source reverify; fixed implementation merge `f7e426996fd41a23ca720299a8ef1ce7f1c0952f`; exact green preservation/workflow head `7de20ed77e60ec05bb91322ac03800a3d9860410`; no current production claim). |': '| Source verification anchor | `0fbe7d1ead9ebd1bea867418e254da438ec63329` (current source reverify; Home discovery implementation merge `0131f8b9d6c717f85a8990700b72b09b575219a4`; exact green PR head `404db8d14087d29522e56f190717d6224e8e3bfb`; no current production claim). |',
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_editorial-projection-51.md` |': '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_home-discovery-metadata.md` |',
          }
          for old, new in replacements.items():
              if matrix.count(old) != 1:
                  raise SystemExit(f'matrix marker drifted: {old}')
              matrix = matrix.replace(old, new, 1)

          session_marker = '## Session log (append-only)\n\n'
          session_entry = """## Session log (append-only)

          ### 2026-08-04 — Home discovery metadata parity closure @ current source `0fbe7d1e`
          - Closed `AR-IDX-01` and `AR-IDX-02` as FIXED-CURRENT.
          - Product PR #675 / merge `0131f8b9d6c717f85a8990700b72b09b575219a4` restored both Home hreflang alternates and the complete WebSite SearchAction contract.
          - Exact Product head `404db8d14087d29522e56f190717d6224e8e3bfb` passed nine triggered workflows; current source retains the repaired metadata and permanent production-like assertions.
          - Canonical arithmetic moved from **192 closed / 166 open** to **194 closed / 164 open**; P1 moved from **78** to **76**. No current production claim.

          """
          if matrix.count(session_marker) != 1:
              raise SystemExit('session log marker drifted')
          matrix = matrix.replace(session_marker, session_entry, 1)
          for finding in ('AR-IDX-01', 'AR-IDX-02'):
              if matrix.count(f'| {finding} |') != 1:
                  raise SystemExit(f'canonical ID multiplicity drift: {finding}')
          matrix_path.write_text(matrix, encoding='utf-8')

          nxt = next_path.read_text(encoding='utf-8')
          next_replacements = {
              '**AuditRepo base before this handoff:** `ac44c0546c7d637455466dff34828a8c025126e4`': '**AuditRepo base before this handoff:** `1d8fb7f2e00d76010afab5d5e808bfa4cf687958`',
              '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_editorial-projection-51.md`': '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_home-discovery-metadata.md`',
              '**Canonical matrix:** **358 IDs = 192 closed + 166 open**.': '**Canonical matrix:** **358 IDs = 194 closed + 164 open**.',
              '- P1: 78': '- P1: 76',
              '- Total open: 166': '- Total open: 164',
              '- Closed: 192': '- Closed: 194',
          }
          for old, new in next_replacements.items():
              if nxt.count(old) != 1:
                  raise SystemExit(f'NEXT marker drifted: {old}')
              nxt = nxt.replace(old, new, 1)

          current_source_line = '- `0fbe7d1ead9ebd1bea867418e254da438ec63329` — current Product main after subsequent independently merged lanes; this handoff uses it only as exact source-state authority and does not infer additional matrix dispositions.\n'
          discovery_line = '- `0131f8b9d6c717f85a8990700b72b09b575219a4` — Home discovery metadata parity from PR #675: canonical `ru`/`x-default` alternates, complete WebSite SearchAction and permanent production-like assertions;\n'
          if nxt.count(current_source_line) != 1:
              raise SystemExit('NEXT current source line drifted')
          nxt = nxt.replace(current_source_line, discovery_line + current_source_line, 1)

          old_boundary = 'Source movement does **not** change canonical AuditRepo counts by itself. PR #132 is merged and its two Avraam dispositions remain bounded. AuditRepo PR #136 applies one additional current-head closure: `EDITORIAL-PROJECTION-51-DRIFT` is fixed by Product PR #442 and retained by the approval-gated editorial metadata architecture at `0fbe7d1e`. Historical deployment evidence for `f7e42699` does not establish current production.'
          new_boundary = 'Source movement does **not** change canonical AuditRepo counts by itself. PR #132 and PR #136 are merged and their dispositions remain bounded. AuditRepo PR #137 applies two additional current-head closures: `AR-IDX-01` and `AR-IDX-02` are fixed by Product PR #675 and retained with permanent Home discovery assertions at `0fbe7d1e`. No current production claim is made.'
          if nxt.count(old_boundary) != 1:
              raise SystemExit('NEXT source-boundary marker drifted')
          nxt = nxt.replace(old_boundary, new_boundary, 1)

          old_audit = """### AuditRepo

          - PR #136 (`verify/editorial-projection-51-closure-20260804`) is the active canonical closure lane for `EDITORIAL-PROJECTION-51-DRIFT`.
          - Its final diff is bounded to the matrix, this handoff and the paired reverify document; it must pass exact-head validation before merge.
          """
          new_audit = """### AuditRepo

          - PR #137 (`verify/home-discovery-metadata-closure-20260804`) is the active canonical closure lane for `AR-IDX-01` and `AR-IDX-02`.
          - Its final diff is bounded to the matrix, this handoff and the paired reverify document; it must pass exact-head validation before merge.
          """
          if nxt.count(old_audit) != 1:
              raise SystemExit('NEXT AuditRepo block drifted')
          nxt = nxt.replace(old_audit, new_audit, 1)

          next_section = """## Next meaningful work

          1. Merge AuditRepo PR #137 only after validator, matrix coverage and repository-history forensic checks pass on its exact final head.
          2. Re-fetch both repositories and continue the current-head harvest before opening any Product repair lane.
          3. Obtain a separate same-SHA deployment/live witness when making a production claim; source/PR green at `0fbe7d1e` is not production authority.
          4. Preserve Single-Writer-Per-Fact: counts/statuses only in `verified/MASTER_BUG_MATRIX.md`; current source/deploy/next-step truth only here.
          5. Do not turn noncanonical visual polish or historical reports into new repair-ready matrix rows without current-head verification.
          """
          section_marker = '## Next meaningful work\n'
          if nxt.count(section_marker) != 1:
              raise SystemExit('NEXT next-work section drifted')
          nxt = nxt[:nxt.index(section_marker)] + next_section
          next_path.write_text(nxt, encoding='utf-8')

          reverify = reverify_path.read_text(encoding='utf-8')
          if reverify.count('## Proposed canonical arithmetic') != 1:
              raise SystemExit('reverify arithmetic marker drifted')
          reverify = reverify.replace('## Proposed canonical arithmetic', '## Canonical arithmetic applied by this transaction', 1)
          reverify_path.write_text(reverify, encoding='utf-8')
          PY

          rm .github/workflows/complete-home-discovery-metadata-closure.yml

      - name: Validate bounded transaction
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p "${RUNNER_TEMP}/matrix-coverage"
          python3 scripts/check_matrix_coverage.py --verbose --json-out "${RUNNER_TEMP}/matrix-coverage/report.json"

      - name: Commit canonical closure and remove bootstrap
        run: |
          set -euo pipefail
          git status --short
          git add \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_home-discovery-metadata.md \
            .github/workflows/complete-home-discovery-metadata-closure.yml
          git diff --cached --check
          git commit -m "audit(gb): close Home discovery metadata findings"
          git push origin HEAD:verify/home-discovery-metadata-closure-20260804
