name: Complete Karty Hebrew duplicate consolidation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: complete-karty-hebrew-pr-141
  cancel-in-progress: false

jobs:
  complete:
    if: github.event.pull_request.number == 141
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/karty-hebrew-font-duplicate-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize current AuditRepo main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          git merge --no-edit origin/main

      - name: Apply bounded canonical transaction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          matrix_path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          next_path = Path('projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md')
          reverify_path = Path('projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_karty-hebrew-font-duplicate.md')

          matrix = matrix_path.read_text(encoding='utf-8')

          closed_marker = """## ✅ ЗАКРЫТО (198)

          | ID | Описание | Коммит |
          |---|---|---|
          """
          closed_rows = """## ✅ ЗАКРЫТО (199)

          | ID | Описание | Коммит |
          |---|---|---|
          | FONT-P1-01 | ✅ **DUPLICATE / MERGED INTO `QUAL-P1-02` 2026-08-04.** This row is the explicit-font-family subset of the same dynamic Hebrew rendering residual. Current Product `0fbe7d1ead9ebd1bea867418e254da438ec63329` still styles `.me-content .hw` with `Georgia,\"Times New Roman\",serif`, contains no `dir=\"rtl\"` contract for the dynamic Hebrew panel, and selects `he_deep` for the Hebrew tab. The combined defect remains open only under canonical owner `QUAL-P1-02`; no Product mutation or production claim. | `0fbe7d1e` |
          """
          if matrix.count(closed_marker) != 1:
              raise SystemExit('closed section marker drifted')
          matrix = matrix.replace(closed_marker, closed_rows, 1)

          old_owner = '| QUAL-P1-02 | 🆕 **Karty P1:** Динамический иврит (244+ слов) не имеет явного `font-family: "Noto Serif Hebrew"` и `dir="rtl"`, вызывая визуальные искажения шрифта | verified-source (32ae0d7d) |\n'
          new_owner = '| QUAL-P1-02 | 🔴 **CONFIRMED-CURRENT / CANONICAL OWNER 2026-08-04:** Динамический Hebrew tab по-прежнему использует `.hw { font-family: Georgia,"Times New Roman",serif }`, не имеет `dir="rtl"` на rendered Hebrew boundary и получает данные из `he_deep`. Один bounded Product repair должен одновременно исправить Hebrew-capable font stack и RTL semantics; font-only duplicate `FONT-P1-01` merged сюда. | current source `0fbe7d1e`; `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_karty-hebrew-font-duplicate.md` |\n'
          if matrix.count(old_owner) != 1:
              raise SystemExit('QUAL-P1-02 row drifted')
          matrix = matrix.replace(old_owner, new_owner, 1)

          duplicate_row = '| FONT-P1-01 | 🆕 **Karty P1:** Выпадение ивритских слов в системный sans-serif из-за объявления `font-family: Georgia, "Times New Roman"` в `.hw` (`map-engine.js:463`) вместо `Noto Serif Hebrew` | verified-source (32ae0d7d) |\n'
          if matrix.count(duplicate_row) != 1:
              raise SystemExit('FONT-P1-01 row drifted')
          matrix = matrix.replace(duplicate_row, '', 1)

          replacements = {
              '## 🟠 P1 — ОТКРЫТО (73)': '## 🟠 P1 — ОТКРЫТО (72)',
              '| Закрыто (fixed) | 198 |': '| Закрыто (fixed) | 199 |',
              '| P1 открыто | 73 |': '| P1 открыто | 72 |',
              '| **Всего открыто (матрица)** | **160** |': '| **Всего открыто (матрица)** | **159** |',
              '| Source verification anchor | `0fbe7d1ead9ebd1bea867418e254da438ec63329` (current source reverify; route-profile status residual narrowed and duplicate merged; no Product mutation or current production claim). |': '| Source verification anchor | `0fbe7d1ead9ebd1bea867418e254da438ec63329` (current source reverify; Hebrew font subset duplicate merged into the retained font+RTL owner; no Product mutation or current production claim). |',
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_karty-profile-status-duplicate.md` |': '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_karty-hebrew-font-duplicate.md` |',
          }
          for old, new in replacements.items():
              if matrix.count(old) != 1:
                  raise SystemExit(f'matrix marker drifted: {old}')
              matrix = matrix.replace(old, new, 1)

          stats_pattern = r'## Статистика \(обновлено 2026-08-04: disposition anchor `0fbe7d1e`; last exact production `abf1edba`; 358 canonical = 198 closed \+ 160 open\)'
          stats_replacement = '## Статистика (обновлено 2026-08-04: disposition anchor `0fbe7d1e`; last exact production `abf1edba`; 358 canonical = 199 closed + 159 open)'
          matrix, count = re.subn(stats_pattern, stats_replacement, matrix, count=1)
          if count != 1:
              raise SystemExit('matrix statistics heading drifted')

          session_marker = '## Session log (append-only)\n\n'
          session_entry = """## Session log (append-only)

          ### 2026-08-04 — Karty Hebrew font duplicate consolidation @ current source `0fbe7d1e`
          - Retained `QUAL-P1-02` as CONFIRMED-CURRENT canonical owner for the combined explicit Hebrew font and RTL direction residual.
          - Closed `FONT-P1-01` as DUPLICATE/MERGED because it is only the font-family subset of the same defect.
          - Current engine still uses Georgia/Times for `.hw`, has no `dir=\"rtl\"` contract and selects `he_deep` for the Hebrew tab.
          - Canonical arithmetic moved from **198 closed / 160 open** to **199 closed / 159 open**; P1 moved from **73** to **72**. No Product mutation or production claim.

          """
          if matrix.count(session_marker) != 1:
              raise SystemExit('session log marker drifted')
          matrix = matrix.replace(session_marker, session_entry, 1)

          if matrix.count('| QUAL-P1-02 |') != 1 or matrix.count('| FONT-P1-01 |') != 1:
              raise SystemExit('canonical Hebrew ID multiplicity drift')
          matrix_path.write_text(matrix, encoding='utf-8')

          nxt = next_path.read_text(encoding='utf-8')
          next_replacements = {
              '**AuditRepo base before this handoff:** `da25e2c53388c6639e0add7b01e7521cb82a146e`': '**AuditRepo base before this handoff:** `446f36f48a27b02fb27e185c8f087446c811a609`',
              '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_karty-profile-status-duplicate.md`': '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_karty-hebrew-font-duplicate.md`',
              '**Canonical matrix:** **358 IDs = 198 closed + 160 open**.': '**Canonical matrix:** **358 IDs = 199 closed + 159 open**.',
              '- P1: 73': '- P1: 72',
              '- Total open: 160': '- Total open: 159',
              '- Closed: 198': '- Closed: 199',
          }
          for old, new in next_replacements.items():
              if nxt.count(old) != 1:
                  raise SystemExit(f'NEXT marker drifted: {old}')
              nxt = nxt.replace(old, new, 1)

          old_boundary = 'Source movement does **not** change canonical AuditRepo counts by itself. PR #132, PR #136, PR #137, PR #138 and PR #139 are merged and their dispositions remain bounded. AuditRepo PR #140 narrows `QUAL-P1-09` to the factual holding/noindex profile residual and merges duplicate `QUAL-P2-01`; it makes no Product mutation or production claim.'
          new_boundary = 'Source movement does **not** change canonical AuditRepo counts by itself. PR #132, PR #136, PR #137, PR #138, PR #139 and PR #140 are merged and their dispositions remain bounded. AuditRepo PR #141 retains `QUAL-P1-02` as the current Hebrew font+RTL owner and merges duplicate `FONT-P1-01`; it makes no Product mutation or production claim.'
          if nxt.count(old_boundary) != 1:
              raise SystemExit('NEXT source-boundary marker drifted')
          nxt = nxt.replace(old_boundary, new_boundary, 1)

          old_audit = """### AuditRepo

          - PR #140 (`verify/karty-profile-status-duplicate-20260804`) is the active canonical narrowing lane for `QUAL-P1-09` and duplicate `QUAL-P2-01`.
          - Its final diff is bounded to the matrix, this handoff and the paired reverify document; it must pass exact-head validation before merge.
          """
          new_audit = """### AuditRepo

          - PR #141 (`verify/karty-hebrew-font-duplicate-20260804`) is the active canonical duplicate-consolidation lane for `QUAL-P1-02` and duplicate `FONT-P1-01`.
          - Its final diff is bounded to the matrix, this handoff and the paired reverify document; it must pass exact-head validation before merge.
          """
          if nxt.count(old_audit) != 1:
              raise SystemExit('NEXT AuditRepo block drifted')
          nxt = nxt.replace(old_audit, new_audit, 1)

          next_section = """## Next meaningful work

          1. Merge AuditRepo PR #141 only after validator, matrix coverage and repository-history forensic checks pass on its exact final head.
          2. Re-fetch both repositories and continue current-head harvest; `QUAL-P1-02` remains a confirmed repair-ready Product candidate requiring font and RTL runtime semantics in one bounded lane.
          3. `QUAL-P1-09` remains open until one bounded Product lane defines the canonical holding-profile status and updates validators.
          4. Narrow `MAP-P1-20` rather than closing its still-current unversioned static-resource residual.
          5. Preserve Single-Writer-Per-Fact and make no production claim without same-SHA live evidence.
          """
          section_marker = '## Next meaningful work\n'
          if nxt.count(section_marker) != 1:
              raise SystemExit('NEXT next-work section drifted')
          nxt = nxt[:nxt.index(section_marker)] + next_section
          next_path.write_text(nxt, encoding='utf-8')

          reverify = reverify_path.read_text(encoding='utf-8')
          required = (
              '### `QUAL-P1-02` — confirmed-current / canonical owner',
              '### `FONT-P1-01` — duplicate / merged into `QUAL-P1-02`',
              '## Proposed canonical arithmetic',
          )
          for marker in required:
              if reverify.count(marker) != 1:
                  raise SystemExit(f'reverify marker drifted: {marker}')
          reverify = reverify.replace('## Proposed canonical arithmetic', '## Canonical arithmetic applied by this transaction', 1)
          reverify_path.write_text(reverify, encoding='utf-8')
          PY

          rm .github/workflows/complete-karty-hebrew-font-duplicate.yml

      - name: Validate bounded transaction
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p "${RUNNER_TEMP}/matrix-coverage"
          python3 scripts/check_matrix_coverage.py --verbose --json-out "${RUNNER_TEMP}/matrix-coverage/report.json"

      - name: Commit canonical transaction and remove bootstrap
        run: |
          set -euo pipefail
          git status --short
          git add \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_karty-hebrew-font-duplicate.md \
            .github/workflows/complete-karty-hebrew-font-duplicate.yml
          git diff --cached --check
          git commit -m "audit(gb): merge duplicate Hebrew font finding"
          git push origin HEAD:verify/karty-hebrew-font-duplicate-20260804
