name: Complete Nagornaya duplicate closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: complete-nagornaya-duplicates-pr-143
  cancel-in-progress: false

jobs:
  complete:
    if: github.event.pull_request.number == 143
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/nagornaya-duplicate-false-positive-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize current AuditRepo main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main --prune
          git merge --no-edit origin/main

      - name: Apply bounded canonical transaction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          matrix_path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          next_path = Path('projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md')
          reverify_path = Path('projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_nagornaya-duplicates.md')

          matrix = matrix_path.read_text(encoding='utf-8')
          closed_marker = """## ✅ ЗАКРЫТО (199)

          | ID | Описание | Коммит |
          |---|---|---|
          """
          closed_rows = """## ✅ ЗАКРЫТО (203)

          | ID | Описание | Коммит |
          |---|---|---|
          | NG-VIS-05 | ✅ **FALSE-POSITIVE / INTENTIONAL SEMANTIC MARKER 2026-08-04.** Current Product `0fbe7d1ead9ebd1bea867418e254da438ec63329` explicitly includes `div.reveal` in `js/glossary.js` `proseSelectors`; the class is consumed as a glossary-hydration prose boundary. The canonical row itself states that reveal animation was not planned. Missing animation is therefore not a defect, and removing the marker would weaken the runtime contract. No Product mutation or production claim. | `0fbe7d1e` |
          | NG-VIS-06 | ✅ **DUPLICATE / MERGED INTO `NG-STRUCT-01` 2026-08-04.** The chapter-five `font-sans` heading inconsistency is already a stated subset of open root owner `NG-STRUCT-01`, which covers the same structural/heading regression. Closing this duplicate does not close the root defect. No Product mutation or production claim. | `0fbe7d1e` |
          | NG-VIS-07 | ✅ **DUPLICATE / MERGED INTO `NG-DARK-01` 2026-08-04.** Loss of chapter colour identity in dark mode is a manifestation of the same missing per-chapter variable/remap architecture owned by open root finding `NG-DARK-01`. No Product mutation or production claim. | `0fbe7d1e` |
          | NG-VIS-08 | ✅ **DUPLICATE / MERGED INTO `NG-DARK-01` 2026-08-04.** Chapter-three hero contrast drift is another manifestation of the incomplete dark-theme remap owned by open root finding `NG-DARK-01`; it has no independent repair lane. No Product mutation or production claim. | `0fbe7d1e` |
          """
          if matrix.count(closed_marker) != 1:
              raise SystemExit('closed section marker drifted')
          matrix = matrix.replace(closed_marker, closed_rows, 1)

          open_rows = (
              '| NG-VIS-05 | 🆕 **Нагорная P2 (→ NG-REVEAL-01):** Класс `reveal` — НЕ мёртвый: используется glossary.js для поиска `div.reveal` при гидратации. Анимации нет (и не планировалась) — только семантический маркер. Evidence: `evidence/NAGORNAYA_DEEP_DARK_THEME_AUDIT_2026-07-14.md` §NG-REVEAL-01 |\n',
              '| NG-VIS-06 | 🆕 **Нагорная P2 (→ NG-FONT-01, объединён с NG-STRUCT-01):** `font-sans` на h2 только в ch.5 — объединено в NG-STRUCT-01. |\n',
              '| NG-VIS-07 | 🆕 **Нагорная P2 (→ поглощено NG-DARK-01):** Потеря цветовой идентичности глав в dark — корневая причина: per-chapter CSS vars (NG-DARK-01) автоматически решает это. |\n',
              '| NG-VIS-08 | 🆕 **Нагорная P2 (→ поглощено NG-DARK-01):** Контраст-дрейф ch.3 hero — корневая причина та же: NG-DARK-01 решает через правильные ремапы. |\n',
          )
          for row in open_rows:
              if matrix.count(row) != 1:
                  raise SystemExit(f'Nagornaya row drifted: {row[:28]}')
              matrix = matrix.replace(row, '', 1)

          replacements = {
              '## 🟢 P3 — ОТКРЫТО (47)': '## 🟢 P3 — ОТКРЫТО (43)',
              '| Закрыто (fixed) | 199 |': '| Закрыто (fixed) | 203 |',
              '| P3 открыто | 47 |': '| P3 открыто | 43 |',
              '| **Всего открыто (матрица)** | **159** |': '| **Всего открыто (матрица)** | **155** |',
              '| Source verification anchor | `0fbe7d1ead9ebd1bea867418e254da438ec63329` (current source reverify; Hebrew font subset duplicate merged into the retained font+RTL owner; no Product mutation or current production claim). |': '| Source verification anchor | `0fbe7d1ead9ebd1bea867418e254da438ec63329` (current source reverify; Nagornaya semantic-marker false positive and three duplicate visual rows consolidated into open root owners; no Product mutation or current production claim). |',
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_karty-hebrew-font-duplicate.md` |': '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_nagornaya-duplicates.md` |',
          }
          for old, new in replacements.items():
              if matrix.count(old) != 1:
                  raise SystemExit(f'matrix marker drifted: {old}')
              matrix = matrix.replace(old, new, 1)

          stats_pattern = r'## Статистика \(обновлено 2026-08-04: disposition anchor `0fbe7d1e`; last exact production `abf1edba`; 358 canonical = 199 closed \+ 159 open\)'
          stats_replacement = '## Статистика (обновлено 2026-08-04: disposition anchor `0fbe7d1e`; last exact production `abf1edba`; 358 canonical = 203 closed + 155 open)'
          matrix, count = re.subn(stats_pattern, stats_replacement, matrix, count=1)
          if count != 1:
              raise SystemExit('matrix statistics heading drifted')

          session_marker = '## Session log (append-only)\n\n'
          session_entry = """## Session log (append-only)

          ### 2026-08-04 — Nagornaya visual duplicate/false-positive consolidation @ current source `0fbe7d1e`
          - Closed `NG-VIS-05` as FALSE-POSITIVE: current `glossary.js` consumes `div.reveal` as a semantic prose selector and no animation was intended.
          - Closed `NG-VIS-06` as DUPLICATE/MERGED into open root owner `NG-STRUCT-01`.
          - Closed `NG-VIS-07` and `NG-VIS-08` as DUPLICATE/MERGED into open root owner `NG-DARK-01`.
          - Root structural/dark findings remain open; `NG-VIS-04` is untouched.
          - Canonical arithmetic moved from **199 closed / 159 open** to **203 closed / 155 open**; P3 moved from **47** to **43**. No Product mutation or production claim.

          """
          if matrix.count(session_marker) != 1:
              raise SystemExit('session log marker drifted')
          matrix = matrix.replace(session_marker, session_entry, 1)
          for finding in ('NG-VIS-05','NG-VIS-06','NG-VIS-07','NG-VIS-08'):
              if matrix.count(f'| {finding} |') != 1:
                  raise SystemExit(f'canonical ID multiplicity drift: {finding}')
          matrix_path.write_text(matrix, encoding='utf-8')

          nxt = next_path.read_text(encoding='utf-8')
          next_replacements = {
              '**AuditRepo base before this handoff:** `446f36f48a27b02fb27e185c8f087446c811a609`': '**AuditRepo base before this handoff:** `ad1f08679005a54c99522e6c43725a851320a6ab`',
              '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_karty-hebrew-font-duplicate.md`': '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_nagornaya-duplicates.md`',
              '**Canonical matrix:** **358 IDs = 199 closed + 159 open**.': '**Canonical matrix:** **358 IDs = 203 closed + 155 open**.',
              '- P3: 47': '- P3: 43',
              '- Total open: 159': '- Total open: 155',
              '- Closed: 199': '- Closed: 203',
          }
          for old, new in next_replacements.items():
              if nxt.count(old) != 1:
                  raise SystemExit(f'NEXT marker drifted: {old}')
              nxt = nxt.replace(old, new, 1)

          old_boundary = 'Source movement does **not** change canonical AuditRepo counts by itself. PR #132, PR #136, PR #137, PR #138, PR #139 and PR #140 are merged and their dispositions remain bounded. AuditRepo PR #141 retains `QUAL-P1-02` as the current Hebrew font+RTL owner and merges duplicate `FONT-P1-01`; it makes no Product mutation or production claim.'
          new_boundary = 'Source movement does **not** change canonical AuditRepo counts by itself. AuditRepo PRs #132, #136–#141 are merged and their dispositions remain bounded. PR #142 was closed unmerged after its exact-row gate disproved an incorrect duplicate mapping. AuditRepo PR #143 closes one Nagornaya semantic-marker false positive and merges three visual duplicates into still-open root owners; it makes no Product mutation or production claim.'
          if nxt.count(old_boundary) != 1:
              raise SystemExit('NEXT source-boundary marker drifted')
          nxt = nxt.replace(old_boundary, new_boundary, 1)

          old_audit = """### AuditRepo

          - PR #141 (`verify/karty-hebrew-font-duplicate-20260804`) is the active canonical duplicate-consolidation lane for `QUAL-P1-02` and duplicate `FONT-P1-01`.
          - Its final diff is bounded to the matrix, this handoff and the paired reverify document; it must pass exact-head validation before merge.
          """
          new_audit = """### AuditRepo

          - PR #143 (`verify/nagornaya-duplicate-false-positive-20260804`) is the active canonical consolidation lane for `NG-VIS-05` through `NG-VIS-08`.
          - Its final diff is bounded to the matrix, this handoff and the paired reverify document; it must pass exact-head validation before merge.
          """
          if nxt.count(old_audit) != 1:
              raise SystemExit('NEXT AuditRepo block drifted')
          nxt = nxt.replace(old_audit, new_audit, 1)

          next_section = """## Next meaningful work

          1. Merge AuditRepo PR #143 only after validator, matrix coverage and repository-history forensic checks pass on its exact final head.
          2. Re-fetch both repositories and continue current-head harvest; keep `NG-STRUCT-01` and `NG-DARK-01` open until bounded Product repairs exist.
          3. `QUAL-P1-02`, `QUAL-P1-06` and narrowed `QUAL-P1-09` remain confirmed Product candidates; do not double-count their subsets.
          4. Narrow `MAP-P1-20` rather than closing its still-current unversioned static-resource residual.
          5. Preserve Single-Writer-Per-Fact and make no production claim without same-SHA live evidence.
          """
          section_marker = '## Next meaningful work\n'
          if nxt.count(section_marker) != 1:
              raise SystemExit('NEXT next-work section drifted')
          nxt = nxt[:nxt.index(section_marker)] + next_section
          next_path.write_text(nxt, encoding='utf-8')

          reverify = reverify_path.read_text(encoding='utf-8')
          required = (
              '### `NG-VIS-05` — false-positive / intentional semantic marker',
              '### `NG-VIS-06` — duplicate / merged into `NG-STRUCT-01`',
              '### `NG-VIS-07` — duplicate / merged into `NG-DARK-01`',
              '### `NG-VIS-08` — duplicate / merged into `NG-DARK-01`',
              '## Proposed canonical arithmetic',
          )
          for marker in required:
              if reverify.count(marker) != 1:
                  raise SystemExit(f'reverify marker drifted: {marker}')
          reverify = reverify.replace('## Proposed canonical arithmetic', '## Canonical arithmetic applied by this transaction', 1)
          reverify_path.write_text(reverify, encoding='utf-8')
          PY

          rm .github/workflows/complete-nagornaya-duplicate-closure.yml

      - name: Validate bounded transaction
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p "${RUNNER_TEMP}/matrix-coverage"
          python3 scripts/check_matrix_coverage.py --verbose --json-out "${RUNNER_TEMP}/matrix-coverage/report.json"

      - name: Commit canonical transaction and remove bootstrap
        run: |
          set -euo pipefail
          git status --short
          git add \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_0fbe7d1e_nagornaya-duplicates.md \
            .github/workflows/complete-nagornaya-duplicate-closure.yml
          git diff --cached --check
          git commit -m "audit(gb): consolidate Nagornaya visual duplicate findings"
          git push origin HEAD:verify/nagornaya-duplicate-false-positive-20260804
