name: CrossWire RusSynodal Custody

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/crosswire-russynodal-custody.yml'
      - 'scripts/crosswire_module_custody.py'

permissions:
  contents: read

jobs:
  verify-official-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify custody script syntax
        run: python3 -m py_compile scripts/crosswire_module_custody.py

      - name: Acquire and verify official RusSynodal package
        run: |
          python3 scripts/crosswire_module_custody.py \
            --module RusSynodal \
            --package-url https://crosswire.org/ftpmirror/pub/sword/packages/rawzip/RusSynodal.zip \
            --conf-url https://crosswire.org/ftpmirror/pub/sword/raw/mods.d/russynodal.conf \
            --output-dir reports/crosswire-russynodal-custody

      - name: Verify tracked tree unchanged
        run: git diff --exit-code

      - name: Upload custody receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: crosswire-russynodal-custody-${{ github.run_id }}
          path: |
            reports/crosswire-russynodal-custody/receipt.json
            reports/crosswire-russynodal-custody/receipt.md
            reports/crosswire-russynodal-custody/official-russynodal.conf
            reports/crosswire-russynodal-custody/embedded-russynodal.conf
          if-no-files-found: warn
          retention-days: 30
