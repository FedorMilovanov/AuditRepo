name: One-shot gb authority sync efaf2a51

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Executed only by the PR-scoped reviewed wrapper"
      - name: Reviewed authority projection source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          source = 'efaf2a51b1fcc7b7d3f8c9558ecb5acf849df3b3'
          previous = '0ff04232ee08a8f81711db640395901124aca787'
          production = 'abf1edba190280e554dfda085bef9fb6594c896d'
          project = Path('projects/gb-is-my-strength')
          reverify_rel = 'reverify/CURRENT_HEAD_REVERIFY_2026-08-01_efaf2a51_source-vs-production.md'

          next_prompt = f'''# NEXT AGENT PROMPT — gb-is-my-strength

          > **Только текущая операционная правда.** Счётчики принадлежат `verified/MASTER_BUG_MATRIX.md`.

          **Source main:** `{source}`
          **Last exact production authority:** `{production}`
          **Current source deployment status:** ⚠️ `source != production`; same-SHA production witness для текущего source отсутствует.
          **Current reverify:** `{reverify_rel}`
          **AuditRepo synchronization:** authority-only projection; canonical counters remain 165 closed / 191 open.

          ## 1. Точная граница source

          - current source `main` = `{source}`;
          - после канонического `{previous}` в source ancestry находятся:
            - PR #691 / `c5ae325e5e73f1997112c395fd28f3a52f02ee96` — canonical article headline contract; exact head `6736bf988e3c4e69ffe4ffe90c4f987b12523674`, 14/14 triggered workflows green;
            - PR #669 / `{source}` — Karty audit count derived from governed route inventory; exact head `94748bb7e4ce7035a5687465200fb24676ac4249`, 8/8 triggered workflows green;
          - Workflow Policy v2 remains merged at `{previous}`; AuditRepo PR #117 moved `WORKFLOW-POLICY-SHADOW-ERA` to fixed and set counters to 165 closed / 191 open;
          - active source owner at capture: #680 NoteRegistry; do not modify its branch or owner files;
          - no post-`{production[:8]}` merge is production without a separate same-SHA witness.

          ## 2. Last exact production

          - deploy `30669840189`, attempt `1`, event `push`;
          - release SHA = control-plane SHA = `{production}`;
          - candidate `{production}:30669840189-1`;
          - release digest `sha256:9ae50fc99476af4822181889ac9d3a802138e06265d5ac09d80133f64563d50a`;
          - files / bytes `1152` / `81177351`;
          - immutable path `/deployments/{production}/30669840189-1.json`;
          - candidate artifact `8808656612` / `sha256:c7ddd49753c2a6f7c93b4962cce372a1be99d6f7871e76db6d6b9de12f4c3159`;
          - generic live `8808666936` / `sha256:28333e7d19ebc51641f00ca086e8d77d2a92880ee546161f78a8e4d034957f10`;
          - TTS `8808667707` / `sha256:7b8354caca07d12e682243c22487afe189413dbd5a0fbe36235c55395089aa54`;
          - release ledger comment `5148074092`;
          - physical Windows witness `5148209495`.

          ```text
          current source = {source}
          last exact production = {production}
          source != production
          ```

          ## 3. Следующий порядок

          1. Не продвигать `{source[:8]}` в production authority без exact same-SHA readiness → candidate → Pages/live → TTS → ledger evidence.
          2. Не вмешиваться в active owner-lane #680; использовать его exact head, file boundary and CI evidence.
          3. После освобождения зависимого scope следующий свободный фундамент — source issue #62 Legacy Reference Quarantine.
          4. После NoteRegistry продолжать единый ReaderProjection; не добавлять route-local note/TTS/search/print engines.
          5. `WORKFLOW-POLICY-SHADOW-ERA` закрыт; canonical counters = 165 closed / 191 open.
          '''
          next_prompt = re.sub(r'^          ', '', next_prompt, flags=re.MULTILINE)
          (project / 'NEXT_AGENT_PROMPT.md').write_text(next_prompt, encoding='utf-8')

          evidence = f'''# CURRENT HEAD REVERIFY — source `{source[:8]}` vs production `{production[:8]}`

          **Date:** 2026-08-01
          **Status:** `SOURCE_CURRENT / PRODUCTION_STALE_RELATIVE_TO_SOURCE`
          **Production claim for `{source[:8]}`:** `no`

          ## 1. Authority boundary

          - Current source `main`: `{source}`.
          - Previous canonical source authority: `{previous}`.
          - Last exact production authority: `{production}`.
          - Source and production do not match; neither PR #691 nor PR #669 inherits production evidence.
          - Active source owner at capture: #680 NoteRegistry. This synchronization does not change its branch, files, checks or review state.

          ## 2. New source ancestry

          ### PR #691 — canonical article headline contract

          - merge: `c5ae325e5e73f1997112c395fd28f3a52f02ee96`;
          - exact head: `6736bf988e3c4e69ffe4ffe90c4f987b12523674`;
          - final scope: four files;
          - contract aligns document title, Open Graph, Twitter, Article JSON-LD and breadcrumb headline;
          - explicit same-repository label-gated autofix permission is registered fail-closed;
          - 14/14 triggered workflows passed: Node `30682319933`, Shared `30682319896`, Metadata `30682319931`, Overlay `30682319901`, Glossary `30682319899`, Editorial Metadata `30682319918`, Deploy Candidate `30682319897`, TTS `30682319893`, Native `30682319894`, Dateline `30682319922`, Print `30682319917`, Visual `30682319930`, Route Registry `30682319905`, Runtime `30682319903`;
          - production was not claimed.

          ### PR #669 — governed Karty route inventory

          - merge/current source: `{source}`;
          - exact head: `94748bb7e4ce7035a5687465200fb24676ac4249`;
          - final scope: four files;
          - replaces the hardcoded audit-pending count with one governed inventory over route records while preserving exact publication validation;
          - current visible value remains one published and nine audit-pending maps;
          - 8/8 triggered workflows passed: Shared `30682398717`, Metadata `30682398738`, Glossary `30682398711`, Deploy Candidate `30682398714`, Dateline `30682398734`, Native `30682398731`, Print `30682398719`, Visual `30682398716`;
          - production was not claimed.

          ## 3. Workflow Policy closure already canonical

          AuditRepo PR #117 verified source PR #688 and moved `WORKFLOW-POLICY-SHADOW-ERA` from P1-open to fixed. Canonical counters are now:

          ```text
          closed: 165
          P1 open: 96
          total open: 191
          ```

          This authority synchronization preserves those row dispositions and counts.

          ## 4. Last exact production witness

          The admitted exact production remains:

          - release/control SHA `{production}`;
          - deploy `30669840189`, attempt `1`;
          - candidate `{production}:30669840189-1`;
          - release digest `sha256:9ae50fc99476af4822181889ac9d3a802138e06265d5ac09d80133f64563d50a`;
          - candidate artifact `8808656612` / `sha256:c7ddd49753c2a6f7c93b4962cce372a1be99d6f7871e76db6d6b9de12f4c3159`;
          - generic live artifact `8808666936` / `sha256:28333e7d19ebc51641f00ca086e8d77d2a92880ee546161f78a8e4d034957f10`;
          - TTS artifact `8808667707` / `sha256:7b8354caca07d12e682243c22487afe189413dbd5a0fbe36235c55395089aa54`;
          - ledger comment `5148074092`;
          - physical Windows witness `5148209495`.

          ## 5. Decision

          ```text
          current source = {source}
          last exact production = {production}
          source != production
          ```

          A new same-SHA readiness → candidate → Pages promotion → generic live → TTS → immutable ledger cycle is required before current source can become production authority.

          ## 6. Synchronization boundary

          This lane updates only `NEXT_AGENT_PROMPT`, the matrix authority masthead/statistics label/session log and this paired reverify. It changes no bug rows, no counters, no source repository files, no Research/Drive data and no production evidence.
          '''
          evidence = re.sub(r'^          ', '', evidence, flags=re.MULTILINE)
          evidence_path = project / reverify_rel
          if evidence_path.exists():
              raise SystemExit(f'refusing to overwrite {evidence_path}')
          evidence_path.write_text(evidence, encoding='utf-8')

          matrix_path = project / 'verified/MASTER_BUG_MATRIX.md'
          matrix = matrix_path.read_text(encoding='utf-8')

          def replace_one(pattern, replacement, label):
              nonlocal_holder = None
              global matrix
              matrix, count = re.subn(pattern, replacement, matrix, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'{label}: expected one replacement, got {count}')

          replace_one(
              r'^\| Source HEAD \|.*$',
              f'| Source HEAD | `{source}` (current source main; post-production ancestry includes Pagefind #667, homepage #675, Editorial Metadata v3 #672, Nagornaya #678, glossary trust boundary #683, Workflow Policy v2 #688, canonical headline #691 and governed Karty inventory #669; no current production claim) |',
              'source masthead',
          )
          replace_one(
              r'^\| Deploy \|.*$',
              f'| Deploy | ⚠️ **SOURCE ≠ PRODUCTION.** Last exact production remains run `30669840189` attempt `1`, which promoted `{production}:30669840189-1`; release/control SHA `{production}`; digest `sha256:9ae50fc99476af4822181889ac9d3a802138e06265d5ac09d80133f64563d50a`. Candidate `8808656612` (`sha256:c7ddd49753c2a6f7c93b4962cce372a1be99d6f7871e76db6d6b9de12f4c3159`), generic live `8808666936` (`sha256:28333e7d19ebc51641f00ca086e8d77d2a92880ee546161f78a8e4d034957f10`), TTS `8808667707` (`sha256:7b8354caca07d12e682243c22487afe189413dbd5a0fbe36235c55395089aa54`). Ledger `5148074092`; Windows witness `5148209495`. Current source `{source}` requires a new same-SHA production witness. |',
              'deploy masthead',
          )
          replace_one(r'^\| Last reverify \|.*$', f'| Last reverify | `{reverify_rel}` |', 'reverify masthead')
          replace_one(
              r'^⚠️ Deploy-формулировки.*$',
              f'⚠️ Deploy-формулировки в исторических строках ниже сохраняют состояние соответствующей даты. Current source = `{source}`; last exact production authority = `{production}`. Более новые source-коммиты не наследуют live/production-доказательства старого SHA. PRs #691/#669 слиты после Workflow Policy v2; active source owner at capture: #680. Evidence: `{reverify_rel}`.',
              'authority paragraph',
          )
          replace_one(
              r'^## Статистика \(обновлено 2026-08-01: source `0ff04232`; last exact production `abf1edba`; workflow policy closure verified\)$',
              '## Статистика (обновлено 2026-08-01: source `efaf2a51`; last exact production `abf1edba`; counters 165/191 unchanged)',
              'statistics heading',
          )

          session_marker = '## Session log (append-only)\n\n'
          if matrix.count(session_marker) != 1:
              raise SystemExit('session log marker must occur exactly once')
          session_entry = f'- **2026-08-01 — source advanced to `efaf2a51`; production remains `abf1edba`.** PR #691 / `c5ae325e` established one canonical article-headline contract; exact head `6736bf98` passed 14/14 triggered workflows. PR #669 / `{source}` replaced the Karty literal audit count with one governed route inventory; exact head `94748bb7` passed 8/8 triggered workflows. Active source owner at capture: #680 NoteRegistry. AuditRepo PR #117 already closed `WORKFLOW-POLICY-SHADOW-ERA`; counters remain 165 closed / 191 open. No same-SHA production witness exists for current source. Evidence: `{reverify_rel}`.\n\n'
          if session_entry in matrix:
              raise SystemExit('session entry already exists')
          matrix = matrix.replace(session_marker, session_marker + session_entry, 1)

          for invariant in [
              '## ✅ ЗАКРЫТО (165)',
              '## 🟠 P1 — ОТКРЫТО (96)',
              '| Закрыто (fixed) | 165 |',
              '| P1 открыто | 96 |',
              '| P2 открыто | 36 |',
              '| P3 открыто | 51 |',
              '| **Всего открыто (матрица)** | **191** |',
          ]:
              if invariant not in matrix:
                  raise SystemExit(f'counter invariant drift: {invariant}')
          if matrix.count(source) < 4:
              raise SystemExit('new source authority is not projected to required surfaces')
          matrix_path.write_text(matrix, encoding='utf-8')
          Path('.github/workflows/gb-authority-sync-efaf2a51.yml').unlink()
          PY
