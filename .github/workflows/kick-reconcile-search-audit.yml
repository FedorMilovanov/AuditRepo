name: Kick search-audit reconciliation

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
    paths:
      - .github/workflows/kick-reconcile-search-audit.yml

permissions:
  contents: write

jobs:
  kick:
    if: github.head_ref == 'arena/019fccbd-auditrepo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 1c1b035ed1b3bf000e8d6a9c955414c022c1dc35
      - name: Execute the pinned self-cleaning reconciliation
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'yaml'
          workflow = YAML.load_file('.github/workflows/reconcile-search-audit.yml')
          steps = workflow.fetch('jobs').fetch('reconcile').fetch('steps')
          steps.each do |step|
            script = step['run']
            next unless script
            name = step['name'] || 'unnamed run step'
            puts "\n=== #{name} ==="
            ok = system('bash', '-lc', script)
            abort "step failed: #{name}" unless ok
          end
          RUBY
