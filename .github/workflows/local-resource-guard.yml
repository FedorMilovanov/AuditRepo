name: Local resource guard QA
on:
  pull_request:
    paths:
      - 'scripts/local_resource_guard.py'
      - 'scripts/local_resource_guard_test.py'
      - 'scripts/LOCAL_RESOURCE_GUARD.md'
      - '.github/workflows/local-resource-guard.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/local_resource_guard.py'
      - 'scripts/local_resource_guard_test.py'
      - 'scripts/LOCAL_RESOURCE_GUARD.md'
      - '.github/workflows/local-resource-guard.yml'

permissions:
  contents: read
concurrency:
  group: local-resource-guard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Policy and platform integration
        run: python -B scripts/local_resource_guard_test.py
