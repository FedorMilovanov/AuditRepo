name: Complete Nagornaya dark current-residual inventory

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  complete:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/nagornaya-dark-current-residual-20260804'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/nagornaya-dark-current-residual-20260804
          fetch-depth: 0

      - name: Checkout exact Product source
        uses: actions/checkout@v4
        with:
          repository: FedorMilovanov/gb-is-my-strength
          ref: f9d0120718569c510833dba7a3abd68ce2f6a003
          path: _product
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate fail-closed current residual
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "a1ae62a06a803824d4dd828bbd06a4cead3dd1b1"
          git merge-base --is-ancestor origin/main HEAD
          test "$(git -C _product rev-parse HEAD)" = "f9d0120718569c510833dba7a3abd68ce2f6a003"
          python3 .github/tmp/nagornaya_dark_residual.py
          rm -rf _product
          rm -f .github/workflows/nagornaya-dark-current-residual.yml
          rm -f .github/tmp/nagornaya_dark_residual.py

      - name: Validate bounded canonical transaction
        shell: bash
        run: |
          git diff --check
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          printf '%s\n' \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-current-residual.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            > "${changed_file}"
          export AUDITREPO_CHANGED_PATHS_FILE="${changed_file}"
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py --verbose --json-out reports/matrix-coverage/report.json
          python3 scripts/matrix_coverage_contexts.py \
            --json-out reports/matrix-coverage/contexts.json \
            --markdown-out reports/matrix-coverage/contexts.md
          rm -rf reports/matrix-coverage

      - name: Commit self-cleaned canonical narrowing
        shell: bash
        run: |
          git diff --check
          git add \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-current-residual.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            .github/workflows/nagornaya-dark-current-residual.yml \
            .github/tmp/nagornaya_dark_residual.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit(gb): narrow Nagornaya dark current residual"
          git push origin HEAD:verify/nagornaya-dark-current-residual-20260804
