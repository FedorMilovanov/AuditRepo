name: Recover Nagornaya native-dist dark authority correction

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  recover:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/nagornaya-dark-native-dist-authority-20260804'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/nagornaya-dark-native-dist-authority-20260804
          fetch-depth: 0

      - name: Checkout exact Product source
        uses: actions/checkout@v4
        with:
          repository: FedorMilovanov/gb-is-my-strength
          ref: f9d0120718569c510833dba7a3abd68ce2f6a003
          path: _product
          fetch-depth: 1

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: _product/package-lock.json

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild authoritative native Product dist
        working-directory: _product
        shell: bash
        run: |
          npm ci --no-audit --no-fund
          npm run strangler:build:production-like
          npm run nagornaya:visual-parity:audit

      - name: Generate and reconcile canonical authority correction
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "0142b93de01160b77eda71cb9fd2f72fd8a4fbdc"
          git merge-base --is-ancestor origin/main HEAD
          test "$(git -C _product rev-parse HEAD)" = "f9d0120718569c510833dba7a3abd68ce2f6a003"
          python3 .github/tmp/nagornaya_native_dist.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          PRODUCT_SHA = 'f9d0120718569c510833dba7a3abd68ce2f6a003'
          AUDIT_BASE = '0142b93de01160b77eda71cb9fd2f72fd8a4fbdc'
          matrix_path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          handoff_path = Path('projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md')
          reverify_path = Path('projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-native-dist.md')

          matrix = matrix_path.read_text(encoding='utf-8')
          handoff = handoff_path.read_text(encoding='utf-8')

          body_row = (
              '| NG-BODY-01 | ✅ **CURRENT DUPLICATE / MERGED INTO `NG-DARK-01`; NATIVE-DIST AUTHORITY CORRECTED 2026-08-04.** '
              'Product `f9d0120718569c510833dba7a3abd68ce2f6a003` passed the native Nagornaya parity contract and production-like build. '
              'Five chapter routes use dark-capable `bg-stone-900`, but built `/nagornaya/`, `/nagornaya/istochniki/` and `/nagornaya/nakhodki/` still use `bg-stone-100`; exact route-linked dist scanning found no direct dark-context rule for that token on those using routes. '
              'PR #150’s FIXED-CURRENT explanation is therefore superseded. This row remains in the closed section only to preserve Single-Writer-Per-Fact: the current body subset is owned exclusively by open `NG-DARK-01` and must be included in its browser/computed-style acceptance boundary. '
              'No Product mutation, browser, production or TTS claim. | `f9d01207` |'
          )
          pattern = re.compile(r'(?m)^\| NG-BODY-01 \|.*$')
          if len(pattern.findall(matrix)) != 1:
              raise SystemExit('NG-BODY-01 cardinality drift')
          matrix = pattern.sub(body_row, matrix, count=1)

          product_line = re.compile(r'(?m)^- Product `main@f9d0120718569c510833dba7a3abd68ce2f6a003` remains source authority\..*$')
          if len(product_line.findall(handoff)) != 1:
              raise SystemExit('handoff Product authority line drift')
          handoff = product_line.sub(
              '- Product `main@f9d0120718569c510833dba7a3abd68ce2f6a003` remains source authority. Native production-like dist, not legacy shadows, owns `NG-DARK-01`: 19 historical-scope tokens / 443 uses lack complete direct dark coverage. `NG-BODY-01` is current on three built body routes but remains closed only as duplicate/merged into this root. `NG-INLINE-01` and `NG-SEO-01` remain open independently.',
              handoff,
              count=1,
          )

          next_line = re.compile(r'(?m)^2\. Use only the native production-like dist residual \(19 tokens / 443 uses\) for future browser verification; do not repair from PR #151 legacy-shadow counts\.$')
          if len(next_line.findall(handoff)) != 1:
              raise SystemExit('handoff next-work authority line drift')
          handoff = next_line.sub(
              '2. Use only the native production-like dist residual (19 tokens / 443 uses) for future browser verification, including the three current `bg-stone-100` body routes owned under `NG-DARK-01`; do not repair from PR #150/#151 legacy authority claims.',
              handoff,
              count=1,
          )

          reverify = f'''# CURRENT HEAD REVERIFY — Nagornaya native/dist dark-theme authority correction

- Date: 2026-08-04
- Source repository: `FedorMilovanov/gb-is-my-strength`
- Canonical finding: `NG-DARK-01`
- Duplicate subset: `NG-BODY-01`
- Product anchor: `{PRODUCT_SHA}`
- AuditRepo base: `{AUDIT_BASE}`
- Authority-correction lane: AuditRepo PR #152
- Product mutation: **none**
- Browser/live-production claim: **none**
- TTS scope: **excluded**

## Why this correction exists

AuditRepo PR #151 correctly rejected the stale broad July wording but counted legacy shadow HTML. Current Product authority is native Astro: `scripts/nagornaya-visual-parity-audit.js` requires all nine routes to own native pages/components and forbids legacy full-document transport.

This reverify supersedes PR #151 for source authority and also supersedes PR #150’s `NG-BODY-01` **FIXED-CURRENT** explanation. The canonical inventory comes from a successful `strangler:build:production-like`, followed by exact inspection of built `dist/nagornaya/**/index.html` and CSS/inline styles actually linked by each built page.

## Native production-like route boundary

The build produced all nine expected native routes:

- `nagornaya/index.html`
- `nagornaya/chast-1/index.html`
- `nagornaya/chast-2/index.html`
- `nagornaya/chast-3/index.html`
- `nagornaya/chast-4/index.html`
- `nagornaya/chast-5/index.html`
- `nagornaya/seriya/index.html`
- `nagornaya/istochniki/index.html`
- `nagornaya/nakhodki/index.html`

Every built route contains `nagornaya-page` and `main-content`; the native parity audit passed all nine routes.

Native body ownership is mixed:

- `nagornaya/chast-1/` through `chast-5/` use `bg-stone-900`;
- `nagornaya/`, `nagornaya/istochniki/` and `nagornaya/nakhodki/` use `bg-stone-100`;
- `nagornaya/seriya/` has no stone body utility.

## Historical-scope native-dist inventory

The built output contains **20 historically in-scope tokens / 456 uses**.

Only **1 token / 13 uses** has a direct linked dark-context rule on every built route where it is used:

| Utility token | Uses | Native-dist status |
|---|---:|---|
| `bg-rose-50` | 13 | covered on every using route |

The authoritative source residual is **19 tokens / 443 uses**:

| Utility token | Uses | Native-dist direct dark coverage |
|---|---:|---|
| `border-stone-100` | 167 | missing on using routes |
| `text-amber-600` | 45 | missing on using routes |
| `text-blue-600` | 41 | missing on using routes |
| `text-rose-600` | 41 | missing on using routes |
| `text-purple-600` | 40 | missing on using routes |
| `text-blue-700` | 22 | missing on using routes |
| `text-emerald-700` | 15 | missing on using routes |
| `text-emerald-600` | 14 | missing on using routes |
| `bg-stone-100` | 13 | missing on using routes, including three body owners |
| `text-purple-700` | 12 | missing on using routes |
| `text-amber-800` | 11 | missing on using routes |
| `text-amber-700` | 8 | missing on using routes |
| `text-red-700` | 3 | missing on using routes |
| `text-teal-600` | 3 | missing on using routes |
| `text-teal-700` | 3 | missing on using routes |
| `bg-stone-200` | 2 | missing on using routes |
| `text-orange-700` | 1 | missing on using routes |
| `text-red-600` | 1 | missing on using routes |
| `text-rose-700` | 1 | missing on using routes |

## Canonical dispositions

`NG-DARK-01` remains **OPEN / CURRENT** with the authoritative native-dist source boundary above.

`NG-BODY-01` is **CURRENT**, not fixed. It remains in the closed section only as **DUPLICATE / MERGED INTO `NG-DARK-01`**, so there is one repair owner rather than two. The three built `bg-stone-100` body routes are mandatory browser/computed-style acceptance cases for the root.

Missing direct coverage is still a source-level obligation, not proof of a visual contrast failure. Future browser verification must operate on native production-like output and classify the 19-token set before Product mutation.

## Evidence boundary

- exact Product `{PRODUCT_SHA}`;
- successful native parity contract and production-like build;
- exact built HTML plus route-linked CSS/inline styles;
- no Product mutation;
- no browser, computed-style, deployed-SHA or live-production claim;
- no TTS inspection or modification;
- canonical arithmetic remains **358 = 213 closed + 145 open**, P1 **70**.
'''
          reverify_path.write_text(reverify, encoding='utf-8')

          if matrix.count('| NG-DARK-01 |') != 1 or matrix.count('| NG-BODY-01 |') != 1:
              raise SystemExit('canonical row cardinality changed')
          if '19 historical-scope tokens / 443 uses' not in matrix:
              raise SystemExit('native-dist root result missing from matrix')
          if '## ✅ ЗАКРЫТО (213)' not in matrix or '## 🟠 P1 — ОТКРЫТО (70)' not in matrix:
              raise SystemExit('canonical counters changed unexpectedly')
          if '**358 IDs = 213 closed + 145 open**' not in handoff:
              raise SystemExit('handoff arithmetic changed')
          if 'TTS scope: **excluded**' not in reverify:
              raise SystemExit('TTS exclusion missing')

          matrix_path.write_text(matrix, encoding='utf-8')
          handoff_path.write_text(handoff, encoding='utf-8')
          PY
          rm -rf _product
          rm -f .github/workflows/nagornaya-dark-native-dist-authority.yml
          rm -f .github/workflows/nagornaya-dark-native-dist-recovery.yml
          rm -f .github/tmp/nagornaya_native_dist.py

      - name: Validate bounded AuditRepo transaction
        shell: bash
        run: |
          git diff --check
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          printf '%s\n' \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-native-dist.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            > "${changed_file}"
          export AUDITREPO_CHANGED_PATHS_FILE="${changed_file}"
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py --verbose --json-out reports/matrix-coverage/report.json
          python3 scripts/matrix_coverage_contexts.py --json-out reports/matrix-coverage/contexts.json --markdown-out reports/matrix-coverage/contexts.md
          rm -rf reports/matrix-coverage

      - name: Commit self-cleaned authority correction
        shell: bash
        run: |
          git diff --check
          git add \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-native-dist.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            .github/workflows/nagornaya-dark-native-dist-authority.yml \
            .github/workflows/nagornaya-dark-native-dist-recovery.yml \
            .github/tmp/nagornaya_native_dist.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit(gb): correct Nagornaya dark authority to native dist"
          git push origin HEAD:verify/nagornaya-dark-native-dist-authority-20260804
