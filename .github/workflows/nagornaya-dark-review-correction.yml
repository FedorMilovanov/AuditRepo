name: Reconcile reviewed Nagornaya dark residual

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/nagornaya-dark-current-residual-20260804'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/nagornaya-dark-current-residual-20260804
          fetch-depth: 0

      - name: Apply reviewed historical-scope boundary
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "a1ae62a06a803824d4dd828bbd06a4cead3dd1b1"
          git merge-base --is-ancestor origin/main HEAD
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          text = path.read_text(encoding='utf-8')

          old_anchor = '| Source verification anchor | `f9d0120718569c510833dba7a3abd68ce2f6a003` (exact route-linked CSS inventory: `NG-DARK-01` narrowed to 49 current residual tokens / 539 uses; no Product mutation, browser, production or TTS claim). |'
          new_anchor = '| Source verification anchor | `f9d0120718569c510833dba7a3abd68ce2f6a003` (exact route-linked CSS inventory: `NG-DARK-01` narrowed to 12 historically in-scope tokens / 327 uses; 37 ambient no-selector tokens are not promoted without browser/owner evidence; no Product mutation, browser, production or TTS claim). |'
          if text.count(old_anchor) != 1:
              raise SystemExit('source anchor drift')
          text = text.replace(old_anchor, new_anchor, 1)

          pattern = re.compile(r'(?m)^\| NG-DARK-01 \|.*$')
          matches = pattern.findall(text)
          if len(matches) != 1:
              raise SystemExit(f'NG-DARK-01 cardinality drift: {len(matches)}')
          new_row = '| NG-DARK-01 | ⚠️ **CURRENT / NARROWED 2026-08-04:** Exact Product `f9d0120718569c510833dba7a3abd68ce2f6a003` scan covered 9 current legacy Nagornaya routes and 114 ambient color utility tokens / 2947 uses. Manual classification keeps only the July row\'s historical families: 20 currently used tokens / 467 uses. Linked dark CSS now covers 8 of those tokens / 140 uses, including `bg-stone-100`, `bg-rose-50`, `text-amber-800` and several 600/700 accent levels. The bounded source residual is **12 tokens / 327 uses**: `border-stone-100` (167×), `text-blue-600` (41×), `text-rose-600` (41×), `text-purple-600` (40×), `text-emerald-600` (15×), `text-purple-700` (12×), `text-teal-600` (3×), `text-teal-700` (3×), `bg-stone-200` (2×), `text-orange-700` (1×), `text-red-600` (1×), `text-rose-700` (1×). The other 37 ambient tokens without a direct selector are not silently classified as defects. Future browser verification or Product repair must stay inside this boundary. No Product mutation, browser, production or TTS claim. | current source `f9d01207`; `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-current-residual.md` |'
          text = pattern.sub(new_row, text, count=1)

          if '## ✅ ЗАКРЫТО (213)' not in text or '## 🟠 P1 — ОТКРЫТО (70)' not in text:
              raise SystemExit('canonical counters changed unexpectedly')
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/nagornaya-dark-review-correction.yml

      - name: Validate canonical scope
        shell: bash
        run: |
          git diff --check
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          printf '%s\n' \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-current-residual.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            > "${changed_file}"
          export AUDITREPO_CHANGED_PATHS_FILE="${changed_file}"
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py --verbose --json-out reports/matrix-coverage/report.json
          python3 scripts/matrix_coverage_contexts.py --json-out reports/matrix-coverage/contexts.json --markdown-out reports/matrix-coverage/contexts.md
          rm -rf reports/matrix-coverage

      - name: Commit self-cleaned review correction
        shell: bash
        run: |
          git add projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md .github/workflows/nagornaya-dark-review-correction.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit(gb): bound Nagornaya dark residual to historical scope"
          git push origin HEAD:verify/nagornaya-dark-current-residual-20260804
