name: Complete Nagornaya dark subset consolidation

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  complete:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/nagornaya-dark-subset-duplicates-20260804'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/nagornaya-dark-subset-duplicates-20260804
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable AuditRepo base
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "92bd5457c391604507147694a826791cb0c061d2"
          git merge-base --is-ancestor origin/main HEAD

      - name: Apply bounded canonical transaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          matrix_path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          handoff_path = Path('projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md')
          matrix = matrix_path.read_text(encoding='utf-8')
          handoff = handoff_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one marker, found {count}')
              return text.replace(old, new, 1)

          row04 = '| NG-DARK-04 | 🆕 **Нагорная P2:** `bg-rose-50` без dark-ремапа — 26 контейнеров (13 MainShell + 13 Sections) в ch.5 остаются #fff1f2 в тёмной теме. **Подтверждено cycle 4:** `bg-rose-50` ОТСУТСТВУЕТ в blanket `.bg-*-50` группе `mobile-hotfix.css` (перечислены 14 цветов, НО НЕ rose). Решение: per-chapter `var(--ng-accent-soft)`. Evidence: `evidence/NAGORNAYA_DEEP_DARK_THEME_AUDIT_2026-07-14.md` + `evidence/NAGORNAYA_DEEP_AUDIT_CYCLE4_2026-07-14.md` §5.2 |\n'
          row05 = '| NG-DARK-05 | 🆕 **Нагорная P2:** `bg-stone-100/200` без dark-ремапа — 18 контейнеров остаются светлыми. Решение: ремап → `var(--color-surface-alt)`/`var(--color-surface-2)`. Evidence: `evidence/NAGORNAYA_DEEP_DARK_THEME_AUDIT_2026-07-14.md` + `evidence/NAGORNAYA_DEEP_AUDIT_CYCLE4_2026-07-14.md` §5.2 |\n'
          closed04 = '| NG-DARK-04 | ✅ **DUPLICATE / MERGED INTO `NG-DARK-01` 2026-08-04.** The 26 `bg-rose-50` containers refine the same missing dark-remap/per-chapter-variable root cause explicitly owned by open `NG-DARK-01`; they do not define an independent repair lane. Current Product `f9d0120718569c510833dba7a3abd68ce2f6a003` still lacks this remap, so the root remains open. No Product mutation or production claim. | `f9d01207` |\n'
          closed05 = '| NG-DARK-05 | ✅ **DUPLICATE / MERGED INTO `NG-DARK-01` 2026-08-04.** The 18 `bg-stone-100/200` containers refine the same unmapped Tailwind-class architecture explicitly listed by open `NG-DARK-01`; closing this subset does not claim the containers are fixed. Current Product `f9d0120718569c510833dba7a3abd68ce2f6a003` still lacks the remap. No Product mutation or production claim. | `f9d01207` |\n'

          matrix = replace_once(
              matrix,
              '| Source verification anchor | `f9d0120718569c510833dba7a3abd68ce2f6a003` (`QUAL-P1-02` Hebrew font/RTL root cause fixed by Product PR #873 after exact-head source, Chromium and CI verification; no production claim). |',
              '| Source verification anchor | `f9d0120718569c510833dba7a3abd68ce2f6a003` (current verifier consolidation: `NG-DARK-04/05` merged into still-open root `NG-DARK-01`; no Product mutation, source-fix or production claim). |',
              'matrix source anchor',
          )
          matrix = replace_once(
              matrix,
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_qual-p1-02-hebrew-semantics.md` |',
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-subset-duplicates.md` |',
              'matrix reverify',
          )
          matrix = replace_once(matrix, '## ✅ ЗАКРЫТО (207)', '## ✅ ЗАКРЫТО (209)', 'closed heading')
          matrix = replace_once(
              matrix,
              '| ID | Описание | Коммит |\n|---|---|---|\n| QUAL-P1-02 |',
              '| ID | Описание | Коммит |\n|---|---|---|\n' + closed04 + closed05 + '| QUAL-P1-02 |',
              'closed row insertion',
          )
          matrix = replace_once(matrix, row04, '', 'open NG-DARK-04 row')
          matrix = replace_once(matrix, row05, '', 'open NG-DARK-05 row')
          matrix = replace_once(matrix, '## 🟡 P2 — ОТКРЫТО (31)', '## 🟡 P2 — ОТКРЫТО (29)', 'P2 heading')
          matrix = replace_once(matrix, '| Закрыто (fixed) | 207 |', '| Закрыто (fixed) | 209 |', 'fixed summary')
          matrix = replace_once(matrix, '| P2 открыто | 31 |', '| P2 открыто | 29 |', 'P2 summary')
          matrix = replace_once(
              matrix,
              '| **Всего открыто (матрица)** | **151** |',
              '| **Всего открыто (матрица)** | **149** |',
              'total-open summary',
          )

          handoff = replace_once(
              handoff,
              '**AuditRepo base before this handoff:** `9211b3edd7ca486c1a7457abc24ccdbf99c18d84`',
              '**AuditRepo base before this handoff:** `92bd5457c391604507147694a826791cb0c061d2`',
              'handoff AuditRepo base',
          )
          handoff = replace_once(
              handoff,
              '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_qual-p1-02-hebrew-semantics.md`',
              '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-subset-duplicates.md`',
              'handoff reverify',
          )
          handoff = replace_once(
              handoff,
              '**Canonical matrix:** **358 IDs = 207 closed + 151 open**.',
              '**Canonical matrix:** **358 IDs = 209 closed + 149 open**.',
              'handoff arithmetic',
          )
          handoff = replace_once(
              handoff,
              'Source movement does **not** change canonical AuditRepo counts by itself. AuditRepo PRs #132, #136–#141 and #143–#144 are merged; PR #142 was closed unmerged after its exact-row gate disproved an incorrect duplicate mapping. Product PR #873 is merged and supplies the exact source/Chromium/CI evidence for closing `QUAL-P1-02`; AuditRepo PR #145 records only that disposition and makes no Product mutation or production claim.',
              'Source movement does **not** change canonical AuditRepo counts by itself. AuditRepo PRs #132, #136–#141 and #143–#145 are merged; PR #142 was closed unmerged after its exact-row gate disproved an incorrect duplicate mapping. AuditRepo PR #146 merges `NG-DARK-04/05` into still-open root `NG-DARK-01`; it makes no Product mutation, source-fix or production claim.',
              'handoff source movement',
          )
          handoff = replace_once(
              handoff,
              '- Product PR #875 (`lane/system-tts-deep-audit-2026-08-04`) is an unrelated TTS diagnostic lane touching `scripts/tts-engine-lifecycle-browser-test.js`; it does not overlap this Karty closure.\n- Product `main@f9d0120718569c510833dba7a3abd68ce2f6a003` is source authority for `QUAL-P1-02`; the last exact production authority remains separate.',
              '- Product PR #875 (`lane/system-tts-deep-audit-2026-08-04`) is an unrelated TTS diagnostic lane; it does not overlap this verifier-only Nagornaya transaction.\n- Product `main@f9d0120718569c510833dba7a3abd68ce2f6a003` remains source authority; `NG-DARK-01` is still open because the relevant remaps are absent.',
              'handoff Product owners',
          )
          handoff = replace_once(
              handoff,
              '- PR #145 (`verify/qual-p1-02-hebrew-closure-20260804`) is the active canonical closure lane for `QUAL-P1-02`.',
              '- PR #146 (`verify/nagornaya-dark-subset-duplicates-20260804`) is the active canonical duplicate-consolidation lane for `NG-DARK-04/05`.',
              'handoff AuditRepo owner',
          )
          handoff = replace_once(handoff, '- P2: 31', '- P2: 29', 'handoff P2')
          handoff = replace_once(handoff, '- Total open: 151', '- Total open: 149', 'handoff open')
          handoff = replace_once(handoff, '- Closed: 207', '- Closed: 209', 'handoff closed')
          handoff = replace_once(
              handoff,
              '1. Merge AuditRepo PR #145 only after validator, matrix coverage and repository-history forensic checks pass on its exact final head.\n2. Re-fetch both repositories and continue current-head harvest; keep all Nagornaya root owners open until bounded Product repairs exist.',
              '1. Merge AuditRepo PR #146 only after validator, matrix coverage and repository-history forensic checks pass on its exact final head.\n2. Keep `NG-DARK-01` open until a bounded Product repair implements the missing per-chapter dark remaps; do not recreate `NG-DARK-04/05` as separate owners.',
              'handoff next work',
          )

          if matrix.count('| NG-DARK-04 |') != 1 or matrix.count('| NG-DARK-05 |') != 1:
              raise SystemExit('dark subset IDs must exist exactly once after consolidation')
          if matrix.count('| NG-DARK-01 |') != 1:
              raise SystemExit('root NG-DARK-01 must remain open exactly once')
          if '## ✅ ЗАКРЫТО (209)' not in matrix or '## 🟡 P2 — ОТКРЫТО (29)' not in matrix:
              raise SystemExit('matrix headings were not updated')
          if '**358 IDs = 209 closed + 149 open**' not in handoff:
              raise SystemExit('handoff arithmetic missing')

          matrix_path.write_text(matrix, encoding='utf-8')
          handoff_path.write_text(handoff, encoding='utf-8')
          PY

      - name: Validate bounded transaction
        shell: bash
        run: |
          git diff --check
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          printf '%s\n' \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-subset-duplicates.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            > "${changed_file}"
          export AUDITREPO_CHANGED_PATHS_FILE="${changed_file}"
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py \
            --verbose \
            --json-out reports/matrix-coverage/report.json
          python3 scripts/matrix_coverage_contexts.py \
            --json-out reports/matrix-coverage/contexts.json \
            --markdown-out reports/matrix-coverage/contexts.md

      - name: Commit canonical consolidation and remove executor
        shell: bash
        run: |
          rm .github/workflows/nagornaya-dark-subset-duplicates.yml
          rm -rf reports/matrix-coverage
          git diff --check
          git status --short
          git add \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-subset-duplicates.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            .github/workflows/nagornaya-dark-subset-duplicates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit(gb): merge Nagornaya dark subset duplicates"
          git push origin HEAD:verify/nagornaya-dark-subset-duplicates-20260804
