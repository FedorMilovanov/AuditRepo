name: Complete Nagornaya library duplicate consolidation

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  complete:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/nagornaya-library-inline-duplicates-20260804'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/nagornaya-library-inline-duplicates-20260804
          fetch-depth: 0

      - name: Checkout exact Product source
        uses: actions/checkout@v4
        with:
          repository: FedorMilovanov/gb-is-my-strength
          ref: f9d0120718569c510833dba7a3abd68ce2f6a003
          path: _product
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable AuditRepo base and current Product source
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "5a5a21f09d58572f2860e2807d0e7d8454eb9aea"
          git merge-base --is-ancestor origin/main HEAD
          test "$(git -C _product rev-parse HEAD)" = "f9d0120718569c510833dba7a3abd68ce2f6a003"
          python3 - <<'PY'
          from pathlib import Path
          import re

          product = Path('_product')
          reverify = Path('projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-library-inline-duplicates.md')
          allowed = {'.astro', '.html', '.mdx', '.jsx', '.tsx', '.css'}
          ignored = {'.git', 'node_modules', 'dist', 'archive', 'reports'}
          matches = []
          for path in product.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed:
                  continue
              if any(part in ignored for part in path.parts):
                  continue
              try:
                  if path.stat().st_size > 2_000_000:
                      continue
                  text = path.read_text(encoding='utf-8')
              except (OSError, UnicodeDecodeError):
                  continue
              lower = text.lower()
              if (
                  'Из библиотеки' in text
                  and re.search(r'\bstyle\s*=', text, re.IGNORECASE)
                  and '#b8882a' in lower
                  and '#8a7968' in lower
              ):
                  matches.append(path.relative_to(product).as_posix())

          matches = sorted(set(matches))
          if len(matches) < 5:
              raise SystemExit(f'expected at least five current inline library sources, found {len(matches)}: {matches}')

          doc = reverify.read_text(encoding='utf-8')
          marker = '{{CURRENT_SOURCE_SCAN}}'
          if doc.count(marker) != 1:
              raise SystemExit('source scan placeholder must exist exactly once')
          inventory = [
              f'- Exact source scan found **{len(matches)}** current files containing the block, inline style boundary and both hardcoded colors:',
              *[f'  - `{path}`' for path in matches],
          ]
          reverify.write_text(doc.replace(marker, '\n'.join(inventory), 1), encoding='utf-8')
          PY

      - name: Apply bounded canonical transaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          matrix_path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          handoff_path = Path('projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md')
          matrix = matrix_path.read_text(encoding='utf-8')
          handoff = handoff_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one marker, found {count}')
              return text.replace(old, new, 1)

          row09 = '| NG-VIS-09 | 🆕 **Нагорная P3:** «Из библиотеки» на inline-стилях вместо Tailwind — не адаптивно к тёмной теме, дублируется в 5 файлах. Evidence: `evidence/NAGORNAYA_VISUAL_AUDIT_2026-07-14.md` |\n'
          row11 = '| NG-VIS-11 | 🆕 **Нагорная P3:** Захардкоженные `#b8882a`/`#8a7968` в «Из библиотеки» лейбле — не адаптированы к тёмной теме. Evidence: `evidence/NAGORNAYA_VISUAL_AUDIT_2026-07-14.md` |\n'
          closed09 = '| NG-VIS-09 | ✅ **DUPLICATE / MERGED INTO `NG-INLINE-01` 2026-08-04.** The same “Из библиотеки” inline-style implementation, dark-theme failure and five-file duplication are already owned by open P1 root `NG-INLINE-01`. Exact Product `f9d0120718569c510833dba7a3abd68ce2f6a003` source scan confirmed the current repeated inline blocks. No Product mutation, source-fix or production claim. | `f9d01207` |\n'
          closed11 = '| NG-VIS-11 | ✅ **DUPLICATE / MERGED INTO `NG-INLINE-01` 2026-08-04.** Hardcoded `#b8882a` and `#8a7968` are direct subsets of the exact inline palette already listed by open root `NG-INLINE-01`. Current Product source scan confirmed both values in the repeated blocks; closing the subset does not claim a fix. No Product mutation or production claim. | `f9d01207` |\n'

          matrix = replace_once(
              matrix,
              '| Source verification anchor | `f9d0120718569c510833dba7a3abd68ce2f6a003` (current verifier consolidation: `NG-DARK-04/05` merged into still-open root `NG-DARK-01`; no Product mutation, source-fix or production claim). |',
              '| Source verification anchor | `f9d0120718569c510833dba7a3abd68ce2f6a003` (exact Product source scan plus verifier consolidation: `NG-VIS-09/11` merged into still-open root `NG-INLINE-01`; no Product mutation, source-fix or production claim). |',
              'matrix source anchor',
          )
          matrix = replace_once(
              matrix,
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-subset-duplicates.md` |',
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-library-inline-duplicates.md` |',
              'matrix reverify',
          )
          matrix = replace_once(matrix, '## ✅ ЗАКРЫТО (209)', '## ✅ ЗАКРЫТО (211)', 'closed heading')
          matrix = replace_once(
              matrix,
              '| ID | Описание | Коммит |\n|---|---|---|\n| NG-DARK-04 |',
              '| ID | Описание | Коммит |\n|---|---|---|\n' + closed09 + closed11 + '| NG-DARK-04 |',
              'closed row insertion',
          )
          matrix = replace_once(matrix, row09, '', 'open NG-VIS-09 row')
          matrix = replace_once(matrix, row11, '', 'open NG-VIS-11 row')
          matrix = replace_once(matrix, '## 🟢 P3 — ОТКРЫТО (42)', '## 🟢 P3 — ОТКРЫТО (40)', 'P3 heading')
          matrix = replace_once(
              matrix,
              '## Статистика (обновлено 2026-08-04: disposition anchor `0fbe7d1e`; last exact production `abf1edba`; 358 canonical = 206 closed + 152 open)',
              '## Статистика (обновлено 2026-08-04: disposition anchor `f9d01207`; last exact production `abf1edba`; 358 canonical = 211 closed + 147 open)',
              'statistics narrative',
          )
          matrix = replace_once(matrix, '| Закрыто (fixed) | 209 |', '| Закрыто (fixed) | 211 |', 'fixed summary')
          matrix = replace_once(matrix, '| P3 открыто | 42 |', '| P3 открыто | 40 |', 'P3 summary')
          matrix = replace_once(
              matrix,
              '| **Всего открыто (матрица)** | **149** |',
              '| **Всего открыто (матрица)** | **147** |',
              'total-open summary',
          )

          handoff = replace_once(
              handoff,
              '**AuditRepo base before this handoff:** `92bd5457c391604507147694a826791cb0c061d2`',
              '**AuditRepo base before this handoff:** `5a5a21f09d58572f2860e2807d0e7d8454eb9aea`',
              'handoff AuditRepo base',
          )
          handoff = replace_once(
              handoff,
              '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-subset-duplicates.md`',
              '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-library-inline-duplicates.md`',
              'handoff reverify',
          )
          handoff = replace_once(
              handoff,
              '**Canonical matrix:** **358 IDs = 209 closed + 149 open**.',
              '**Canonical matrix:** **358 IDs = 211 closed + 147 open**.',
              'handoff arithmetic',
          )
          handoff = replace_once(
              handoff,
              'Source movement does **not** change canonical AuditRepo counts by itself. AuditRepo PRs #132, #136–#141 and #143–#145 are merged; PR #142 was closed unmerged after its exact-row gate disproved an incorrect duplicate mapping. AuditRepo PR #146 merges `NG-DARK-04/05` into still-open root `NG-DARK-01`; it makes no Product mutation, source-fix or production claim.',
              'Source movement does **not** change canonical AuditRepo counts by itself. AuditRepo PRs #132, #136–#141 and #143–#146 are merged; PR #142 was closed unmerged after its exact-row gate disproved an incorrect duplicate mapping. AuditRepo PR #147 merges `NG-VIS-09/11` into still-open root `NG-INLINE-01` after an exact Product source scan; it makes no Product mutation, source-fix or production claim.',
              'handoff source movement',
          )
          handoff = replace_once(
              handoff,
              '- Product PR #875 (`lane/system-tts-deep-audit-2026-08-04`) is an unrelated TTS diagnostic lane; it does not overlap this verifier-only Nagornaya transaction.\n- Product `main@f9d0120718569c510833dba7a3abd68ce2f6a003` remains source authority; `NG-DARK-01` is still open because the relevant remaps are absent.',
              '- Product PR #875 (`lane/system-tts-deep-audit-2026-08-04`) is an unrelated TTS diagnostic lane; it does not overlap this verifier-only Nagornaya transaction.\n- Product `main@f9d0120718569c510833dba7a3abd68ce2f6a003` remains source authority; `NG-DARK-01` and `NG-INLINE-01` remain open current root owners.',
              'handoff Product owners',
          )
          handoff = replace_once(
              handoff,
              '- PR #146 (`verify/nagornaya-dark-subset-duplicates-20260804`) is the active canonical duplicate-consolidation lane for `NG-DARK-04/05`.',
              '- PR #147 (`verify/nagornaya-library-inline-duplicates-20260804`) is the active canonical duplicate-consolidation lane for `NG-VIS-09/11`.',
              'handoff AuditRepo owner',
          )
          handoff = replace_once(handoff, '- P3: 42', '- P3: 40', 'handoff P3')
          handoff = replace_once(handoff, '- Total open: 149', '- Total open: 147', 'handoff open')
          handoff = replace_once(handoff, '- Closed: 209', '- Closed: 211', 'handoff closed')
          handoff = replace_once(
              handoff,
              '1. Merge AuditRepo PR #146 only after validator, matrix coverage and repository-history forensic checks pass on its exact final head.\n2. Keep `NG-DARK-01` open until a bounded Product repair implements the missing per-chapter dark remaps; do not recreate `NG-DARK-04/05` as separate owners.',
              '1. Merge AuditRepo PR #147 only after validator, matrix coverage and repository-history forensic checks pass on its exact final head.\n2. Keep `NG-INLINE-01` open until a bounded Product repair extracts the repeated library block; do not recreate `NG-VIS-09/11` as separate owners. Keep `NG-DARK-01` open independently.',
              'handoff next work',
          )

          if matrix.count('| NG-VIS-09 |') != 1 or matrix.count('| NG-VIS-11 |') != 1:
              raise SystemExit('library duplicate IDs must exist exactly once after consolidation')
          if matrix.count('| NG-INLINE-01 |') != 1:
              raise SystemExit('root NG-INLINE-01 must remain open exactly once')
          if '## ✅ ЗАКРЫТО (211)' not in matrix or '## 🟢 P3 — ОТКРЫТО (40)' not in matrix:
              raise SystemExit('matrix headings were not updated')
          if '**358 IDs = 211 closed + 147 open**' not in handoff:
              raise SystemExit('handoff arithmetic missing')

          matrix_path.write_text(matrix, encoding='utf-8')
          handoff_path.write_text(handoff, encoding='utf-8')
          PY

      - name: Validate bounded transaction
        shell: bash
        run: |
          test ! -e projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-library-inline-duplicates.md.tmp
          ! grep -R '{{CURRENT_SOURCE_SCAN}}' projects/gb-is-my-strength
          git diff --check
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          printf '%s\n' \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-library-inline-duplicates.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            > "${changed_file}"
          export AUDITREPO_CHANGED_PATHS_FILE="${changed_file}"
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py \
            --verbose \
            --json-out reports/matrix-coverage/report.json
          python3 scripts/matrix_coverage_contexts.py \
            --json-out reports/matrix-coverage/contexts.json \
            --markdown-out reports/matrix-coverage/contexts.md

      - name: Commit canonical consolidation and remove executor
        shell: bash
        run: |
          rm -rf _product
          rm .github/workflows/nagornaya-library-inline-duplicates.yml
          rm -rf reports/matrix-coverage
          git diff --check
          git status --short
          git add \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-library-inline-duplicates.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            .github/workflows/nagornaya-library-inline-duplicates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit(gb): merge Nagornaya library duplicate rows"
          git push origin HEAD:verify/nagornaya-library-inline-duplicates-20260804
