name: One-time fixed-source closure wave V1

on:
  pull_request:
    branches: [main]

jobs:
  close-fixed-wave-v1:
    if: github.head_ref == 'verifier/close-source-fixed-wave-v1-20260802' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout writable PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: verifier/close-source-fixed-wave-v1-20260802
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize closure wave
        run: python3 scripts/_close_fixed_wave_v1_once.py
      - name: Validate permanent transaction
        run: |
          set -o pipefail
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          python3 scripts/check_matrix_coverage.py \
            --verbose \
            --json-out /tmp/matrix-report.json \
            | tee /tmp/matrix-report.log
          test "$(python3 -c 'import json; print(json.load(open("/tmp/matrix-report.json"))["matrixIds"])')" = "358"
          test "$(python3 -c 'import json; print(json.load(open("/tmp/matrix-report.json"))["closedRows"])')" = "183"
          test "$(python3 -c 'import json; print(json.load(open("/tmp/matrix-report.json"))["openRows"])')" = "175"
          test "$(python3 -c 'import json; print(json.load(open("/tmp/matrix-report.json"))["problems"])')" = "0"
          python3 scripts/check_auditrepo_structure.py
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          git diff --name-only HEAD > "${changed_file}"
          AUDITREPO_CHANGED_PATHS_FILE="${changed_file}" python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          git diff --check
      - name: Commit validated permanent files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-02_3aba5112_fixed-source-wave-v1.md
          git commit -m "audit(gb): close fixed-source wave V1"
          git push origin HEAD:verifier/close-source-fixed-wave-v1-20260802
