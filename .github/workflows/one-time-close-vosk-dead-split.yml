name: One-time close Vosk dead split

on:
  pull_request:
    branches: [main]

jobs:
  close-vosk-dead-split:
    if: github.head_ref == 'verifier/close-vosk-dead-split-20260802' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: verifier/close-vosk-dead-split-20260802
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize closure
        run: python3 scripts/_close_vosk_dead_split_once.py
      - name: Validate transaction
        run: |
          set -o pipefail
          python3 scripts/matrix_coverage_regression_test.py
          python3 scripts/check_matrix_coverage.py --verbose --json-out /tmp/report.json | tee /tmp/report.log
          test "$(python3 -c 'import json; print(json.load(open("/tmp/report.json"))["matrixIds"])')" = "358"
          test "$(python3 -c 'import json; print(json.load(open("/tmp/report.json"))["closedRows"])')" = "184"
          test "$(python3 -c 'import json; print(json.load(open("/tmp/report.json"))["openRows"])')" = "174"
          test "$(python3 -c 'import json; print(json.load(open("/tmp/report.json"))["problems"])')" = "0"
          python3 scripts/check_auditrepo_structure.py
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          git diff --name-only HEAD > "${changed_file}"
          AUDITREPO_CHANGED_PATHS_FILE="${changed_file}" python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          git diff --check
      - name: Commit permanent files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-02_aed8ed22_vosk-dead-split-closure.md
          git commit -m "audit(gb): close dead Vosk split finding"
          git push origin HEAD:verifier/close-vosk-dead-split-20260802
