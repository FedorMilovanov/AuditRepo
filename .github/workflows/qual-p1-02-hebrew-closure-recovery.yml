name: Recover QUAL-P1-02 AuditRepo closure

on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  recover:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'verify/qual-p1-02-hebrew-closure-20260804'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout canonical verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/qual-p1-02-hebrew-closure-20260804
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable AuditRepo base
        shell: bash
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9211b3edd7ca486c1a7457abc24ccdbf99c18d84"
          git merge-base --is-ancestor origin/main HEAD

      - name: Reapply bounded transaction and complete summaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          workflow = Path('.github/workflows/qual-p1-02-hebrew-closure.yml').read_text(encoding='utf-8')
          match = re.search(r"          python3 - <<'PY'\n(.*?)\n          PY\n", workflow, re.DOTALL)
          if not match:
              raise SystemExit('canonical closure patch body not found')
          script = textwrap.dedent(match.group(1))
          exec(compile(script, '<canonical-closure-patch>', 'exec'), {})

          matrix_path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          matrix = matrix_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one marker, found {count}')
              return text.replace(old, new, 1)

          matrix = replace_once(matrix, '| Закрыто (fixed) | 206 |', '| Закрыто (fixed) | 207 |', 'fixed summary')
          matrix = replace_once(matrix, '| P1 открыто | 72 |', '| P1 открыто | 71 |', 'P1 summary')
          matrix = replace_once(
              matrix,
              '| **Всего открыто (матрица)** | **152** |',
              '| **Всего открыто (матрица)** | **151** |',
              'total-open summary',
          )
          matrix_path.write_text(matrix, encoding='utf-8')
          PY

      - name: Validate bounded transaction
        shell: bash
        run: |
          git diff --check
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          printf '%s\n' \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_qual-p1-02-hebrew-semantics.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            > "${changed_file}"
          export AUDITREPO_CHANGED_PATHS_FILE="${changed_file}"
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py \
            --verbose \
            --json-out reports/matrix-coverage/report.json
          python3 scripts/matrix_coverage_contexts.py \
            --json-out reports/matrix-coverage/contexts.json \
            --markdown-out reports/matrix-coverage/contexts.md

      - name: Commit canonical closure and remove temporary automation
        shell: bash
        run: |
          rm .github/workflows/qual-p1-02-hebrew-closure.yml
          rm .github/workflows/qual-p1-02-hebrew-closure-recovery.yml
          rm -rf reports/matrix-coverage
          git diff --check
          git status --short
          git add \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_qual-p1-02-hebrew-semantics.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            .github/workflows/qual-p1-02-hebrew-closure.yml \
            .github/workflows/qual-p1-02-hebrew-closure-recovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit(gb): close QUAL-P1-02 Hebrew semantics"
          git push origin HEAD:verify/qual-p1-02-hebrew-closure-20260804
