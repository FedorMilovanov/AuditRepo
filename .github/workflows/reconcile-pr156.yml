name: Reconcile AuditRepo PR 156

on:
  push:
    branches:
      - ci/run-reconcile-pr156

permissions:
  contents: write

concurrency:
  group: reconcile-auditrepo-pr156
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'FedorMilovanov/AuditRepo'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact search-audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: arena/019fccbd-auditrepo

      - name: Guard transaction and merge current main
        shell: bash
        run: |
          set -euo pipefail
          expected_search_head=aba0b1f43201875654d9f39b3cae0fe87e281acc
          test "$(git rev-parse HEAD)" = "$expected_search_head"
          git fetch origin main --prune

          matrix=projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md
          handoff=projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md
          git show HEAD:"$matrix" > /tmp/search-matrix.md
          git show HEAD:"$handoff" > /tmp/search-handoff.md
          git show origin/main:"$matrix" > /tmp/main-matrix.md
          git show origin/main:"$handoff" > /tmp/main-handoff.md

          git merge --no-commit --no-ff origin/main || true
          mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
          expected=("$handoff" "$matrix")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#conflicts[@]}" -eq 2
          test "$(printf '%s\n' "${conflicts[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Reconcile canonical single-writer files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          matrix_path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          handoff_path = Path('projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md')
          main_matrix = Path('/tmp/main-matrix.md').read_text(encoding='utf-8')
          search_matrix = Path('/tmp/search-matrix.md').read_text(encoding='utf-8')
          main_handoff = Path('/tmp/main-handoff.md').read_text(encoding='utf-8')

          p1_ids = ['SEARCH-P1-01', 'SEARCH-P1-03', 'SEARCH-P1-04']
          p2_ids = ['SEARCH-P2-07', 'SEARCH-P2-08', 'SEARCH-P2-09', 'SEARCH-P2-10', 'SEARCH-P2-11', 'SEARCH-P2-12']
          p3_ids = ['SEARCH-P3-01', 'SEARCH-P3-02', 'SEARCH-P3-03']
          all_ids = p1_ids + p2_ids + p3_ids
          search_lines = search_matrix.splitlines()

          def one_row(fid: str) -> str:
              prefix = f'| {fid} |'
              rows = [line for line in search_lines if line.startswith(prefix)]
              if len(rows) != 1:
                  raise SystemExit(f'{fid}: expected one source row, got {len(rows)}')
              return rows[0]

          rows = {fid: one_row(fid) for fid in all_ids}
          text = main_matrix
          for fid in all_ids:
              if re.search(rf'^\| {re.escape(fid)} \|', text, re.M):
                  raise SystemExit(f'{fid}: already exists in current main')

          text, n = re.subn(
              r'^\| Last reverify \|.*$',
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_search-untested-reduction.md` (latest search reduction; refined Nagornaya browser authority remains `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-browser.md`). |',
              text,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit('Last reverify row drift')

          def replace_once(old: str, new: str) -> None:
              nonlocal_text[0] = nonlocal_text[0].replace(old, new, 1) if old in nonlocal_text[0] else (_ for _ in ()).throw(SystemExit(f'missing exact anchor: {old}'))

          nonlocal_text = [text]
          replace_once('## 🟠 P1 — ОТКРЫТО (69)', '## 🟠 P1 — ОТКРЫТО (72)')
          text = nonlocal_text[0]
          p1_anchor = '## 🟠 P1 — ОТКРЫТО (72)\n\n| ID | Описание | Witnesses |\n|---|---|---|\n'
          if p1_anchor not in text:
              raise SystemExit('P1 table anchor drift')
          text = text.replace(p1_anchor, p1_anchor + '\n'.join(rows[x] for x in p1_ids) + '\n', 1)

          if '## 🟡 P2 — ОТКРЫТО (26)' not in text:
              raise SystemExit('P2 heading drift')
          text = text.replace('## 🟡 P2 — ОТКРЫТО (26)', '## 🟡 P2 — ОТКРЫТО (32)', 1)
          p2_anchor = '## 🟡 P2 — ОТКРЫТО (32)\n\n| ID | Описание | Witnesses |\n|---|---|---|\n'
          if p2_anchor not in text:
              raise SystemExit('P2 table anchor drift')
          text = text.replace(p2_anchor, p2_anchor + '\n'.join(rows[x] for x in p2_ids) + '\n', 1)

          p3_old = '## 🟢 P3 — ОТКРЫТО (37)'
          p3_new = '## 🟢 P3 — ОТКРЫТО (40)'
          if p3_old not in text:
              raise SystemExit('P3 heading drift')
          text = text.replace(p3_old + '\n', p3_new + '\n' + '\n'.join(rows[x] for x in p3_ids) + '\n', 1)

          text, n = re.subn(
              r'^## Статистика \(обновлено 2026-08-04: disposition anchor `f9d01207`; last exact production `abf1edba`; 358 canonical = 219 closed \+ 139 open\)$',
              '## Статистика (обновлено 2026-08-04: disposition anchor `f9d01207`; last exact production `abf1edba`; 370 canonical = 219 closed + 151 open)',
              text,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit('statistics heading drift')
          for old, new in {
              '| P1 открыто | 69 |': '| P1 открыто | 72 |',
              '| P2 открыто | 26 |': '| P2 открыто | 32 |',
              '| P3 открыто | 37 |': '| P3 открыто | 40 |',
              '| **Всего открыто (матрица)** | **139** |': '| **Всего открыто (матрица)** | **151** |',
          }.items():
              if old not in text:
                  raise SystemExit(f'statistic row drift: {old}')
              text = text.replace(old, new, 1)

          marker = '### 2026-08-04 — search / Scripture audit intake promoted to matrix'
          pos = search_matrix.find(marker)
          if pos < 0:
              raise SystemExit('search session log marker missing')
          if marker in text:
              raise SystemExit('search session log already in current main')
          session = search_matrix[pos:].strip()
          corrections = {
              'P1 `70 → 73`, P2 `29 → 31`, total open `145 → 150`, closed unchanged `213`': 'P1 `69 → 72`, P2 `26 → 28`, total open `139 → 144`, closed unchanged `219`',
              'P2 `31 → 33`, total open `150 → 152`, closed unchanged `213`': 'P2 `28 → 30`, total open `144 → 146`, closed unchanged `219`',
              'P2 `33 → 35`, total open `152 → 154`, closed unchanged `213`': 'P2 `30 → 32`, total open `146 → 148`, closed unchanged `219`',
              'P3 `39 → 42`, total open `154 → 157`, closed unchanged `213`': 'P3 `37 → 40`, total open `148 → 151`, closed unchanged `219`',
          }
          for old, new in corrections.items():
              if old not in session:
                  raise SystemExit(f'session arithmetic drift: {old}')
              session = session.replace(old, new, 1)
          text = text.rstrip() + '\n\n' + session + '\n'

          for fid in all_ids:
              count = len(re.findall(rf'^\| {re.escape(fid)} \|', text, re.M))
              if count != 1:
                  raise SystemExit(f'{fid}: merged row multiplicity {count}')
          required = [
              '## ✅ ЗАКРЫТО (219)',
              '## 🟠 P1 — ОТКРЫТО (72)',
              '## 🟡 P2 — ОТКРЫТО (32)',
              '## 🟢 P3 — ОТКРЫТО (40)',
              '370 canonical = 219 closed + 151 open',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'merged matrix missing: {token}')
          matrix_path.write_text(text, encoding='utf-8')

          h = main_handoff
          h, n = re.subn(
              r'^\*\*Current reverify:\*\*.*$',
              '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_search-untested-reduction.md` (latest search reduction; matrix movement: `...search-polish-discovery.md`; refined Nagornaya authority: `...nagornaya-dark-browser.md`).',
              h,
              count=1,
              flags=re.M,
          )
          if n != 1:
              raise SystemExit('handoff reverify drift')
          h, n = re.subn(r'^\*\*Canonical matrix:\*\*.*$', '**Canonical matrix:** **370 IDs = 219 closed + 151 open**.', h, count=1, flags=re.M)
          if n != 1:
              raise SystemExit('handoff matrix-count drift')

          convergence_key = 'Source movement does **not** change canonical AuditRepo counts by itself.'
          idx = h.find(convergence_key)
          if idx < 0:
              raise SystemExit('handoff convergence paragraph missing')
          para_end = h.find('\n\n', idx)
          if para_end < 0:
              raise SystemExit('handoff convergence paragraph end missing')
          paragraph = h[idx:para_end]
          paragraph += ' This reconciliation adds twelve verified current-source search/Scripture rows without Product mutation, same-SHA production claim or browser-pixel claim.'
          h = h[:idx] + paragraph + h[para_end:]

          active_start = h.index('## Active canonical owner lanes')
          counts_start = h.index('## Current counts', active_start)
          active = '''## Active canonical owner lanes

### Product repository

- Product PR #885 (`fix/nagornaya-dark-refined-repair-20260804`) is the bounded non-TTS `NG-DARK-01` repair owner for the refined **9 tokens / 142 uses** Chromium boundary. It remains draft until exact-head checks, final diff and review-thread gates pass.
- Product PRs #875/#876 are disjoint TTS audit/repair lanes and must not be modified or absorbed by search/Nagornaya work.
- Product `main@f9d0120718569c510833dba7a3abd68ce2f6a003` remains source authority; no same-SHA production claim exists for it.

### AuditRepo

- PR #148 is the disjoint TTS evidence lane and remains untouched.
- PR #156 (`arena/019fccbd-auditrepo`) promotes twelve search/Scripture findings plus evidence, reverifies and bounded repair plans while preserving all six current-main closure dispositions.

'''
          h = h[:active_start] + active + h[counts_start:]

          counts_start = h.index('## Current counts')
          next_header = h.index('## Wave A closure this handoff', counts_start)
          counts = '''## Current counts

- P0: 0
- P1: 72
- P2: 32
- P3: 40
- Refactoring: 4
- AuditRepo: 3
- Total open: 151
- Closed: 219

'''
          h = h[:counts_start] + counts + h[next_header:]

          next_start = h.index('## Next meaningful work')
          next_text = '''## Next meaningful work

1. Merge AuditRepo PR #156 only after exact-head validator, matrix coverage, repository-history forensic, final-diff and review-thread gates pass.
2. Then finish Product PR #885 against only the refined `NG-DARK-01` boundary (**9 tokens / 142 uses**), run exact-head browser/build/static gates, merge safely, and close it in a separate AuditRepo transaction.
3. After the Nagornaya closure, start the bounded search repair sequence with `SEARCH-P1-03`/`SEARCH-P1-04`: truthful Scripture-tab semantics plus a generated `BibleRef → pages/anchors/context/topics` site-occurrence index. Use `working/SEARCH_SCRIPTURE_REPAIR_PLAN_2026-08-04.md` and `working/SEARCH_SCRIPTURE_INDEX_CONTRACT_SPEC_2026-08-04.md`.
4. Preserve `SEARCH-SCRIPTURE-BROKEN` as historically closed; the new rows own higher-standard exact-reference/site-occurrence/corpus defects.
5. `SEARCH-P1-01`, `SEARCH-P2-09`–`12`, `QUAL-P1-06`, narrowed `QUAL-P1-09`, and `MAP-P1-20` remain independent candidates; perform collision pre-flight before mutation.
6. Preserve Single-Writer-Per-Fact and make no production claim without same-SHA live evidence. TTS lanes remain excluded.
'''
          h = h[:next_start] + next_text
          handoff_path.write_text(h, encoding='utf-8')
          PY

      - name: Validate exact merged tree
        shell: bash
        run: |
          set -euo pipefail
          matrix=projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md
          handoff=projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md
          git add "$matrix" "$handoff"
          git rm .github/workflows/reconcile-pr156.yml
          git status --short
          git diff --cached --check
          python3 scripts/validate_audit_repo.py
          python3 scripts/check_matrix_coverage.py
          node scripts/repository_history_forensic_audit.mjs

      - name: Commit and push reconciled PR head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "audit(search): reconcile promotion with canonical main"
          git push origin HEAD:arena/019fccbd-auditrepo
