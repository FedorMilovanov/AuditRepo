name: Reconcile c8b source boundary once

on:
  push:
    branches:
      - audit/source-boundary-c8b47201-2026-07-24
    paths:
      - .github/workflows/reconcile-source-boundary-c8b.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/source-boundary-c8b47201-2026-07-24
          fetch-depth: 0

      - name: Guarded matrix update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '| Source HEAD | `20ded750327f79e46efa4e50d4d7cd7171e7d9a1` (current source main; glossary #183, source-aware coverage #186, Bible resolver #185 and fail-closed asset policy #187) |':
              '| Source HEAD | `c8b47201f5b7210d69809c38808bfbda15695dcd` (current source main; homepage #190/#193/#195/#196, Safari #197/#199, Gill #192, Reader R6 #191 and Android/WebKit gate #200) |',
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-07-24_20ded750_cache-bust-fail-closed.md` |':
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-07-24_c8b47201_home-reader-gill-webkit.md` |',
              '⚠️ Старые deploy-формулировки ниже исторические. Current source authority: `20ded750`; last exact production authority: `8a535267`; source/CI evidence: `reverify/CURRENT_HEAD_REVERIFY_2026-07-24_20ded750_cache-bust-fail-closed.md`.':
              '⚠️ Старые deploy-формулировки ниже исторические. Current source authority: `c8b47201`; last exact production authority: `8a535267`; source/CI evidence: `reverify/CURRENT_HEAD_REVERIFY_2026-07-24_c8b47201_home-reader-gill-webkit.md`.'
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'guard failed: expected exactly one occurrence, found {count}: {old[:100]}')
              text = text.replace(old, new, 1)

          marker = '### 2026-07-24 — homepage, Gill, Reader R6 and WebKit source closure (`c8b47201`)'
          if marker in text:
              raise SystemExit('guard failed: session marker already exists')

          session = '''

### 2026-07-24 — homepage, Gill, Reader R6 and WebKit source closure (`c8b47201`)

- Source `main` advanced through homepage PRs #190/#193/#195/#196, Safari fixes #197/#199, final Gill reconciliation #192, ReaderState R6 #191 and permanent cross-browser gate #200.
- Lost-work recheck confirmed the former local `a532042` package is represented by merged #190; current homepage retains no-JS navigation, breakpoint/BFCache cleanup, footer semantics and fail-closed reveal capture.
- Reader R6 exact head passed Shared, Gill, Overlay, Glossary, Native, Route Registry/engine sweep and Visual Parity; no temporary files or review threads remained.
- Clean PR #200 changed only the route-registry workflow and the cross-browser audit script. Android Chromium recorded 1828/1828 PASS; WebKit iPhone 320/390 and desktop recorded 2660/2660 PASS over all 75 routes.
- Post-merge workflow inspection proved `main@c8b47201` contains both Reader R6 `engine:sweep` and the new cross-browser jobs; the merge race did not lose either contract.
- Duplicate/superseded PRs #194 and #201 were closed unmerged. Source repository had no open PRs at the snapshot.
- Production authority intentionally remains `8a535267` until exact current readiness, Pages and live marker/hash evidence are obtained. Canonical counters were not changed in this authority-only reconciliation.
'''
          path.write_text(text.rstrip() + session + '\n', encoding='utf-8')
          PY

      - name: Commit reconciled matrix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md
          git diff --cached --check
          git commit -m "audit: record c8b source closure boundary"
          git push origin HEAD:audit/source-boundary-c8b47201-2026-07-24
