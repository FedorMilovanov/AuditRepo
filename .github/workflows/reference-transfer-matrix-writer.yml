name: Reference Transfer Matrix Writer

on:
  push:
    branches:
      - agent/reference-transfer-governance-20260806
    paths:
      - .github/workflows/reference-transfer-matrix-writer.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/reference-transfer-matrix-writer.yml

permissions:
  contents: write

jobs:
  write-canonical-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-transfer-governance-20260806
          fetch-depth: 0

      - name: Apply exact canonical transaction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md')
          text = path.read_text(encoding='utf-8')

          required_absent = [
              'REFERENCE-TRANSFER-GOVERNANCE',
              'HOME-P3-FOOTER-EDGE-CONSOLE',
              '| R-005 |',
              '| R-006 |',
              '| R-007 |',
          ]
          for marker in required_absent:
              if marker in text:
                  raise SystemExit(f'already present: {marker}')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence of {old!r}, got {count}')
              text = text.replace(old, new, 1)

          def sub_once(pattern, replacement):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'expected one regex match for {pattern!r}, got {count}')

          sub_once(
              r'^\| Source verification anchor \|.*$',
              '| Source verification anchor | `3d907194d81eee1227a4fc9ad6f037773d19a1ec` (current Product source; reference-transfer governance PR #1076 exact tested head `c4cb9c3ce08d7b331c5c6275e91e6e11c944c7ba` established explicit exact/adaptive/native/legacy/performance/inventory modes, a 6/8 blocking-contract budget, advisory defaults and no automatic HTML-token harvesting; Favorite Store source **65/65** + Chromium **138/138** passed; production authority remains `38b257030afb7cfa8a7b1128f8c86539fd36dec0`). |'
          )
          sub_once(
              r'^\| Last reverify \|.*$',
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-06_3d907194_reference-transfer-governance.md` (Product PR #1076 / merge `3d907194`; bounded reference-transfer governance, D-22 current image-origin repair, three measured non-blocking unload lanes and repeated out-of-lane Home footer P3 evidence; no new production claim). |'
          )

          replace_once('## ✅ ЗАКРЫТО (230)', '## ✅ ЗАКРЫТО (231)')
          closed_header = '## ✅ ЗАКРЫТО (231)\n\n| ID | Описание | Коммит |\n|---|---|---|\n'
          closed_row = (
              '| REFERENCE-TRANSFER-GOVERNANCE | ✅ **FIXED-CURRENT / MERGED-SYSTEM+SOURCE+CHROMIUM+WEBKIT+CI VERIFIED 2026-08-06.** Product PR #1076 converts the useful Agent Arena reference research into one proportional system instead of a mega-gate: explicit `exact-replica`, `adaptive-approved`, `native-contract`, `legacy-preserve`, `performance-target` and `inventory` modes; immutable snapshot + SHA-256 + named owners + bounded structure/order + desktop/mobile review for any real 1:1 claim; current registry **10 = 6 blocking + 4 non-blocking** with hard maximum **8** blocking contracts, **3** delegated guards and **12** required/forbidden markers per file; new contracts start advisory, automatic HTML token harvesting is disabled, performance/inventory cannot block, and existing route/browser/visual owners are reused through `owner:ui-guard` without a new workflow. Exact head `c4cb9c3` passed Shared Files, Favorite Store, Visual Parity, Metadata, Deploy Candidate, Glossary and dedicated Home Chromium/WebKit witnesses before squash merge `3d907194`; no production claim. | `3d907194` PR#1076; exact head `c4cb9c3` |\n'
          replace_once(closed_header, closed_header + closed_row)

          sub_once(
              r'^\| D-22 \|.*$',
              '| D-22 | ✅ **FIXED-CURRENT / MERGED-SOURCE+CHROMIUM+CI VERIFIED 2026-08-06.** Historical favorite-link scheme/XSS half remained fixed. Agent Arena correctly found the narrower current image-origin residual after #1061: canonical `normalizeImage()` accepted cross-origin HTTP(S)/protocol-relative values because it checked protocol but not origin. Product PR #1076 now requires `url.origin === location.origin`, preserving valid same-origin absolute/root-relative images and rejecting cross-origin HTTP(S), protocol-relative, `data:`, `javascript:` and malformed values. Exact head `c4cb9c3` passed Favorite Store source **65/65** and Chromium **138/138**; artifact `8951868661`, digest `sha256:ab2c22aed02bef0da1d622102634d421ab60af0d9aa2d1d71ab8ca3da3036949`; squash merge `3d907194`. No production/live claim. | `365de50` origin; `3d907194` PR#1076 |'
          )

          replace_once('## 🟢 P3 — ОТКРЫТО (39)', '## 🟢 P3 — ОТКРЫТО (40)')
          p3_heading = '## 🟢 P3 — ОТКРЫТО (40)\n'
          p3_row = (
              '| HOME-P3-FOOTER-EDGE-CONSOLE | ⚠️ **CONFIRMED-CURRENT / BROWSER-EVIDENCE 2026-08-06.** Runtime Interactive Audit run `31060246529` reproduced twice on exact Product head `c4cb9c3` the separate Home Design console contract message `[home-footer-contract] footer touches a viewport edge`. The broad interactive audit passed 43 pages and all covered interaction families before this step; the dedicated Home Chromium/WebKit production-like job on the same SHA passed; PR #1076 changed no footer, shared layout or CSS. Open a bounded Home visual lane to inspect exact geometry/screenshots. Do not claim visible clipping without that evidence, weaken the contract, or mix the repair into unrelated SYSTEM work. | exact-head runtime attempts 2+3; reverify `3d907194_reference-transfer-governance` |\n'
          replace_once(p3_heading, p3_heading + p3_row)

          replace_once('## 🔵 P3 — РЕФАКТОРИНГ (4)', '## 🔵 P3 — РЕФАКТОРИНГ (7)')
          r004 = '| R-004 | Нет type="module"/tree-shaking |\n'
          r_new = (
              '| R-005 | **Baptists 3D measured split.** Measure before/after and preserve strict-native-app behavior; target `_app/index.html < 50 KiB` raw plus external hashed JS/CSS only in a bounded implementation lane. Until behavioral and bundle evidence exists, this remains a non-blocking `performance-target`, not a global size gate. |\n'
              '| R-006 | **Route-scoped governed TTS loading.** Prove long-form route ownership and before/after bundles, then keep catalogs/unrelated landings from paying the TTS runtime cost. No blocking bundle threshold before the implementation and browser evidence exist. |\n'
              '| R-007 | **Recursive strangler duplicate inventory and bounded retirement.** Count legacy `index.html` vs native owners recursively, classify true duplicates vs intentional independent/`legacy-preserve` surfaces, then remove only proven bounded duplicates. Inventory counts never block unrelated Product work. |\n'
          )
          replace_once(r004, r004 + r_new)

          notes_anchor = '## Примечания\n\n'
          session = (
              '### 2026-08-06 — Reference-transfer governance and D-22 repair @ Product `3d907194`\n'
              '- Closed `REFERENCE-TRANSFER-GOVERNANCE` as one proportional system: explicit transfer modes, real 1:1 snapshot/digest evidence, 6/8 current blocking budget, advisory defaults, no automatic token harvesting and no duplicate workflow.\n'
              '- Updated historical `D-22` with the current same-origin image repair and exact source **65/65** + Chromium **138/138** evidence.\n'
              '- Added non-blocking measured unload lanes `R-005` (Baptists 3D split), `R-006` (route-scoped TTS) and `R-007` (recursive duplicate inventory/retirement).\n'
              '- Added `HOME-P3-FOOTER-EDGE-CONSOLE` after two exact-head browser reproductions; kept it out of the unrelated SYSTEM repair.\n'
              '- Canonical arithmetic: **376 = 231 closed + 145 open**; open P0 `0`, P1 `69`, P2 `26`, P3 `40`, refactoring `7`, AuditRepo `3`. Production authority unchanged.\n\n'
          )
          replace_once(notes_anchor, notes_anchor + session)

          sub_once(
              r'^## Статистика \(обновлено .*$' ,
              '## Статистика (обновлено 2026-08-06: source anchor `3d907194`; production anchor `38b25703`; exact production run `30960174778`; 376 canonical = 231 closed + 145 open)'
          )
          replace_once('| Закрыто (fixed) | 230 |', '| Закрыто (fixed) | 231 |')
          replace_once('| P3 открыто | 39 |', '| P3 открыто | 40 |')
          replace_once('| Рефакторинг | 4 |', '| Рефакторинг | 7 |')
          replace_once('| **Всего открыто (матрица)** | **141** |', '| **Всего открыто (матрица)** | **145** |')

          for marker in [
              '## ✅ ЗАКРЫТО (231)',
              '## 🟢 P3 — ОТКРЫТО (40)',
              '## 🔵 P3 — РЕФАКТОРИНГ (7)',
              '376 canonical = 231 closed + 145 open',
              '| REFERENCE-TRANSFER-GOVERNANCE |',
              '| HOME-P3-FOOTER-EDGE-CONSOLE |',
              '| R-005 |', '| R-006 |', '| R-007 |',
              'url.origin === location.origin',
          ]:
              if marker not in text:
                  raise SystemExit(f'postcondition missing: {marker}')

          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/reference-transfer-matrix-writer.yml
          python3 scripts/validate_audit_repo.py
          python3 scripts/check_auditrepo_structure.py
          git diff --check

      - name: Commit canonical result and self-delete writer
        shell: bash
        run: |
          git config user.name "arena-agent"
          git config user.email "297053741+arena-agent@users.noreply.github.com"
          git add projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md .github/workflows/reference-transfer-matrix-writer.yml
          git commit -m "audit(gb): canonicalize reference governance and unload lanes"
          git push origin HEAD:agent/reference-transfer-governance-20260806
