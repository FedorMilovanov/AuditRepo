name: Run Avraam transaction from PR

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: run-avraam-transaction-pr-132
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.pull_request.number == 132
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout canonical verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/avraam-a11y-02-03-clean-20260803
          fetch-depth: 0
          persist-credentials: true

      - name: Extract and execute bounded transaction
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/complete-avraam-transaction.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          blocks = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.strip() != 'run: |':
                  i += 1
                  continue
              run_indent = len(line) - len(line.lstrip())
              content_indent = run_indent + 2
              i += 1
              block = []
              while i < len(lines):
                  current = lines[i]
                  if current.strip() and len(current) - len(current.lstrip()) <= run_indent:
                      break
                  if current.strip():
                      block.append(current[content_indent:])
                  else:
                      block.append('')
                  i += 1
              blocks.append('\n'.join(block).rstrip())

          if len(blocks) != 4:
              raise SystemExit(f'expected 4 run blocks, found {len(blocks)}')

          script = '\n\n'.join(blocks) + '\n'
          trailing_fixes = (
              ('`af4311d76b617d61eb5061fc4663df28d8f69add`  \'', '`af4311d76b617d61eb5061fc4663df28d8f69add`\''),
              ('`778a218d9e6dc4c051721fc0f0fe56ee9125c797`  \'', '`778a218d9e6dc4c051721fc0f0fe56ee9125c797`\''),
              ('`0fbe7d1ead9ebd1bea867418e254da438ec63329`  \'', '`0fbe7d1ead9ebd1bea867418e254da438ec63329`\''),
              ('`0fbe7d1e`.  \'', '`0fbe7d1e`.\''),
              ('CURRENT_HEAD_REVERIFY_2026-08-03_778a218d_avraam-skip-contrast.md`  \'', 'CURRENT_HEAD_REVERIFY_2026-08-03_778a218d_avraam-skip-contrast.md`\''),
          )
          for old, new in trailing_fixes:
              if script.count(old) != 1:
                  raise SystemExit(f'trailing-space patch marker drifted: {old}')
              script = script.replace(old, new, 1)

          script = script.replace(
              'rm .github/workflows/complete-avraam-transaction.yml',
              'rm .github/workflows/complete-avraam-transaction.yml .github/workflows/run-avraam-transaction-from-pr.yml',
              1,
          )
          script = script.replace(
              '  .github/workflows/complete-avraam-transaction.yml\n',
              '  .github/workflows/complete-avraam-transaction.yml \\\n  .github/workflows/run-avraam-transaction-from-pr.yml\n',
              1,
          )
          runner = Path('/tmp/run-avraam-transaction.sh')
          runner.write_text('#!/usr/bin/env bash\nset -euo pipefail\n' + script, encoding='utf-8')
          runner.chmod(0o700)
          PY
          /tmp/run-avraam-transaction.sh
