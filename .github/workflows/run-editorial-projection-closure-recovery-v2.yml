name: Recover editorial projection closure v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: recover-editorial-projection-v2-pr-136
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.pull_request.number == 136
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/editorial-projection-51-closure-20260804
          fetch-depth: 0
          persist-credentials: true

      - name: Execute bounded transaction with section-safe handoff update
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/complete-editorial-projection-closure.yml').read_text(encoding='utf-8')
          lines = source.splitlines()
          blocks = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.strip() != 'run: |':
                  i += 1
                  continue
              run_indent = len(line) - len(line.lstrip())
              content_indent = run_indent + 2
              i += 1
              block = []
              while i < len(lines):
                  current = lines[i]
                  if current.strip() and len(current) - len(current.lstrip()) <= run_indent:
                      break
                  block.append(current[content_indent:] if current.strip() else '')
                  i += 1
              blocks.append('\n'.join(block).rstrip())

          if len(blocks) != 4:
              raise SystemExit(f'expected 4 run blocks, found {len(blocks)}')

          script = '\n\n'.join(blocks) + '\n'
          fragile = """if nxt.count(old_next) != 1:
              raise SystemExit('NEXT next-work block drifted')
          nxt = nxt.replace(old_next, new_next, 1)"""
          robust = """if nxt.count(old_next) == 1:
              nxt = nxt.replace(old_next, new_next, 1)
          else:
              section = '## Next meaningful work\\n'
              if nxt.count(section) != 1:
                  raise SystemExit('NEXT next-work section drifted')
              start = nxt.index(section)
              nxt = nxt[:start] + new_next"""
          if script.count(fragile) != 1:
              raise SystemExit('fragile handoff code marker drifted')
          script = script.replace(fragile, robust, 1)

          script = script.replace(
              'rm .github/workflows/complete-editorial-projection-closure.yml',
              'rm .github/workflows/complete-editorial-projection-closure.yml .github/workflows/run-editorial-projection-closure-recovery.yml .github/workflows/run-editorial-projection-closure-recovery-v2.yml',
              1,
          )
          script = script.replace(
              '            .github/workflows/complete-editorial-projection-closure.yml\n',
              '            .github/workflows/complete-editorial-projection-closure.yml \\\n            .github/workflows/run-editorial-projection-closure-recovery.yml \\\n            .github/workflows/run-editorial-projection-closure-recovery-v2.yml\n',
              1,
          )

          runner = Path('/tmp/recover-editorial-projection-closure-v2.sh')
          runner.write_text('#!/usr/bin/env bash\nset -euo pipefail\n' + script, encoding='utf-8')
          runner.chmod(0o700)
          PY
          /tmp/recover-editorial-projection-closure-v2.sh
