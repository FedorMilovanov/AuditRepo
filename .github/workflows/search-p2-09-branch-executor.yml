# registered-trigger: v2
name: Search P2-09 Branch Executor

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: search-p2-09-branch-executor
  cancel-in-progress: false

jobs:
  execute:
    if: github.event.head_commit.message == 'ci(audit): execute exact SEARCH-P2-09 branch transformation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact executor branch
        uses: actions/checkout@v4
        with:
          ref: audit/search-p2-09-clean-executor-20260805
          fetch-depth: 0

      - name: Assert exact branch head and event-time main
        run: |
          test "$(git rev-parse HEAD)" = "ade44a45ff2f0de7c7e9647b5dc8ec38213c3b91"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply exact reconciliation and current AuditRepo base
        run: |
          node scripts/reconcile-search-p2-09.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const files = [
            'projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md',
            'projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-05_b3768b45_searchaction-closure.md',
          ];
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8');
            const from = 'cc180c5632fa12b25c035ac5abd2bfb6097316a1';
            const to = '16bff7f11b0ca9ec3965d90a9033207d4a97cbb7';
            if (!source.includes(from)) throw new Error(`expected AuditRepo base missing in ${file}`);
            fs.writeFileSync(file, source.replaceAll(from, to));
          }
          NODE

      - name: Capture changed paths for validator ratchet
        run: |
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          git diff --name-only > "${changed_file}"
          cat "${changed_file}"
          echo "AUDITREPO_CHANGED_PATHS_FILE=${changed_file}" >> "${GITHUB_ENV}"

      - name: Validate reconciled repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py --verbose --json-out reports/matrix-coverage/report.json
          python3 scripts/matrix_coverage_contexts.py --json-out reports/matrix-coverage/contexts.json --markdown-out reports/matrix-coverage/contexts.md
          node scripts/repository_history_forensic_audit.mjs --strict

      - name: Remove helper and verify exact permanent diff
        run: |
          git rm scripts/reconcile-search-p2-09.mjs
          expected="$(cat <<'EOF'
projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md
projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-05_b3768b45_searchaction-closure.md
projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md
EOF
)"
          actual="$(git diff --name-only 16bff7f11b0ca9ec3965d90a9033207d4a97cbb7 --diff-filter=ACMR | sort)"
          deleted="$(git diff --name-only 16bff7f11b0ca9ec3965d90a9033207d4a97cbb7 --diff-filter=D | sort)"
          test "${actual}" = "${expected}"
          test -z "${deleted}"
          git diff --check

      - name: Commit and push exact permanent reconciliation
        run: |
          git config user.name "audit-search-reconciler"
          git config user.email "audit-search-reconciler@users.noreply.github.com"
          git add -A
          git commit -m "audit(search): close SEARCH-P2-09"
          git push origin "HEAD:audit/search-p2-09-clean-executor-20260805"
