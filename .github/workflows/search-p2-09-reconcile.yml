name: Search P2-09 Exact Reconciler

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: read

concurrency:
  group: search-p2-09-exact-reconciler
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.issue.pull_request &&
      github.event.issue.number == 170 &&
      github.event.comment.user.login == 'FedorMilovanov' &&
      github.event.comment.body == '/run-search-p2-09-reconcile'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: audit/search-p2-09-closure-20260805
          fetch-depth: 0

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Assert event-time main and expected branch head
        run: |
          test "$(git rev-parse HEAD)" = "90c44094fd7373b31daef6d6a829d92ebbdbdbaf"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"
          cp scripts/reconcile-search-p2-09.mjs "${RUNNER_TEMP}/reconcile-search-p2-09.mjs"

      - name: Remove abandoned branch control plane and synchronize exact main
        run: |
          git show "${GITHUB_SHA}:.github/workflows/auditrepo-validate.yml" > .github/workflows/auditrepo-validate.yml
          git rm .github/workflows/reconcile-search-p2-09.yml
          git rm scripts/reconcile-search-p2-09.mjs
          git config user.name "audit-search-reconciler"
          git config user.email "audit-search-reconciler@users.noreply.github.com"
          git add -A
          git commit -m "ci(audit): remove abandoned SEARCH-P2-09 branch control plane"
          git merge --no-ff --no-edit "${GITHUB_SHA}"

      - name: Apply exact SEARCH-P2-09 transformation
        run: node "${RUNNER_TEMP}/reconcile-search-p2-09.mjs"

      - name: Capture changed paths for validator ratchet
        run: |
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          git diff --name-only > "${changed_file}"
          cat "${changed_file}"
          echo "AUDITREPO_CHANGED_PATHS_FILE=${changed_file}" >> "${GITHUB_ENV}"

      - name: Validate exact reconciled tree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py --verbose --json-out reports/matrix-coverage/report.json
          python3 scripts/matrix_coverage_contexts.py --json-out reports/matrix-coverage/contexts.json --markdown-out reports/matrix-coverage/contexts.md
          node scripts/repository_history_forensic_audit.mjs --strict
          git diff --check

      - name: Verify exact permanent diff against event-time main
        run: |
          expected="$(cat <<'EOF'
projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md
projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-05_b3768b45_searchaction-closure.md
projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md
EOF
)"
          actual="$(git diff --name-only "${GITHUB_SHA}" --diff-filter=ACMR | sort)"
          deleted="$(git diff --name-only "${GITHUB_SHA}" --diff-filter=D | sort)"
          test "${actual}" = "${expected}"
          test -z "${deleted}"

      - name: Commit and push clean reconciliation branch
        run: |
          git add -A
          git commit -m "audit(search): close SEARCH-P2-09"
          git push origin "HEAD:audit/search-p2-09-closure-20260805"
