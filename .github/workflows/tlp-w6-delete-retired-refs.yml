name: TLP W6 delete retired AuditRepo refs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tlp-w6-delete-retired-refs.yml

permissions:
  contents: write

env:
  TEMPORARY_BRANCH: maintenance/tlp-w6-delete-retired-refs-20260805

jobs:
  delete-retired-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight, delete and verify exact TLP refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          repository = os.environ['GITHUB_REPOSITORY']
          if os.environ['GITHUB_REF_NAME'] != 'main':
              raise SystemExit(f'wrong execution branch: {os.environ["GITHUB_REF_NAME"]}')

          targets = [
              ('audit/tlp-w2-immutable-publication-closure-20260805', '640bfccaebf42835c9688df6a48cda7c6e6a7f2c'),
              ('audit/tlp-w3-hardening-w4-closure-20260805', None),
              ('audit/tlp-w4a-closure-20260805', None),
          ]
          names = [name for name, _ in targets]
          if len(names) != 3 or len(set(names)) != 3:
              raise SystemExit('AuditRepo deletion allowlist must contain exactly three unique refs')
          if any(not name.startswith('audit/tlp-') for name in names):
              raise SystemExit('non-TLP ref entered deletion allowlist')
          if {'main', os.environ['TEMPORARY_BRANCH']}.intersection(names):
              raise SystemExit('protected ref entered deletion allowlist')

          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'tlp-w6-retirement',
          }

          def api(method, ref):
              encoded = urllib.parse.quote(f'heads/{ref}', safe='')
              singular = 'ref' if method == 'GET' else 'refs'
              url = f'https://api.github.com/repos/{repository}/git/{singular}/{encoded}'
              request = urllib.request.Request(url, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as error:
                  return error.code, error.read().decode('utf-8', errors='replace')

          preflight = []
          for name, expected in targets:
              status, payload = api('GET', name)
              if status != 200:
                  raise SystemExit(f'preflight failed for {name}: HTTP {status} {payload}')
              actual = payload['object']['sha']
              if expected is not None and actual != expected:
                  raise SystemExit(f'head mismatch for {name}: expected {expected}, found {actual}')
              preflight.append({'branch': name, 'head': actual, 'expectedHead': expected})

          for item in preflight:
              status, payload = api('DELETE', item['branch'])
              if status != 204:
                  raise SystemExit(f'delete failed for {item["branch"]}: HTTP {status} {payload}')

          absent = []
          for item in preflight:
              status, payload = api('GET', item['branch'])
              if status != 404:
                  raise SystemExit(f'absence verification failed for {item["branch"]}: HTTP {status} {payload}')
              absent.append(item['branch'])

          evidence = {
              'repository': repository,
              'runId': os.environ['GITHUB_RUN_ID'],
              'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'mainCommitThatTriggeredDeletion': os.environ['GITHUB_SHA'],
              'preflight': preflight,
              'deletedCount': len(preflight),
              'absentCount': len(absent),
              'absentBranches': absent,
              'excludedScope': 'all non-TLP AuditRepo refs',
          }
          Path('tlp-w6-auditrepo-ref-deletion-evidence.json').write_text(
              json.dumps(evidence, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(evidence, indent=2))
          PY

      - name: Upload AuditRepo deletion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tlp-w6-auditrepo-ref-deletion-evidence
          path: tlp-w6-auditrepo-ref-deletion-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Ensure the temporary workflow source branch is absent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          branch = os.environ['TEMPORARY_BRANCH']
          encoded = urllib.parse.quote(f'heads/{branch}', safe='')
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {os.environ["GH_TOKEN"]}',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'tlp-w6-retirement',
          }
          get_url = f'https://api.github.com/repos/{repository}/git/ref/{encoded}'
          delete_url = f'https://api.github.com/repos/{repository}/git/refs/{encoded}'
          try:
              with urllib.request.urlopen(urllib.request.Request(get_url, headers=headers)) as response:
                  if response.status != 200:
                      raise SystemExit(f'temporary branch lookup returned {response.status}')
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print(f'temporary branch already absent: {branch}')
                  raise SystemExit(0)
              raise SystemExit(f'temporary branch lookup failed: HTTP {error.code} {error.read().decode()}')

          try:
              with urllib.request.urlopen(urllib.request.Request(delete_url, method='DELETE', headers=headers)) as response:
                  if response.status != 204:
                      raise SystemExit(f'temporary branch deletion returned {response.status}')
          except urllib.error.HTTPError as error:
              raise SystemExit(f'temporary branch deletion failed: HTTP {error.code} {error.read().decode()}')
          print(f'deleted temporary branch {branch}')
          PY
