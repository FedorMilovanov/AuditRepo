name: Temporary final gb exact-production closure

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tmp-final-gb-exact-production-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/gb-current-head-production-sync-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact audit head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for and reconcile exact Pixelmatch-main production
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          from typing import Any

          ROOT = Path.cwd()
          SOURCE_REPO = 'FedorMilovanov/gb-is-my-strength'
          SOURCE_PR = 551
          EXPECTED_SHA = 'a7b2f2b514a9745102ca88579bc0caad9a28754e'
          AUDIT_BASE = '3213e449b41041a71c59bf581c276bb0a26d0c67'
          AUDIT_PR = os.environ['AUDIT_PR_NUMBER']
          NEXT_PATH = ROOT / 'projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md'
          MATRIX_PATH = ROOT / 'projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md'
          OLD_REVERIFY = ROOT / 'projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-07-31_ca8c8130_exact-production-home-closure.md'
          REVERIFY_NAME = 'CURRENT_HEAD_REVERIFY_2026-07-31_a7b2f2b5_exact-production-home-closure.md'
          REVERIFY_PATH = ROOT / 'projects/gb-is-my-strength/reverify' / REVERIFY_NAME
          WORKFLOW_PATH = ROOT / '.github/workflows/tmp-final-gb-audit-polish.yml'
          COMMENTS_URL = f'https://api.github.com/repos/{SOURCE_REPO}/issues/{SOURCE_PR}/comments?per_page=100'
          MARKER = f'<!-- deployment-release-witness:{EXPECTED_SHA}:{EXPECTED_SHA}:'

          def get_json(url: str, retries: int = 4) -> Any:
              token = os.environ.get('GH_TOKEN', '').strip()
              headers = {
                  'Accept': 'application/vnd.github+json' if url.startswith('https://api.github.com/') else 'application/json',
                  'User-Agent': 'AuditRepo-final-exact-production/1.0',
                  'Cache-Control': 'no-cache',
                  'Pragma': 'no-cache',
              }
              if token and url.startswith('https://api.github.com/'):
                  headers['Authorization'] = f'Bearer {token}'
                  headers['X-GitHub-Api-Version'] = '2022-11-28'
              error = None
              for attempt in range(1, retries + 1):
                  target = url
                  if url.startswith('https://gospod-bog.ru/'):
                      sep = '&' if '?' in url else '?'
                      target = f'{url}{sep}audit={int(time.time())}-{attempt}'
                  try:
                      request = urllib.request.Request(target, headers=headers)
                      with urllib.request.urlopen(request, timeout=30) as response:
                          if response.status != 200:
                              raise RuntimeError(f'HTTP {response.status}')
                          return json.loads(response.read().decode('utf-8'))
                  except (urllib.error.URLError, TimeoutError, json.JSONDecodeError, RuntimeError) as exc:
                      error = exc
                      if attempt < retries:
                          time.sleep(attempt * 2)
              raise RuntimeError(f'GET {url} failed: {error}')

          def require(value: bool, message: str) -> None:
              if not value:
                  raise RuntimeError(message)

          def exact_source() -> None:
              branch = get_json(f'https://api.github.com/repos/{SOURCE_REPO}/branches/main')
              current = str(branch.get('commit', {}).get('sha', '')).lower()
              require(current == EXPECTED_SHA, f'source main moved: expected {EXPECTED_SHA}, found {current}')
              pull = get_json(f'https://api.github.com/repos/{SOURCE_REPO}/pulls/{SOURCE_PR}')
              require(bool(pull.get('merged')), 'Pixelmatch PR #551 is not merged')
              require(str(pull.get('merge_commit_sha', '')).lower() == EXPECTED_SHA, 'PR #551 is not the exact owner of current main')

          def parse_envelope(body: str) -> dict[str, Any]:
              match = re.search(r'```json\s*([\s\S]*?)\s*```', body)
              require(match is not None, 'machine JSON envelope missing')
              value = json.loads(match.group(1))
              require(isinstance(value, dict), 'machine envelope must be an object')
              return value

          def wait_for_envelope() -> tuple[dict[str, Any], int]:
              for poll in range(330):
                  for comment in get_json(COMMENTS_URL):
                      body = str(comment.get('body', ''))
                      if MARKER in body:
                          return parse_envelope(body), int(comment.get('id', 0))
                  if poll and poll % 15 == 0:
                      print(f'waiting for exact Pixelmatch-main ledger: {poll * 20}s', flush=True)
                  time.sleep(20)
              raise RuntimeError('timed out waiting for deployment-release-witness on PR #551')

          def verify_envelope(envelope: dict[str, Any]) -> dict[str, Any]:
              require(envelope.get('schemaVersion') == 3, 'witness schema mismatch')
              require(envelope.get('kind') == 'deployment-release-witness', 'witness kind mismatch')
              require(envelope.get('repository') == SOURCE_REPO, 'witness repository mismatch')
              require(str(envelope.get('releaseSha', '')).lower() == EXPECTED_SHA, 'release SHA mismatch')
              require(str(envelope.get('controlPlaneSha', '')).lower() == EXPECTED_SHA, 'control-plane SHA mismatch')
              deploy = envelope.get('deploy') or {}
              candidate = envelope.get('releaseCandidate') or {}
              live_artifact = envelope.get('liveWitnessArtifact') or {}
              tts = ((envelope.get('extensions') or {}).get('tts') or {})
              tts_artifact = tts.get('witnessArtifact') or {}
              run_id = int(deploy.get('runId', 0))
              attempt = int(deploy.get('runAttempt', 0))
              require(deploy.get('workflow') == 'Deploy to GitHub Pages', 'workflow mismatch')
              require(run_id > 0 and attempt > 0, 'run identity missing')
              candidate_id = str(candidate.get('candidateId', ''))
              digest = str(candidate.get('digest', ''))
              immutable_path = str(candidate.get('immutablePath', ''))
              require(candidate_id == f'{EXPECTED_SHA}:{run_id}-{attempt}', 'candidate ID mismatch')
              require(re.fullmatch(r'sha256:[a-f0-9]{64}', digest) is not None, 'candidate digest invalid')
              require(int(candidate.get('files', 0)) > 0 and int(candidate.get('bytes', 0)) > 0, 'candidate size/count missing')
              require(immutable_path == f'/deployments/{EXPECTED_SHA}/{run_id}-{attempt}.json', 'immutable path mismatch')
              for label, artifact in (
                  ('candidate', candidate.get('transportArtifact') or {}),
                  ('generic live', live_artifact),
                  ('TTS', tts_artifact),
              ):
                  require(int(artifact.get('id', 0)) > 0, f'{label} artifact ID missing')
                  require(re.fullmatch(r'sha256:[a-f0-9]{64}', str(artifact.get('digest', ''))) is not None, f'{label} digest invalid')
                  require(int(artifact.get('bytes', 0)) > 0, f'{label} bytes missing')
              require(tts.get('result') == 'PASS', 'TTS witness did not pass')
              return {
                  'deploy': deploy,
                  'candidate': candidate,
                  'live_artifact': live_artifact,
                  'tts_artifact': tts_artifact,
                  'run_id': run_id,
                  'attempt': attempt,
                  'candidate_id': candidate_id,
                  'digest': digest,
                  'immutable_path': immutable_path,
              }

          def verify_live(data: dict[str, Any]) -> tuple[dict[str, Any], dict[str, Any]]:
              current = get_json('https://gospod-bog.ru/deployments/current.json')
              require(current.get('schemaVersion') == 3, 'live pointer schema mismatch')
              require(current.get('repository') == SOURCE_REPO, 'live pointer repository mismatch')
              require(str(current.get('releaseSha', '')).lower() == EXPECTED_SHA, 'live release SHA mismatch')
              require(str(current.get('controlPlaneSha', '')).lower() == EXPECTED_SHA, 'live control-plane SHA mismatch')
              require(current.get('immutablePath') == data['immutable_path'], 'live immutable path mismatch')
              require((current.get('artifact') or {}).get('candidateId') == data['candidate_id'], 'live candidate ID mismatch')
              require((current.get('artifact') or {}).get('digest') == data['digest'], 'live candidate digest mismatch')
              workflow = current.get('workflow') or {}
              require(int(workflow.get('runId', 0)) == data['run_id'], 'live run ID mismatch')
              require(int(workflow.get('runAttempt', 0)) == data['attempt'], 'live run attempt mismatch')
              manifest = get_json(f"https://gospod-bog.ru{data['immutable_path']}")
              require(manifest.get('schemaVersion') == 4, 'manifest schema mismatch')
              require(str(manifest.get('releaseSha', '')).lower() == EXPECTED_SHA, 'manifest release SHA mismatch')
              require(str(manifest.get('controlPlaneSha', '')).lower() == EXPECTED_SHA, 'manifest control-plane SHA mismatch')
              require(manifest.get('immutablePath') == data['immutable_path'], 'manifest immutable path mismatch')
              artifact = manifest.get('artifact') or {}
              candidate = data['candidate']
              require(artifact.get('candidateId') == data['candidate_id'], 'manifest candidate ID mismatch')
              require(artifact.get('digest') == data['digest'], 'manifest digest mismatch')
              require(int(artifact.get('files', 0)) == int(candidate.get('files', 0)), 'manifest file count mismatch')
              require(int(artifact.get('bytes', 0)) == int(candidate.get('bytes', 0)), 'manifest byte count mismatch')
              build = manifest.get('build') or {}
              require(build.get('node') == '22.23.1', 'manifest Node version mismatch')
              require(build.get('npm') == '10.9.8', 'manifest npm version mismatch')
              require(bool(manifest.get('criticalAssets')), 'critical assets missing')
              require(bool(((manifest.get('extensions') or {}).get('tts') or {}).get('assets')), 'TTS assets missing')
              return current, manifest

          def replace_once(text: str, pattern: str, replacement: str, label: str, flags: int = 0) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              require(count == 1, f'{label}: expected one replacement, got {count}')
              return updated

          def build_next(data: dict[str, Any], comment_id: int) -> str:
              c = data['candidate']
              la = data['live_artifact']
              ta = data['tts_artifact']
              return f'''# NEXT AGENT PROMPT — gb-is-my-strength

          > **Current operational truth only.** Bug status and counters belong to `verified/MASTER_BUG_MATRIX.md`; this file owns the exact source/deploy boundary, active ownership and next execution order.

          **Source main:** `{EXPECTED_SHA}`
          **Exact production authority:** ✅ `{EXPECTED_SHA}`
          **Current source deployment status:** ✅ source, release candidate, Pages/live pointer and TTS authority converge on the same exact SHA.
          **Current source reverify:** `reverify/{REVERIFY_NAME}`
          **AuditRepo base used for this reconciliation:** `{AUDIT_BASE}`

          ## 1. Exact current boundary

          - source PR #{SOURCE_PR} merged as `{EXPECTED_SHA}`;
          - Pixelmatch is `7.2.0`, loaded through the controlled ESM path with `checkerboard: false`;
          - Node/npm remain pinned to `22.23.1` / `10.9.8` across active workflow and release surfaces;
          - deploy run `{data['run_id']}` attempt `{data['attempt']}` built one immutable candidate and promoted the same candidate bytes;
          - release and control-plane SHAs are both `{EXPECTED_SHA}`;
          - candidate ID: `{data['candidate_id']}`;
          - candidate tree digest: `{data['digest']}`;
          - candidate files / bytes: `{c['files']}` / `{c['bytes']}`;
          - immutable live provenance: `{data['immutable_path']}`;
          - candidate transport artifact: ID `{c['transportArtifact']['id']}`, `{c['transportArtifact']['digest']}`;
          - generic live witness artifact: ID `{la['id']}`, `{la['digest']}`;
          - TTS live witness artifact: ID `{ta['id']}`, `{ta['digest']}`;
          - source release-ledger comment: PR #{SOURCE_PR}, comment `{comment_id}`.

          ## 2. Homepage closure

          The premium native `/` implementation is complete in current ancestry. The accepted chain includes the premium index rebuild, responsive edge-state closure, semantic H1 dash, source-language/citation corrections, semantic drop-cap guard and the final two marginal-source corrections.

          PR #551 changed only the Pixelmatch dependency/lockfile, its functional migration contract, the controlled import path and migration documentation. It preserved every visual baseline and did not redesign or replace homepage components. Do not reopen MAIN INDEX without a new owner decision and current browser/visual evidence.

          ## 3. Production evidence boundary

          ```text
          source main
          = release SHA
          = control-plane SHA
          = live /deployments/current.json
          = immutable run manifest
          = generic live PASS
          = TTS live PASS
          ```

          A later source merge invalidates only the current-head convergence claim and requires a new reverify; it does not erase this immutable release witness.

          ## 4. Active ownership — do not collide

          The remaining protected independent source lane is Astro 7 phase one — PR #549. Do not reset, rebase, force-push, close, delete or absorb it without explicit owner handoff. This synchronization does not own Astro 7.

          ## 5. Cleanup disposition

          - no temporary Node/Pixelmatch migration writer, exporter, bootstrap or transfer file remains in source `main`;
          - no temporary AuditRepo workflow or writer remains in the final PR diff;
          - historical raw intakes and remote refs are not silently deleted; cleanup remains content- and disposition-based;
          - branch deletion is housekeeping, not evidence of source or production correctness.

          ## 6. Next order

          1. Preserve the exact production witness above as immutable evidence.
          2. Leave Astro 7 to its named owner and require fresh homepage parity after its future merge.
          3. On the next source-main merge, create a new current-head reverify before claiming source=production again.
          4. Do not change matrix counters for this synchronization: it reconciles existing closed status and current authority, not a new bug-class transition.
          '''.replace('\n          ', '\n').lstrip()

          def patch_matrix(data: dict[str, Any], comment_id: int) -> None:
              text = MATRIX_PATH.read_text(encoding='utf-8')
              c = data['candidate']
              la = data['live_artifact']
              ta = data['tts_artifact']
              source_row = (
                  f'| Source HEAD | `{EXPECTED_SHA}` (current source main; PR #{SOURCE_PR} migrated Pixelmatch to 7.2.0 through controlled ESM loading with checkerboard:false and no baseline rewrite; Node 22.23.1/npm 10.9.8 remain inherited; premium homepage closure remains in ancestry; Astro 7 remains separately owned) |'
              )
              deploy_row = (
                  f'| Deploy | ✅ **SOURCE = PRODUCTION AUTHORITY.** Exact run `{data["run_id"]}` attempt `{data["attempt"]}` built and promoted candidate `{data["candidate_id"]}` from `{EXPECTED_SHA}`; live pointer and immutable manifest match digest `{data["digest"]}`. Candidate artifact `{c["transportArtifact"]["id"]}` (`{c["transportArtifact"]["digest"]}`), generic live `{la["id"]}` (`{la["digest"]}`), TTS `{ta["id"]}` (`{ta["digest"]}`). Source ledger comment `{comment_id}`. |'
              )
              text = replace_once(text, r'^\| Source HEAD \|.*$', source_row, 'Source HEAD', re.MULTILINE)
              text = replace_once(text, r'^\| Deploy \|.*$', deploy_row, 'Deploy', re.MULTILINE)
              text = replace_once(text, r'^\| Last reverify \|.*$', f'| Last reverify | `reverify/{REVERIFY_NAME}` |', 'Last reverify', re.MULTILINE)
              note = (
                  f'⚠️ Deploy-формулировки в исторических строках ниже сохраняют состояние соответствующей даты. Текущие source и exact production authority совпадают на `{EXPECTED_SHA}`: run `{data["run_id"]}` attempt `{data["attempt"]}`, candidate `{data["candidate_id"]}`, live/TTS PASS. Главная `/` завершена в текущей ancestry; Pixelmatch PR #551, A04 PR #624 and Baptist research PR #625 уже влиты; Astro 7 остаётся отдельной активной lane. Evidence: `reverify/{REVERIFY_NAME}`.'
              )
              text = replace_once(text, r'^⚠️ Deploy-формулировки в исторических строках ниже сохраняют состояние соответствующей даты\..*$', note, 'authority note', re.MULTILINE)
              prod_row = (
                  f'| AUDIT-PRODUCTION-EVIDENCE-IMPORT-GAP | ✅ **FIXED/EXACT PRODUCTION+LEDGER RECONCILED 2026-07-31.** Source, release, control plane, live pointer and immutable manifest converge at `{EXPECTED_SHA}`. Run `{data["run_id"]}` attempt `{data["attempt"]}` published candidate `{data["candidate_id"]}` / `{data["digest"]}`; generic and TTS live artifacts passed and source PR #{SOURCE_PR} received machine ledger comment `{comment_id}`. A later source merge requires a new current-head witness but does not invalidate this immutable release record. | `{EXPECTED_SHA[:8]}` production run `{data["run_id"]}` |'
              )
              text = replace_once(text, r'^\| AUDIT-PRODUCTION-EVIDENCE-IMPORT-GAP \|.*$', prod_row, 'production row', re.MULTILINE)
              ssot_row = (
                  f'| AUDIT-SSOT-CURRENT-HEAD-DRIFT | ✅ **FIXED/RECONCILED 2026-07-31.** Operational SSOT records exact source/production authority `{EXPECTED_SHA}`, deploy run `{data["run_id"]}`, candidate/live/TTS identities, completed homepage closure and protected ownership of Astro 7. AuditRepo synchronization PR #{AUDIT_PR} changes no source product code and leaves counters unchanged. | `{EXPECTED_SHA[:8]}` source+production import |'
              )
              text = replace_once(text, r'^\| AUDIT-SSOT-CURRENT-HEAD-DRIFT \|.*$', ssot_row, 'SSOT row', re.MULTILINE)
              text = replace_once(text, r'^## Статистика \(обновлено .*\)$', f'## Статистика (обновлено 2026-07-31: source = production `{EXPECTED_SHA[:8]}`; homepage/Pixelmatch exact release reconciled)', 'stats heading', re.MULTILINE)
              session = (
                  f'- **2026-07-31 — source/production convergence `{EXPECTED_SHA[:8]}` and homepage closure reconciliation** — PR #{SOURCE_PR} migrated Pixelmatch to 7.2.0 through controlled ESM loading, preserved checkerboard:false semantics and every visual baseline, and did not change homepage components. Deploy run `{data["run_id"]}` attempt `{data["attempt"]}` built candidate `{data["candidate_id"]}` (`{data["digest"]}`), promoted the same bytes and produced generic/TTS live PASS; the public pointer and immutable manifest were independently read back. AuditRepo PR #{AUDIT_PR} synchronizes `NEXT_AGENT_PROMPT`, this masthead/session log and the paired reverify; counters remain 164 closed / 192 open. Evidence: `reverify/{REVERIFY_NAME}`.\n\n'
              )
              old_session = r'^- \*\*2026-07-31 — source/production convergence `ca8c8130` and homepage closure reconciliation\*\* — .*?Evidence: `reverify/CURRENT_HEAD_REVERIFY_2026-07-31_ca8c8130_exact-production-home-closure\.md`\.\n\n'
              text = replace_once(text, old_session, session, 'session log', re.MULTILINE)
              MATRIX_PATH.write_text(text, encoding='utf-8')

          def build_reverify(envelope: dict[str, Any], data: dict[str, Any], current: dict[str, Any], manifest: dict[str, Any], comment_id: int) -> str:
              c = data['candidate']
              la = data['live_artifact']
              ta = data['tts_artifact']
              selected = {
                  'schemaVersion': manifest.get('schemaVersion'),
                  'repository': manifest.get('repository'),
                  'releaseSha': manifest.get('releaseSha'),
                  'controlPlaneSha': manifest.get('controlPlaneSha'),
                  'immutablePath': manifest.get('immutablePath'),
                  'workflow': manifest.get('workflow'),
                  'artifact': manifest.get('artifact'),
                  'build': manifest.get('build'),
                  'criticalAssets': manifest.get('criticalAssets'),
                  'tts': (manifest.get('extensions') or {}).get('tts'),
              }
              return f'''# CURRENT HEAD REVERIFY — exact production and homepage closure

          **Date:** 2026-07-31
          **Source repository:** `{SOURCE_REPO}`
          **Exact source main:** `{EXPECTED_SHA}`
          **Source owner PR:** `#{SOURCE_PR}`
          **AuditRepo base:** `{AUDIT_BASE}`
          **AuditRepo synchronization PR:** `#{AUDIT_PR}`
          **Status:** `SOURCE = RELEASE = CONTROL PLANE = LIVE = TTS`

          ## 1. Scope and authority

          This reverify closes the current-head source/deploy boundary and stale AuditRepo SSOT. It does not modify source product code, continue Astro 7, rewrite visual baselines or reinterpret historical bug counts.

          Source `main` was checked immediately before acceptance and remained `{EXPECTED_SHA}`. PR #{SOURCE_PR} is the exact merged owner of this SHA.

          ## 2. Homepage result

          The native premium `/` route is complete in current ancestry. Its accepted chain includes the premium responsive index, canonical direction artwork, safe marginalia rails, mobile odd-card behavior, reduced-motion suppression, the authored H1 dash, source-language/citation corrections and the semantic About drop cap.

          PR #{SOURCE_PR} changed exactly the Pixelmatch dependency/lockfile, migration documentation, functional contract and controlled dynamic import path. `checkerboard: false` preserves the approved Pixelmatch 5 alpha semantics; every visual baseline was retained. MAIN INDEX is not an unfinished implementation lane.

          ## 3. Exact immutable release

          | Field | Exact value |
          |---|---|
          | Release SHA | `{EXPECTED_SHA}` |
          | Control-plane SHA | `{EXPECTED_SHA}` |
          | Deploy run | `{data['run_id']}` attempt `{data['attempt']}` |
          | Candidate ID | `{data['candidate_id']}` |
          | Candidate tree digest | `{data['digest']}` |
          | Candidate files | `{c['files']}` |
          | Candidate bytes | `{c['bytes']}` |
          | Immutable path | `{data['immutable_path']}` |
          | Source ledger comment | `{comment_id}` on PR `#{SOURCE_PR}` |

          ### Transport and live artifacts

          | Artifact | ID | Digest | Bytes |
          |---|---:|---|---:|
          | `{c['transportArtifact']['name']}` | `{c['transportArtifact']['id']}` | `{c['transportArtifact']['digest']}` | `{c['transportArtifact']['bytes']}` |
          | `{la['name']}` | `{la['id']}` | `{la['digest']}` | `{la['bytes']}` |
          | `{ta['name']}` | `{ta['id']}` | `{ta['digest']}` | `{ta['bytes']}` |

          ## 4. Independent live readback

          The AuditRepo writer fetched the public current pointer with cache bypass and then fetched the SHA/run-addressed immutable manifest.

          ```json
          {json.dumps(current, ensure_ascii=False, indent=2)}
          ```

          Selected immutable-manifest evidence:

          ```json
          {json.dumps(selected, ensure_ascii=False, indent=2)}
          ```

          The readback matched the trusted machine envelope on SHA, run ID/attempt, candidate ID, digest, file/byte counts and immutable path. The manifest pins Node `{(manifest.get('build') or {}).get('node')}` and npm `{(manifest.get('build') or {}).get('npm')}` and includes critical home/sitemap/feed/Pagefind/service-worker and TTS asset records.

          ## 5. Machine release envelope

          ```json
          {json.dumps(envelope, ensure_ascii=False, indent=2)}
          ```

          ## 6. Active-lane exclusion

          PR #549 — Astro 7 — remains an independent protected owner. It was not modified, rebased, merged, closed or cleaned up by this lane.

          ## 7. Cleanup and final-tree contract

          - source `main` contains no temporary Pixelmatch writer/exporter/bootstrap/reconcile workflow;
          - this one-shot AuditRepo workflow deletes itself before the final commit;
          - the superseded ca8 current-head reverify is removed rather than retained as a second current authority;
          - final AuditRepo PR diff contains exactly `NEXT_AGENT_PROMPT.md`, `MASTER_BUG_MATRIX.md` and this reverify;
          - historical raw intakes and remote refs are not silently deleted;
          - matrix counters remain unchanged.

          ## 8. Verdict

          `PASS — exact source main, immutable release candidate, live pointer, immutable manifest, generic live witness and TTS witness converge on {EXPECTED_SHA}. MAIN INDEX is complete; AuditRepo current authority is synchronized; temporary control-plane files are absent.`
          '''.replace('\n          ', '\n').lstrip()

          exact_source()
          envelope, comment_id = wait_for_envelope()
          data = verify_envelope(envelope)
          exact_source()
          current, manifest = verify_live(data)
          exact_source()

          NEXT_PATH.write_text(build_next(data, comment_id), encoding='utf-8')
          patch_matrix(data, comment_id)
          REVERIFY_PATH.write_text(build_reverify(envelope, data, current, manifest, comment_id), encoding='utf-8')
          if OLD_REVERIFY.exists():
              OLD_REVERIFY.unlink()
          WORKFLOW_PATH.unlink()

          for path in (NEXT_PATH, MATRIX_PATH, REVERIFY_PATH):
              lines = path.read_text(encoding='utf-8').splitlines()
              path.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')

          for command in (
              ['python3', 'scripts/validate_audit_repo.py'],
              ['python3', 'scripts/check_auditrepo_structure.py'],
          ):
              result = subprocess.run(command, cwd=ROOT, text=True)
              require(result.returncode == 0, f'validator failed: {command}')

          print(json.dumps({
              'result': 'PASS',
              'source': EXPECTED_SHA,
              'runId': data['run_id'],
              'candidateId': data['candidate_id'],
              'digest': data['digest'],
