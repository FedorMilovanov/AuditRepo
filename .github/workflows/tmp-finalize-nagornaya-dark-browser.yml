name: Finalize Nagornaya dark browser authority

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: finalize-nagornaya-dark-pr-153
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.number == 153
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/nagornaya-dark-browser-computed-20260804
          fetch-depth: 0

      - name: Correct refined machine authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "850429a299a6118db85811602fdb661b81b2296f"
          git merge-base --is-ancestor origin/main HEAD
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('projects/gb-is-my-strength')
          matrix_path = root / 'verified/MASTER_BUG_MATRIX.md'
          reverify_path = root / 'reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-browser.md'
          matrix = matrix_path.read_text(encoding='utf-8')
          reverify = reverify_path.read_text(encoding='utf-8')

          def replace_exact(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one exact match, got {count}')
              return text.replace(old, new, 1)

          corrections = [
              (
                  '| `text-blue-600` | 41 | 3.40:1 | 34 / 36 visible samples |',
                  '| `text-blue-600` | 41 | 3.40:1 | 8 / 10 refined textual samples; 26 graphic/icon samples pass 3:1 |',
                  'blue refined count',
              ),
              (
                  '| `text-rose-600` | 41 | 3.74:1 | 24 / 24 |',
                  '| `text-rose-600` | 41 | 3.74:1 | 4 / 4 refined textual samples; emoji excluded |',
                  'rose refined count',
              ),
              (
                  '| `text-purple-600` | 40 | 3.27:1 | 34 / 34 |',
                  '| `text-purple-600` | 40 | 3.27:1 | 4 / 4 refined textual samples; 28 graphic/icon samples pass 3:1 |',
                  'purple refined count',
              ),
              (
                  '| `bg-stone-200` | 2 | 1.05:1 | 4 / 4 text samples + 4 light islands |',
                  '| `bg-stone-200` | 2 | — | 4 light islands; emoji-only tiles excluded from text scoring |',
                  'stone refined count',
              ),
              (
                  '`bg-stone-200` is both a contrast failure and a confirmed light island. The other eight are text-contrast failures.',
                  '`bg-stone-200` is a confirmed light island; the other eight are text-contrast failures.',
                  'stone refined summary',
              ),
          ]
          for old, new, label in corrections:
              reverify = replace_exact(reverify, old, new, label)

          def replace_row(text, finding, row):
              pattern = re.compile(rf'(?m)^\| {re.escape(finding)} \|.*$')
              matches = pattern.findall(text)
              if len(matches) != 1:
                  raise SystemExit(f'{finding}: expected one row, got {len(matches)}')
              return pattern.sub(row, text, count=1)

          matrix = replace_row(
              matrix,
              'NG-DARK-05',
              '| NG-DARK-05 | ✅ **DUPLICATE / MERGED INTO `NG-DARK-01`; REFINED BROWSER BOUNDARY 2026-08-04.** Refined Chromium run `30908030497` removes `bg-stone-100` from the repair boundary because the effective body cascade is dark and readable. The two `bg-stone-200` source uses produce four browser-confirmed light-island observations across desktop/mobile chapters 3 and 5; emoji-only tiles are not scored as ordinary text. The remaining repair owner is open `NG-DARK-01`, so this aggregate row stays closed. No Product mutation, production or TTS claim. | `f9d01207` run `30908030497` |',
          )
          matrix = replace_row(
              matrix,
              'NG-DARK-01',
              '| NG-DARK-01 | 🟠 **CURRENT / BROWSER-CONFIRMED NATIVE DARK RESIDUAL 2026-08-04: 9 TOKENS / 142 SOURCE USES.** Exact Product `f9d0120718569c510833dba7a3abd68ce2f6a003` passed the permanent nine-route native Astro contract and production-like build. Refined Chromium run `30908030497` covered 9 routes × desktop/mobile × light/dark = 36 observations with zero meaningful runtime/overflow errors. Confirmed textual failures: `text-blue-600` (41 source uses; 8/10 refined textual samples; minimum 3.40:1; icon/graphic samples pass 3:1), `text-rose-600` (41; 4/4; 3.74:1; emoji excluded), `text-purple-600` (40; 4/4; 3.27:1; graphic samples pass 3:1), `text-purple-700` (12; 24/24; 2.52:1), `text-teal-700` (3; 6/6; 3.21:1), `text-orange-700` (1; 2/2; 3.40:1), `text-red-600` (1; 2/2; 3.64:1), `text-rose-700` (1; 2/2; 2.84:1). `bg-stone-200` (2 source uses) produces four light-island observations; emoji-only question tiles are not scored as ordinary text. Ten source-residual tokens / 301 uses are not promoted because they are remapped/readable, static-but-readable, effectively body-covered, or an unproven subtle decorative border. Repair only this confirmed set and add a permanent computed-style gate. No Product mutation, live-production or TTS claim. | `f9d01207` run `30908030497`; artifact `8892026949` |',
          )

          if '## ✅ ЗАКРЫТО (213)' not in matrix or '## 🟠 P1 — ОТКРЫТО (70)' not in matrix:
              raise SystemExit('canonical counters drift')
          if matrix.count('| NG-DARK-01 |') != 1:
              raise SystemExit('NG-DARK-01 single-writer drift')

          matrix_path.write_text(matrix, encoding='utf-8')
          reverify_path.write_text(reverify, encoding='utf-8')
          PY

          rm -f .github/tmp/nagornaya_final_correction_trigger.txt
          rm -f .github/workflows/tmp-finalize-nagornaya-dark-browser.yml

      - name: Validate bounded correction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          printf '%s\n' \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-browser.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md > "${changed_file}"
          export AUDITREPO_CHANGED_PATHS_FILE="${changed_file}"
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py --verbose --json-out reports/matrix-coverage/report.json
          python3 scripts/matrix_coverage_contexts.py --json-out reports/matrix-coverage/contexts.json --markdown-out reports/matrix-coverage/contexts.md
          rm -rf reports/matrix-coverage
          expected="$(printf '%s\n' \
            .github/tmp/nagornaya_final_correction_trigger.txt \
            .github/workflows/tmp-finalize-nagornaya-dark-browser.yml \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-browser.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md | sort)"
          test "$(git diff --name-only | sort)" = "${expected}"

      - name: Commit self-cleaned correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit(gb): align Nagornaya refined sample authority'
          git push origin HEAD:verify/nagornaya-dark-browser-computed-20260804
