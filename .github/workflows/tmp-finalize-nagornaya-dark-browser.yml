name: Finalize Nagornaya dark browser authority

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: finalize-nagornaya-dark-pr-153
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.number == 153
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact verifier branch
        uses: actions/checkout@v4
        with:
          ref: verify/nagornaya-dark-browser-computed-20260804
          fetch-depth: 0

      - name: Guard exact base and materialize canonical transaction
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "850429a299a6118db85811602fdb661b81b2296f"
          git merge-base --is-ancestor origin/main HEAD
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('projects/gb-is-my-strength')
          matrix_path = root / 'verified/MASTER_BUG_MATRIX.md'
          handoff_path = root / 'NEXT_AGENT_PROMPT.md'
          reverify_path = root / 'reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-browser.md'
          matrix = matrix_path.read_text(encoding='utf-8')
          handoff = handoff_path.read_text(encoding='utf-8')

          def replace_one(text, pattern, replacement, label):
              regex = re.compile(pattern, re.M)
              matches = regex.findall(text)
              if len(matches) != 1:
                  raise SystemExit(f'{label}: expected one match, got {len(matches)}')
              return regex.sub(replacement, text, count=1)

          matrix = replace_one(
              matrix,
              r'^\| Source verification anchor \|.*$',
              '| Source verification anchor | `f9d0120718569c510833dba7a3abd68ce2f6a003` (native Astro production-like Chromium: `NG-DARK-01` narrowed from 19 tokens / 443 source uses to **9 browser-confirmed tokens / 142 source uses**; 36/36 route-theme-viewport observations, 0 meaningful runtime/overflow errors; no Product mutation, live-production or TTS claim). |',
              'matrix source anchor',
          )
          matrix = replace_one(
              matrix,
              r'^\| Last reverify \|.*$',
              '| Last reverify | `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-browser.md` |',
              'matrix last reverify',
          )

          rows = {
              'NG-BODY-01': '| NG-BODY-01 | ✅ **BROWSER-COVERED DUPLICATE / MERGED INTO `NG-DARK-01`; CURRENT CLASS, NO CURRENT VISUAL FAILURE 2026-08-04.** Exact Product `f9d0120718569c510833dba7a3abd68ce2f6a003` native production-like Chromium covered all nine Nagornaya routes at desktop/mobile in light/dark mode. Built `/nagornaya/`, `/nagornaya/istochniki/` and `/nagornaya/nakhodki/` retain `bg-stone-100`, but computed dark body surfaces are `[14,17,22]` on every route, no light islands or text failures occur, and light mode remains light. PR #150’s source-only FIXED wording and PR #152’s pending-browser wording are superseded. No Product mutation, production or TTS claim. | `f9d01207` |',
              'NG-DARK-04': '| NG-DARK-04 | ✅ **BROWSER-COVERED DUPLICATE / MERGED INTO `NG-DARK-01` 2026-08-04.** Native production-like Chromium confirms all current `bg-rose-50` uses are dark-remapped without text/graphic failures or light islands. This row has no independent repair owner. No Product mutation, production or TTS claim. | `f9d01207` |',
              'NG-DARK-05': '| NG-DARK-05 | ✅ **AGGREGATE DUPLICATE / MERGED INTO `NG-DARK-01`; BROWSER BOUNDARY RECONCILED 2026-08-04.** `bg-stone-100` is effectively covered by the native dark cascade on every current body route, while the two `bg-stone-200` source uses remain bright question-tile islands in chapters 3 and 5 and are retained only under open root `NG-DARK-01`. The aggregate row remains closed to preserve one repair owner. No Product mutation, production or TTS claim. | `f9d01207` |',
              'NG-MOBILE-01': '| NG-MOBILE-01 | ✅ **AGGREGATE DUPLICATE / MERGED; BROWSER OWNER LINKS RECONCILED 2026-08-04.** Desktop/mobile Chromium proves the native `bg-stone-100` body subset is visually covered; it is not a remaining mobile failure. Chapter-specific TOC accent remains owned by open `NG-TOC-01`; inline hero height/adaptivity remains owned by open `NG-A11Y-01`; the confirmed dark-colour residual remains owned only by open `NG-DARK-01`. No Product mutation, production or TTS claim. | `f9d01207` |',
              'NG-DARK-01': '| NG-DARK-01 | 🟠 **CURRENT / BROWSER-CONFIRMED NATIVE DARK RESIDUAL 2026-08-04: 9 TOKENS / 142 SOURCE USES.** Exact Product `f9d0120718569c510833dba7a3abd68ce2f6a003` passed the permanent nine-route native Astro contract and production-like build. Chromium covered 9 routes × desktop/mobile × light/dark = 36 observations with zero meaningful runtime/overflow errors. Confirmed failures: `text-blue-600` (41 source uses; textual minimum 3.40:1), `text-rose-600` (41; 3.74:1), `text-purple-600` (40; 3.27:1), `text-purple-700` (12; 2.52:1), `text-teal-700` (3; 3.21:1), `bg-stone-200` (2; four bright islands), `text-orange-700` (1; 3.40:1), `text-red-600` (1; 3.64:1), `text-rose-700` (1; 2.84:1). Ten source-residual tokens / 301 uses are not promoted: they are remapped/readable, static-but-readable, effectively body-covered, or a subtle decorative border without text/graphic failure. Repair only the confirmed set and add a permanent computed-style gate. No Product mutation, live-production or TTS claim. | `f9d01207` run `30908030497`; artifact `8892026949` |',
          }
          for finding, row in rows.items():
              matrix = replace_one(matrix, rf'^\| {re.escape(finding)} \|.*$', row, f'matrix row {finding}')

          if '## ✅ ЗАКРЫТО (213)' not in matrix or '## 🟠 P1 — ОТКРЫТО (70)' not in matrix:
              raise SystemExit('canonical count headings drift')
          if matrix.count('| NG-DARK-01 |') != 1:
              raise SystemExit('NG-DARK-01 single-writer drift')

          session = '- 2026-08-04 — AuditRepo PR #153: native production-like Chromium narrowed `NG-DARK-01` to 9 browser-confirmed tokens / 142 source uses; 36/36 observations, 0 meaningful errors; counts unchanged; no Product/live-production/TTS claim.'
          if session not in matrix:
              matrix = matrix.rstrip() + '\n' + session + '\n'

          handoff = replace_one(
              handoff,
              r'^\*\*Current reverify:\*\*.*$',
              '**Current reverify:** `reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-browser.md`',
              'handoff current reverify',
          )
          handoff = replace_one(
              handoff,
              r'^Source movement does \*\*not\*\* change canonical AuditRepo counts by itself\..*$',
              'Source movement does **not** change canonical AuditRepo counts by itself. AuditRepo PRs #132, #136–#141, #143–#147 and #149–#152 are merged; PR #142 was closed unmerged after its exact-row gate disproved an incorrect duplicate mapping. AuditRepo PR #153 is the active browser-authority lane for `NG-DARK-01`; counts remain unchanged and the lane makes no Product mutation, live-production or TTS claim.',
              'handoff source movement',
          )
          handoff = replace_one(
              handoff,
              r'^- Product `main@f9d0120718569c510833dba7a3abd68ce2f6a003` remains source authority\..*$',
              '- Product `main@f9d0120718569c510833dba7a3abd68ce2f6a003` remains source authority. Native production-like Chromium narrows `NG-DARK-01` to **9 browser-confirmed tokens / 142 source uses**. `bg-stone-100` body surfaces are effectively covered; `border-stone-100` is remapped and not promoted without an independent UI-boundary failure. `NG-INLINE-01` and `NG-SEO-01` remain open independently.',
              'handoff Product authority',
          )
          handoff = replace_one(
              handoff,
              r'^- PR #152 \(`verify/nagornaya-dark-native-dist-authority-20260804`\).*$|^- PR #153 \(`verify/nagornaya-dark-browser-computed-20260804`\).*$',
              '- PR #153 (`verify/nagornaya-dark-browser-computed-20260804`) is the active browser-authority lane for `NG-DARK-01`; its final diff is bounded to the matrix, this handoff and the paired browser reverify document.',
              'handoff AuditRepo lane',
          )
          handoff = replace_one(
              handoff,
              r'^1\. Merge AuditRepo PR #15[23].*$',
              '1. Merge AuditRepo PR #153 only after exact-head validator, matrix coverage and repository-history forensic checks pass; preserve disjoint TTS lanes.',
              'handoff next work 1',
          )
          handoff = replace_one(
              handoff,
              r'^2\. Use only the native production-like dist residual.*$',
              '2. Open a bounded Product repair only for the **9 browser-confirmed tokens / 142 source uses** under `NG-DARK-01`; add a permanent native production-like Chromium gate and do not modify the 10 browser-readable/effectively-covered token groups without new evidence.',
              'handoff next work 2',
          )

          confirmed = [
              ('text-blue-600', 41, '3.40:1', '8 / 10', '`/nagornaya/chast-1/` textual labels; SVG/icon colour passes 3:1'),
              ('text-rose-600', 41, '3.74:1', '4 / 4', '`/nagornaya/chast-5/` numbered labels; emoji excluded from text scoring'),
              ('text-purple-600', 40, '3.27:1', '4 / 4', '`/nagornaya/chast-3/` numbered labels; graphics pass 3:1'),
              ('text-purple-700', 12, '2.52:1', '24 / 24', '`/nagornaya/chast-3/` category and table text'),
              ('text-teal-700', 3, '3.21:1', '6 / 6', '`/nagornaya/nakhodki/` status labels'),
              ('bg-stone-200', 2, '—', '4 light islands', 'question tiles in chapters 3 and 5'),
              ('text-orange-700', 1, '3.40:1', '2 / 2', '`/nagornaya/chast-2/` badge'),
              ('text-red-600', 1, '3.64:1', '2 / 2', '`/nagornaya/istochniki/` warning label'),
              ('text-rose-700', 1, '2.84:1', '2 / 2', '`/nagornaya/chast-5/` section label'),
          ]
          excluded = [
              ('border-stone-100', 167, 'remapped subtle decorative border; no text/graphic failure'),
              ('text-amber-600', 45, 'remapped; minimum textual contrast 12.05:1'),
              ('text-blue-700', 22, 'remapped; minimum textual contrast 9.75:1'),
              ('text-emerald-700', 15, 'remapped; minimum textual contrast 8.92:1'),
              ('text-emerald-600', 14, 'theme-static but readable; minimum 4.67:1'),
              ('bg-stone-100', 13, 'effective body cascade; dark body RGB [14,17,22] on every route'),
              ('text-amber-800', 11, 'remapped; minimum 12.20:1'),
              ('text-amber-700', 8, 'remapped; minimum 12.20:1'),
              ('text-red-700', 3, 'remapped; minimum 9.27:1'),
              ('text-teal-600', 3, 'theme-static graphic colour; minimum 4.70:1'),
          ]
          confirmed_rows = '\n'.join(f'| `{t}` | {uses} | {ratio} | {fail} | {where} |' for t, uses, ratio, fail, where in confirmed)
          excluded_rows = '\n'.join(f'| `{t}` | {uses} | {reason} |' for t, uses, reason in excluded)
          document = f'''# CURRENT HEAD REVERIFY — Nagornaya dark-theme browser/computed-style authority

- Date: 2026-08-04
- Product anchor: `f9d0120718569c510833dba7a3abd68ce2f6a003`
- AuditRepo base: `850429a299a6118db85811602fdb661b81b2296f`
- Browser authority lane: AuditRepo PR #153
- Canonical owner: `NG-DARK-01`
- Refined workflow run: `30908030497`
- Refined artifact: `8892026949`, digest `sha256:ff3896b0c208b4e385552dd2b1646149b1e441de3fb495cb7d9f08d7697c0b43`
- Product mutation: **none**
- Live-production claim: **none**
- TTS scope: **excluded**

## Authority chain

Product `f9d01207` passed the permanent native Nagornaya route contract and `strangler:build:production-like`. Chromium then loaded all nine built native routes at desktop `1440×900` and mobile `390×844`, in explicit light and dark themes: **36 / 36 observations**.

The refined harness distinguishes normal/large text, SVG/graphic colour and emoji. Normal text requires 4.5:1, large/bold text 3:1, and graphical objects 3:1. Emoji are not scored as CSS-coloured text. A source token is not a defect merely because a dedicated selector is absent.

The initial harness generated one early-document `classList` exception per observation; this was proven to come from the verifier's own pre-document init script and removed. Absolute `https://gospod-bog.ru/...` image CSP blocks on the local `127.0.0.1` server are retained as **184 expected local-origin noise events**, separate from page integrity. The refined run has **0 meaningful page/runtime/overflow errors**.

## Result

The source inventory from PR #152 was 19 tokens / 443 uses. Browser evidence narrows the current Product repair boundary to **9 tokens / 142 source uses**. The remaining **10 tokens / 301 uses** are not browser-confirmed failures.

### Browser-confirmed repair set

| Token | Source uses | Minimum dark contrast | Failing dark samples | Current fixture evidence |
|---|---:|---:|---:|---|
{confirmed_rows}

### Not promoted to Product repair

| Token | Source uses | Browser disposition |
|---|---:|---|
{excluded_rows}

## Body and border conclusions

`bg-stone-100` remains in built markup on `/nagornaya/`, `/nagornaya/istochniki/` and `/nagornaya/nakhodki/`, but the effective dark body background is RGB `[14,17,22]` on every route and viewport; no light island or textual failure exists. `NG-BODY-01` therefore stays closed as a browser-covered duplicate.

`border-stone-100` changes across themes and produces no text or graphic failure. Its minimum decorative border contrast is 1.17:1, but the evidence does not establish that those borders are required UI boundaries. It is not promoted into the repair set without a separate visual/UI-boundary witness.

## Canonical disposition

`NG-DARK-01` remains **OPEN / CURRENT P1**, narrowed to the nine browser-confirmed token groups above. Canonical arithmetic remains **358 = 213 closed + 145 open**, P1 **70**. The next Product lane must repair only the confirmed set and add a permanent native production-like Chromium acceptance gate.

No Product source was changed, and this evidence is not a same-SHA live-production witness.
'''

          matrix_path.write_text(matrix, encoding='utf-8')
          handoff_path.write_text(handoff, encoding='utf-8')
          reverify_path.write_text(document, encoding='utf-8')
          PY

          rm -f .github/tmp/nagornaya_dark_browser_executor_v2.sh
          rm -f .github/tmp/nagornaya_dark_browser_refined.js
          rm -f .github/tmp/nagornaya_refined_trigger.txt
          rm -f .github/workflows/tmp-nagornaya-dark-browser-refined.yml
          rm -f .github/workflows/tmp-finalize-nagornaya-dark-browser.yml

      - name: Validate bounded canonical transaction
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          printf '%s\n' \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-browser.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md > "${changed_file}"
          export AUDITREPO_CHANGED_PATHS_FILE="${changed_file}"
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p reports/matrix-coverage
          python3 scripts/check_matrix_coverage.py --verbose --json-out reports/matrix-coverage/report.json
          python3 scripts/matrix_coverage_contexts.py --json-out reports/matrix-coverage/contexts.json --markdown-out reports/matrix-coverage/contexts.md
          rm -rf reports/matrix-coverage
          expected="$(printf '%s\n' \
            .github/tmp/nagornaya_dark_browser_executor_v2.sh \
            .github/tmp/nagornaya_dark_browser_refined.js \
            .github/tmp/nagornaya_refined_trigger.txt \
            .github/workflows/tmp-finalize-nagornaya-dark-browser.yml \
            .github/workflows/tmp-nagornaya-dark-browser-refined.yml \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-04_f9d01207_nagornaya-dark-browser.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md | sort)"
          test "$(git diff --name-only | sort)" = "${expected}"

      - name: Commit self-cleaned authority
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit(gb): narrow Nagornaya dark residual by Chromium'
          git push origin HEAD:verify/nagornaya-dark-browser-computed-20260804
