name: Temporary exact production SSOT writer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tmp-gb-current-head-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/gb-current-head-production-sync-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact synchronization head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure bounded writer identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Wait for and verify exact source production
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/tmp_sync_gb_current_head.py

      - name: Assert temporary control plane self-deleted
        run: |
          test ! -e scripts/tmp_sync_gb_current_head.py
          test ! -e .github/workflows/tmp-gb-current-head-sync.yml
          git diff --check

      - name: Commit final audit-only reconciliation
        run: |
          git add -A
          test -n "$(git status --short)"
          git commit -m "audit(gb): reconcile exact current production authority"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Verify final bounded diff
        run: |
          git fetch --no-tags origin "+main:refs/remotes/origin/main"
          printf '%s\n' \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-07-31_b3ed559f_exact-production-home-closure.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            | sort > /tmp/expected-files.txt
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test ! -e scripts/tmp_sync_gb_current_head.py
          test ! -e .github/workflows/tmp-gb-current-head-sync.yml
