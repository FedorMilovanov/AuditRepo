name: Temporary exact production SSOT writer

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tmp-gb-current-head-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/gb-current-head-production-sync-20260731'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact synchronization head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Configure bounded writer identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Retarget one-shot writer to exact current source head
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/tmp_sync_gb_current_head.py')
          text = path.read_text(encoding='utf-8')
          old_sha = 'b3ed559f82756ad160c18a90d5405b29caab749d'
          new_sha = 'ca8c8130a1ec7d9b12cc14e9274fe2ba855076a1'
          text = text.replace('SOURCE_PR = 569', 'SOURCE_PR = 624')
          text = text.replace(old_sha, new_sha)
          text = text.replace('b3ed559f_exact-production-home-closure', 'ca8c8130_exact-production-home-closure')
          text = text.replace('PR #569 is not the exact merged owner of the expected SHA', 'PR #624 is not the exact merged owner of the expected SHA')
          text = text.replace('timed out waiting for the exact deployment-release-witness on PR #569', 'timed out waiting for the exact deployment-release-witness on PR #624')
          text = text.replace(
              'match = re.search(r"```json\\s*(\\{[\\s\\S]*?\\})\\s*```", body)',
              'match = re.search(r"```json\\s*([\\s\\S]*?)\\s*```", body)',
          )
          text = text.replace(
              'f"| Source HEAD | `{EXPECTED_SHA}` (current source main; PR #{SOURCE_PR} pinned Node 22.23.1/npm 10.9.8; "',
              'f"| Source HEAD | `{EXPECTED_SHA}` (current source main; PR #{SOURCE_PR} added the bounded A04 tooltip/Bible ownership contract and route-wide witnesses; Node 22.23.1/npm 10.9.8 remains inherited; "',
          )
          text = text.replace(
              'f"- **2026-07-31 — source/production convergence `{EXPECTED_SHA[:8]}` and homepage closure reconciliation** — PR #{SOURCE_PR} merged the exact Node 22.23.1/npm 10.9.8 toolchain pin without redesigning the completed premium homepage. "',
              'f"- **2026-07-31 — source/production convergence `{EXPECTED_SHA[:8]}` and homepage closure reconciliation** — PR #{SOURCE_PR} merged the bounded A04 ownership/runtime witness and nested-glossary policy fix on the inherited Node 22.23.1/npm 10.9.8 main without changing the completed premium homepage. "',
          )
          text = text.replace('homepage/toolchain exact release reconciled', 'homepage/current-head exact release reconciled')
          text = text.replace('Astro 7/Pixelmatch/A04/Baptists остаются отдельными активными lanes.', 'Astro 7 and Pixelmatch remain separate active lanes; A04 PR #624 and Baptist research PR #625 are already in current ancestry.')
          text = text.replace('- Bible/glossary/tooltip ownership A04 — PR #624;\n', '')
          text = text.replace('- Baptist book/research integration — PR #625;\n', '')
          text = text.replace('does not continue Astro 7/Pixelmatch/A04/Baptists work', 'does not continue Astro 7 or Pixelmatch work and does not expand the merged A04/Baptist scopes')
          text = text.replace(
              'The later Actions and Node toolchain commits changed control-plane/toolchain files, not the homepage design or visual baselines.',
              'The later Actions/Node commits, Baptist research merge and current A04 policy/test merge changed control-plane, research or tooltip-contract surfaces, not the homepage design or visual baselines.',
          )
          text = text.replace('- PR #624 — Bible/glossary/tooltip A04;\n', '')
          text = text.replace('- PR #625 — Baptist book/research integration.\n', '')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Wait for and verify exact source production
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python3 scripts/tmp_sync_gb_current_head.py

      - name: Normalize generated audit markdown and assert cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for rel in (
              'projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md',
              'projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-07-31_ca8c8130_exact-production-home-closure.md',
          ):
              path = Path(rel)
              lines = path.read_text(encoding='utf-8').splitlines()
              path.write_text('\n'.join(line.rstrip() for line in lines) + '\n', encoding='utf-8')
          PY
          test ! -e scripts/tmp_sync_gb_current_head.py
          test ! -e .github/workflows/tmp-gb-current-head-sync.yml
          git diff --check

      - name: Commit final audit-only reconciliation
        run: |
          git add -A
          test -n "$(git status --short)"
          git commit -m "audit(gb): reconcile exact current production authority"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Verify final bounded diff
        run: |
          git fetch --no-tags origin "+main:refs/remotes/origin/main"
          printf '%s\n' \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-07-31_ca8c8130_exact-production-home-closure.md \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md \
            | sort > /tmp/expected-files.txt
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          test ! -e scripts/tmp_sync_gb_current_head.py
          test ! -e .github/workflows/tmp-gb-current-head-sync.yml
