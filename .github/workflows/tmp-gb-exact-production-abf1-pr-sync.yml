name: One-shot gb exact production PR reconciliation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gb-exact-production-abf1-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/gb-exact-production-sync-abf1edba-20260801'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize verified authority and clean bootstrap
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from check_matrix_coverage import generate_reconciliation_artifact
          generate_reconciliation_artifact()
          PY

          generated='reports/matrix-coverage/generated'
          test -f "$generated/manifest.json"
          test "$(python3 -c 'import json; print(json.load(open("reports/matrix-coverage/generated/manifest.json"))["sourceSha"])')" = 'abf1edba190280e554dfda085bef9fb6594c896d'

          cp "$generated/NEXT_AGENT_PROMPT.md" \
            projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md
          cp "$generated/MASTER_BUG_MATRIX.md" \
            projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md
          cp "$generated/CURRENT_HEAD_REVERIFY_2026-08-01_abf1edba_exact-production-windows-astro-closure.md" \
            projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-01_abf1edba_exact-production-windows-astro-closure.md

          git fetch origin main
          test "$(git rev-parse origin/main)" = 'f912bd91d21f6a20c6ded670b7c40fb05339ec9b'
          git show origin/main:scripts/check_matrix_coverage.py > scripts/check_matrix_coverage.py

          rm -rf reports/matrix-coverage
          rmdir reports 2>/dev/null || true
          rm -f \
            scripts/tmp_abf1_reconcile_artifact.py \
            .github/gb-abf1-sync-bootstrap.md \
            .github/workflows/tmp-gb-exact-production-abf1-sync.yml \
            .github/workflows/tmp-gb-exact-production-abf1-pr-sync.yml

          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py

          expected="$(printf '%s\n' \
            'projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md' \
            'projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-01_abf1edba_exact-production-windows-astro-closure.md' \
            'projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md' | sort)"
          actual="$(git diff --name-only origin/main -- | sort)"
          test "$actual" = "$expected"
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'audit(gb): reconcile abf1edba exact production and Windows closure'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
