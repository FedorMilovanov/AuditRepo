name: Complete Nagornaya dark Chromium classification

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

concurrency:
  group: nagornaya-dark-browser-pr-153
  cancel-in-progress: false

jobs:
  classify:
    if: github.event.pull_request.number == 153
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout exact AuditRepo branch
        uses: actions/checkout@v4
        with:
          ref: verify/nagornaya-dark-browser-computed-20260804
          fetch-depth: 0

      - name: Guard canonical AuditRepo base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "850429a299a6118db85811602fdb661b81b2296f"
          git merge-base --is-ancestor origin/main HEAD

      - name: Checkout exact Product source
        uses: actions/checkout@v4
        with:
          repository: FedorMilovanov/gb-is-my-strength
          ref: f9d0120718569c510833dba7a3abd68ce2f6a003
          path: _product
          persist-credentials: false

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: _product/package-lock.json

      - name: Build and measure exact native output
        shell: bash
        run: bash .github/tmp/nagornaya_dark_browser_executor_v2.sh

      - name: Upload raw browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: nagornaya-dark-browser-evidence
          path: _browser-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Validate, self-clean and commit evidence
        shell: bash
        run: bash .github/tmp/nagornaya_dark_browser_executor.sh finalize
