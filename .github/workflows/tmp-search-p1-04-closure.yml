name: Complete SEARCH-P1-04 AuditRepo closure

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: search-p1-04-audit-closure-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'lane/search-p1-04-closure-20260804'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Set up canonical Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Set up canonical Node
        uses: actions/setup-node@1e60f620b9541dca1515402f637f8a2f8a0b326b # v4.0.3
        with:
          node-version: '22.12.0'
      - name: Execute self-clean SSOT transaction
        shell: bash
        run: bash .github/tmp/run_search_p1_04_closure.sh
