name: Complete SEARCH-P2-08 AuditRepo closure

on:
  pull_request:
    branches: [main]
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: search-p2-08-auditrepo-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'autofix') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'lane/search-p2-08-closure-20260805'
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Checkout exact closure branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Validate helper syntax
        run: python3 -m py_compile .github/tmp/search_p2_08_closure.py

      - name: Apply exact three-owner SSOT transaction
        shell: python
        run: |
          import importlib.util
          import subprocess

          spec = importlib.util.spec_from_file_location(
              "search_p2_08_closure",
              ".github/tmp/search_p2_08_closure.py",
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def exact_inventory():
              tracked = subprocess.run(
                  ["git", "diff", "--name-only", module.BASE_SHA, "--"],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout.splitlines()
              untracked = subprocess.run(
                  ["git", "ls-files", "--others", "--exclude-standard"],
                  check=True,
                  text=True,
                  capture_output=True,
              ).stdout.splitlines()
              return set(filter(None, tracked + untracked))

          module.changed_from_base = exact_inventory
          module.apply()

          matrix = module.MATRIX.read_text(encoding="utf-8")
          summary_replacements = [
              ("| Закрыто (fixed) | 222 |", "| Закрыто (fixed) | 223 |", "fixed summary"),
              ("| P2 открыто | 33 |", "| P2 открыто | 32 |", "P2 summary"),
              ("| **Всего открыто (матрица)** | **149** |", "| **Всего открыто (матрица)** | **148** |", "total-open summary"),
          ]
          for old, new, label in summary_replacements:
              count = matrix.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              matrix = matrix.replace(old, new, 1)
          module.MATRIX.write_text(matrix, encoding="utf-8")

      - name: Prepare exact changed-path authority
        shell: bash
        run: |
          changed_file="${RUNNER_TEMP}/auditrepo-changed-paths.txt"
          cat > "${changed_file}" <<'EOF'
          projects/gb-is-my-strength/NEXT_AGENT_PROMPT.md
          projects/gb-is-my-strength/reverify/CURRENT_HEAD_REVERIFY_2026-08-05_b8882bf0_legacy-verse-authority-closure.md
          projects/gb-is-my-strength/verified/MASTER_BUG_MATRIX.md
          EOF
          cat "${changed_file}"
          echo "AUDITREPO_CHANGED_PATHS_FILE=${changed_file}" >> "${GITHUB_ENV}"

      - name: Validate AuditRepo structure and rules
        run: |
          python3 scripts/check_auditrepo_structure.py
          python3 scripts/validate_audit_repo.py
          python3 scripts/validate_audit_repo_regression_test.py

      - name: Validate matrix coverage control plane
        run: |
          python3 -m py_compile \
            scripts/check_matrix_coverage.py \
            scripts/matrix_coverage_lib.py \
            scripts/matrix_coverage_contexts.py \
            scripts/matrix_coverage_regression_test.py
          python3 scripts/matrix_coverage_regression_test.py
          mkdir -p /tmp/search-p2-08-matrix-coverage
          python3 scripts/check_matrix_coverage.py \
            --verbose \
            --json-out /tmp/search-p2-08-matrix-coverage/report.json
          python3 scripts/matrix_coverage_contexts.py \
            --json-out /tmp/search-p2-08-matrix-coverage/contexts.json \
            --markdown-out /tmp/search-p2-08-matrix-coverage/contexts.md

      - name: Run strict repository-history forensic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/repository_history_forensic_audit.mjs --strict

      - name: Remove generated diagnostics
        shell: bash
        run: |
          rm -f \
            reports/repository-history-forensic-audit.json \
            reports/repository-history-forensic-audit.md
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Self-clean and publish exact three-file head
        shell: python
        run: |
          import importlib.util
          import os
          import subprocess

          spec = importlib.util.spec_from_file_location(
              "search_p2_08_closure",
              ".github/tmp/search_p2_08_closure.py",
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          def command(*args):
              return subprocess.run(args, check=True, text=True, capture_output=True)

          def names(*args):
              return set(filter(None, command(*args).stdout.splitlines()))

          tracked = names("git", "diff", "--name-only", module.BASE_SHA, "--")
          untracked = names("git", "ls-files", "--others", "--exclude-standard")
          prefinal = tracked | untracked
          expected_prefinal = module.PERMANENT | module.TEMPORARY
          if prefinal != expected_prefinal:
              raise SystemExit(f"unexpected pre-finalize scope: {sorted(prefinal)}")

          module.HELPER.unlink(missing_ok=False)
          module.WORKFLOW.unlink(missing_ok=False)
          command("git", "add", "-A")

          staged_vs_head = names("git", "diff", "--cached", "--name-only")
          expected_operations = module.PERMANENT | module.TEMPORARY
          if staged_vs_head != expected_operations:
              raise SystemExit(f"unexpected staged operations: {sorted(staged_vs_head)}")

          final_vs_base = names("git", "diff", "--cached", "--name-only", module.BASE_SHA)
          if final_vs_base != module.PERMANENT:
              raise SystemExit(f"final tree is not exactly three SSOT files: {sorted(final_vs_base)}")

          command("git", "config", "user.name", "github-actions[bot]")
          command("git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
          command("git", "commit", "-m", "audit(search): close SEARCH-P2-08")
          head_ref = os.environ.get("HEAD_REF", "").strip()
          if not head_ref:
              raise SystemExit("HEAD_REF is required")
          command("git", "push", "origin", f"HEAD:{head_ref}")
          print(f"Published clean three-file SSOT head to {head_ref}.")
