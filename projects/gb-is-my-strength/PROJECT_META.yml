project_id: gb-is-my-strength
display_name: gb-is-my-strength / gospod-bog.ru
source_repo: FedorMilovanov/gb-is-my-strength
default_branch: main
production_url: https://gospod-bog.ru
audit_repo_project_path: projects/gb-is-my-strength

rules:
  raw_reports_path: incoming/<agent>/<date>/
  working_path: working/
  verification_path: verification/
  verified_path: verified/
  repairs_path: repairs/
  reverify_path: reverify/
  active_matrix_path: verified/MASTER_BUG_MATRIX.md
  legacy_path: legacy/

required_for_intake:
  - project
  - source_repo
  - audited_anchor
  - branch_or_event_context
  - agent
  - date
  - environment
  - report_type

allowed_report_types:
  - source-audit
  - dist-audit
  - production-like-dist-audit
  - browser-audit
  - visual-audit
  - ci-audit
  - verifier-synthesis
  - reverify
  - repair-plan
  - retirement-review
  - witness-matrix

verification:
  witness_model: proportional-independent-angles
  proof_states:
    - PASS
    - FAIL
    - UNPROVEN
    - N/A
  witness_types:
    - W1-surface
    - W2-source
    - W3-artifact
    - W4-browser-runtime
    - W5-lifecycle-root-cause
    - W6-history
  required_admission_fields:
    - signal-class
    - exact-anchor
    - proof-state
    - claim-boundary
    - preservation-boundary
    - semantic-owner
  retirement_flow:
    - suspected-stale
    - rechecked
    - fixed-current_or_false-positive_or_stale-on-current-head
